# Pack-source consistency gate for the AI-Forward repo ITSELF (not deployed to targets).
# Catches count/skill-list drift, vendored-foundation drift, and malformed eval cases
# before they merge. The deployed graph-health workflow is pack/ci/docs-health.yml.
name: pack-consistency
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pack/**"
      - "tools/**"
      - "tests/**"
      - "docs/**"
      - ".claude/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".github/agents/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "web/**"
      - ".github/copilot-instructions.md"
      - ".github/workflows/pack-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.x" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      # Documented counts + skill/prompt parity must match the filesystem.
      - name: Count & skill-list consistency
        run: python3 tools/check-consistency.py

      # PLAT-B. A tracked, machine-readable file never carries one machine's paths. The
      # coordination registry shipped a Windows python.exe path and only `coord regen` on a
      # Mac noticed; pack-doctor passed because it checked parse, not resolution.
      - name: No machine-specific paths in tracked files
        run: python3 pack/scripts/verify-no-machine-paths.py

      # FR-033. The repository's foundational invariant: pack/ is source, .claude/ and
      # .github/ are generated. verify-bundle.ps1 has always checked this locally and CI
      # never ran it, so source↔install drift — the one failure mode the whole architecture
      # exists to prevent — could merge. A re-sync that produces a diff IS the drift, so
      # `git diff --exit-code` is the whole oracle; it fails the step by itself.
      - name: Source↔install drift (pack/ is the only source of truth)
        shell: pwsh
        run: |
          pwsh tools/sync-pack.ps1
          Write-Host "If the next command fails, pack/ and the generated surfaces have drifted."
          Write-Host "Fix: run 'pwsh tools/sync-pack.ps1' locally and commit the result."
          git --no-pager diff --stat -- .claude .github/instructions .github/prompts .github/agents docs web CLAUDE.md AGENTS.md
          git diff --exit-code -- .claude .github/instructions .github/prompts .github/agents docs web CLAUDE.md AGENTS.md

      # FR-034. The largest suite in the repository (112 tests covering docs-graph,
      # audit-log, check-consistency, pack-doctor, run-evals, bounded_process) was advisory
      # until now — it passed locally and gated nothing.
      - name: Python test suite
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pytest
          python3 -m pytest tests -q

      - name: Docs Explorer core contracts
        run: |
          npm ci
          npm run test:docs-explorer:core

      # FR-051. The public explainer is client-rendered, so a static scan sees a shell and
      # reports clean for the wrong reason (CD20 / class E2E-H). This runs the page's own
      # vendored bundles in a DOM shim and asserts the result: no third-party origin, the
      # libraries define their globals, #root has a real mount, and the WCAG landmarks and
      # skip link exist. Observed failing on the pre-fix page with 12 assertions red.
      - name: Explainer render + accessibility proof
        run: node tools/verify-explainer-render.js

      # FR-034. The knowledge graph gate: schema-valid frontmatter, no dangling links,
      # no orphans, no index drift.
      - name: Knowledge-graph validation
        run: python3 docs/ai-forward-pack/scripts/docs-graph.py validate

      # Vendored-foundation drift
      - name: Vendored-foundation drift
        run: python3 pack/scripts/foundation-check.py

      # FR-052. The audit log is this project's durable memory and the corpus /dream
      # consolidates over. read_log survives a malformed line on purpose, so a corrupted
      # entry would otherwise be invisible to every reader while the tooling reports success.
      - name: Audit log is fully readable
        run: python3 pack/scripts/audit-log.py verify

      # Every eval case is valid JSON with compilable regex assertions.
      - name: Eval cases well-formed
        run: |
          python3 - <<'PY'
          import glob, json, re, sys
          bad = 0
          for f in sorted(glob.glob("pack/evals/cases/*.json")):
              try:
                  case = json.load(open(f, encoding="utf-8"))
                  for a in case.get("assertions", []):
                      if "pattern" in a:
                          re.compile(a["pattern"])
              except Exception as e:
                  print(f"  - {f}: {e}"); bad += 1
          print(f"{len(glob.glob('pack/evals/cases/*.json'))} eval cases checked")
          sys.exit(1 if bad else 0)
          PY

      # FR-072 / P2, reshaped by FR-073. The always-on knowledge set is the static prefix of
      # every model call: re-read every turn, billed every turn, and subtracted from the
      # window before the user has said anything. Ungated it re-grows one "surely one more
      # doc is free" at a time - which is how a profiled session reached a 184K always-on
      # prefix that failed 27 of 39 delegated runs outright.
      #
      # A ratchet, not a ceiling: growth is allowed, growth that leaves the recorded baseline
      # untouched is not. The baseline lives in pack/context-budget.json so the growth shows
      # up in a diff a reviewer can question.
      - name: Always-on context budget
        run: python3 pack/scripts/context-budget.py gate

      # CTX-H: coord-core.py shipped for two revisions switched off, and nothing noticed --
      # an uninstalled layer reports "0 decisions, nothing claimed", which is indistinguishable
      # from a working layer that saw no traffic. This repo is itself a pack install, so its
      # own layer being ON is the only end-to-end proof the install path works. A WARN is
      # expected here: .git/config is per-clone, so a fresh CI checkout never has the driver
      # registered. Only a missing or unparseable registry FAILs.
      - name: Coordination layer installed
        run: |
          python3 pack/scripts/pack-doctor.py --root . --json > pack-doctor.json || true
          python3 -c "import json,sys; c=[x for x in json.load(open('pack-doctor.json'))['checks'] if x['name']=='coordination']; sys.exit('pack-doctor has no coordination check') if not c else None; print(c[0]['status'], '-', c[0]['detail']); sys.exit('coordination layer not installed - fix: ' + c[0]['fix']) if c[0]['status']=='FAIL' else None"

      # Every persona declares the knowledge lens it actually needs (P3). An agent with no
      # declared lens inherits the whole set, which is what put a main-thread-sized prefix
      # on every sub-agent run.
      - name: Agent knowledge lenses declared
        run: python3 pack/scripts/context-budget.py agents

  # ---------------------------------------------------------------------------------------
  # Cross-platform readiness (docs/plans/cross-platform-readiness.md P0). Until this job
  # existed every `os.name == "nt"` branch in pack/scripts was dead code in CI, and the
  # tracked registry carried one developer's python.exe path for a week. This job runs the
  # Python gates on Windows with the documented Windows interpreter form (`python`), then
  # the Windows-only proofs: every script answers --help under the legacy cp1252 code page
  # (XP-14), the registry regenerates byte-identically (PLAT-B), docs-index.js regenerates
  # byte-identically (XP-07), and the pre-commit hook `coord install` writes runs under Git
  # Bash `sh`. Node/browser gates stay on the ubuntu job (one runner, one truth for them).
  # A red step here is a measurement the plan's later phases close, not a reason to mute it.
  # ---------------------------------------------------------------------------------------
  consistency-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.x" }

      - name: Interpreter form on this runner (pack-doctor names it)
        shell: pwsh
        run: python pack/scripts/pack-doctor.py --root . | Select-String -Pattern "python interpreter" -Context 0,1

      - name: Count & skill-list consistency
        shell: pwsh
        run: python tools/check-consistency.py

      - name: No machine-specific paths in tracked files
        shell: pwsh
        run: python pack/scripts/verify-no-machine-paths.py

      - name: Source↔install drift (pwsh on Windows)
        shell: pwsh
        run: |
          pwsh tools/sync-pack.ps1
          git --no-pager diff --stat -- .claude .github/instructions .github/prompts .github/agents docs web CLAUDE.md AGENTS.md
          git diff --exit-code -- .claude .github/instructions .github/prompts .github/agents docs web CLAUDE.md AGENTS.md

      # Under Git Bash so `sh` is on PATH: the hook-adapter conformance test executes the
      # settings.json command string the way Claude Code does on Windows.
      - name: Python test suite (Git Bash)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet pytest
          python -m pytest tests -q

      - name: Knowledge-graph validation
        shell: pwsh
        run: python docs/ai-forward-pack/scripts/docs-graph.py validate

      - name: Vendored-foundation drift
        shell: pwsh
        run: python pack/scripts/foundation-check.py

      - name: Audit log is fully readable
        shell: pwsh
        run: python pack/scripts/audit-log.py verify

      - name: Always-on context budget
        shell: pwsh
        run: python pack/scripts/context-budget.py gate

      # XP-14: `--help` must not raise UnicodeEncodeError on a cp1252 console. Every script
      # answered --help with exit 0 on macOS on 2026-09-19; the legacy code page is the part
      # only Windows can prove.
      - name: Every script answers --help under cp1252
        shell: pwsh
        run: |
          chcp 1252 | Out-Null
          $env:PYTHONIOENCODING = ""
          $failed = @()
          Get-ChildItem pack/scripts/*.py, pack/adapters/hooks/*.py | ForEach-Object {
            $null = & python $_.FullName --help 2>&1
            if ($LASTEXITCODE -ne 0) { $failed += "$($_.Name) (exit $LASTEXITCODE)" }
          }
          if ($failed.Count) { Write-Host "FAIL --help under cp1252:"; $failed | ForEach-Object { Write-Host "  $_" }; exit 1 }
          Write-Host "every script answers --help under cp1252"

      # PLAT-B: the registry must regenerate byte-identically here, i.e. carry the token,
      # never this runner's interpreter path.
      - name: Registry regenerates byte-identically (coord classify init --force)
        shell: pwsh
        run: |
          python docs/ai-forward-pack/scripts/coord-core.py classify init --force
          git --no-pager diff -- .agents/artifacts.yml
          git diff --exit-code -- .agents/artifacts.yml

      # XP-07: docs-index.js is a `derived` artifact merged by byte identity; a CRLF write on
      # Windows would make every regeneration a spurious diff.
      - name: docs-index.js regenerates byte-identically on Windows
        shell: pwsh
        run: |
          python docs/ai-forward-pack/scripts/docs-graph.py derive
          git --no-pager diff --stat -- docs/docs-index.js
          git diff --exit-code -- docs/docs-index.js

      # The pre-commit floor `coord install` writes is `#!/bin/sh` + an absolute interpreter
      # path; Git for Windows runs it through its bundled sh. Prove it here, with
      # AGENT_SESSION unset (advisory path, exit 0) and set (enforcing path, exit 0 on a
      # clean index).
      - name: Pre-commit hook runs under Git Bash sh
        shell: bash
        run: |
          python docs/ai-forward-pack/scripts/coord-core.py install
          test -f .git/hooks/pre-commit
          sh .git/hooks/pre-commit
          AGENT_SESSION=ci-windows sh .git/hooks/pre-commit
          python pack/scripts/pack-doctor.py --root . --json > pack-doctor.json
          python -c "import json,sys; c=[x for x in json.load(open('pack-doctor.json'))['checks'] if x['name']=='coordination'][0]; print(c['status'], '-', c['detail']); sys.exit(1 if c['status']=='FAIL' else 0)"

  # The macOS half of P0: stock macOS has no `python`; the documented `python3` form runs.
  # This is where the Mac-only test failures (T-1/T-2/T-3 in the investigation) are seen by
  # something other than a developer's terminal.
  consistency-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.x" }

      - name: Count & skill-list consistency
        run: python3 tools/check-consistency.py

      - name: No machine-specific paths in tracked files
        run: python3 pack/scripts/verify-no-machine-paths.py

      - name: Source↔install drift (pwsh on macOS)
        shell: pwsh
        run: |
          pwsh tools/sync-pack.ps1
          git --no-pager diff --stat -- .claude .github/instructions .github/prompts .github/agents docs web CLAUDE.md AGENTS.md
          git diff --exit-code -- .claude .github/instructions .github/prompts .github/agents docs web CLAUDE.md AGENTS.md

      - name: Python test suite
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pytest
          python3 -m pytest tests -q

      - name: Knowledge-graph validation
        run: python3 docs/ai-forward-pack/scripts/docs-graph.py validate

      - name: Vendored-foundation drift
        run: python3 pack/scripts/foundation-check.py

      - name: Audit log is fully readable
        run: python3 pack/scripts/audit-log.py verify

      - name: Always-on context budget
        run: python3 pack/scripts/context-budget.py gate

      - name: Registry regenerates byte-identically (coord classify init --force)
        run: |
          python3 docs/ai-forward-pack/scripts/coord-core.py classify init --force
          git --no-pager diff -- .agents/artifacts.yml
          git diff --exit-code -- .agents/artifacts.yml

      - name: Coordination layer installed
        run: |
          python3 pack/scripts/pack-doctor.py --root . --json > pack-doctor.json || true
          python3 -c "import json,sys; c=[x for x in json.load(open('pack-doctor.json'))['checks'] if x['name']=='coordination']; sys.exit('pack-doctor has no coordination check') if not c else None; print(c[0]['status'], '-', c[0]['detail']); sys.exit('coordination layer not installed - fix: ' + c[0]['fix']) if c[0]['status']=='FAIL' else None"
