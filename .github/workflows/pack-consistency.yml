# Pack-source consistency gate for the AI-Forward repo ITSELF (not deployed to targets).
# Catches count/skill-list drift, vendored-foundation drift, and malformed eval cases
# before they merge. The deployed graph-health workflow is pack/ci/docs-health.yml.
name: pack-consistency
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pack/**"
      - "tools/**"
      - "tests/**"
      - "docs/**"
      - ".claude/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".github/agents/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "web/**"
      - ".github/copilot-instructions.md"
      - ".github/workflows/pack-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.x" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      # Documented counts + skill/prompt parity must match the filesystem.
      - name: Count & skill-list consistency
        run: python3 tools/check-consistency.py

      # FR-033. The repository's foundational invariant: pack/ is source, .claude/ and
      # .github/ are generated. verify-bundle.ps1 has always checked this locally and CI
      # never ran it, so source↔install drift — the one failure mode the whole architecture
      # exists to prevent — could merge. A re-sync that produces a diff IS the drift, so
      # `git diff --exit-code` is the whole oracle; it fails the step by itself.
      - name: Source↔install drift (pack/ is the only source of truth)
        shell: pwsh
        run: |
          pwsh tools/sync-pack.ps1
          Write-Host "If the next command fails, pack/ and the generated surfaces have drifted."
          Write-Host "Fix: run 'pwsh tools/sync-pack.ps1' locally and commit the result."
          git --no-pager diff --stat -- .claude .github/instructions .github/prompts .github/agents docs web CLAUDE.md AGENTS.md
          git diff --exit-code -- .claude .github/instructions .github/prompts .github/agents docs web CLAUDE.md AGENTS.md

      # FR-034. The largest suite in the repository (112 tests covering docs-graph,
      # audit-log, check-consistency, pack-doctor, run-evals, bounded_process) was advisory
      # until now — it passed locally and gated nothing.
      - name: Python test suite
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pytest
          python3 -m pytest tests -q

      - name: Docs Explorer core contracts
        run: |
          npm ci
          npm run test:docs-explorer:core

      # FR-051. The public explainer is client-rendered, so a static scan sees a shell and
      # reports clean for the wrong reason (CD20 / class E2E-H). This runs the page's own
      # vendored bundles in a DOM shim and asserts the result: no third-party origin, the
      # libraries define their globals, #root has a real mount, and the WCAG landmarks and
      # skip link exist. Observed failing on the pre-fix page with 12 assertions red.
      - name: Explainer render + accessibility proof
        run: node tools/verify-explainer-render.js

      # FR-034. The knowledge graph gate: schema-valid frontmatter, no dangling links,
      # no orphans, no index drift.
      - name: Knowledge-graph validation
        run: python3 docs/ai-forward-pack/scripts/docs-graph.py validate

      # Vendored-foundation drift
      - name: Vendored-foundation drift
        run: python3 pack/scripts/foundation-check.py

      # FR-052. The audit log is this project's durable memory and the corpus /dream
      # consolidates over. read_log survives a malformed line on purpose, so a corrupted
      # entry would otherwise be invisible to every reader while the tooling reports success.
      - name: Audit log is fully readable
        run: python3 pack/scripts/audit-log.py verify

      # Every eval case is valid JSON with compilable regex assertions.
      - name: Eval cases well-formed
        run: |
          python3 - <<'PY'
          import glob, json, re, sys
          bad = 0
          for f in sorted(glob.glob("pack/evals/cases/*.json")):
              try:
                  case = json.load(open(f, encoding="utf-8"))
                  for a in case.get("assertions", []):
                      if "pattern" in a:
                          re.compile(a["pattern"])
              except Exception as e:
                  print(f"  - {f}: {e}"); bad += 1
          print(f"{len(glob.glob('pack/evals/cases/*.json'))} eval cases checked")
          sys.exit(1 if bad else 0)
          PY

      # FR-072 / P2, reshaped by FR-073. The always-on knowledge set is the static prefix of
      # every model call: re-read every turn, billed every turn, and subtracted from the
      # window before the user has said anything. Ungated it re-grows one "surely one more
      # doc is free" at a time - which is how a profiled session reached a 184K always-on
      # prefix that failed 27 of 39 delegated runs outright.
      #
      # A ratchet, not a ceiling: growth is allowed, growth that leaves the recorded baseline
      # untouched is not. The baseline lives in pack/context-budget.json so the growth shows
      # up in a diff a reviewer can question.
      - name: Always-on context budget
        run: python3 pack/scripts/context-budget.py gate

      # CTX-H: coord-core.py shipped for two revisions switched off, and nothing noticed --
      # an uninstalled layer reports "0 decisions, nothing claimed", which is indistinguishable
      # from a working layer that saw no traffic. This repo is itself a pack install, so its
      # own layer being ON is the only end-to-end proof the install path works. A WARN is
      # expected here: .git/config is per-clone, so a fresh CI checkout never has the driver
      # registered. Only a missing or unparseable registry FAILs.
      - name: Coordination layer installed
        run: |
          python3 pack/scripts/pack-doctor.py --root . --json > pack-doctor.json || true
          python3 -c "import json,sys; c=[x for x in json.load(open('pack-doctor.json'))['checks'] if x['name']=='coordination']; sys.exit('pack-doctor has no coordination check') if not c else None; print(c[0]['status'], '-', c[0]['detail']); sys.exit('coordination layer not installed - fix: ' + c[0]['fix']) if c[0]['status']=='FAIL' else None"

      # Every persona declares the knowledge lens it actually needs (P3). An agent with no
      # declared lens inherits the whole set, which is what put a main-thread-sized prefix
      # on every sub-agent run.
      - name: Agent knowledge lenses declared
        run: python3 pack/scripts/context-budget.py agents
