# Pack-source consistency gate for the AI-Forward repo ITSELF (not deployed to targets).
# The deployed graph-health workflow is pack/ci/docs-health.yml.
#
# FR-091: every gate lives in tools/gates.py, the same list tools/verify-bundle.ps1 runs. This file
# only prepares each runner and calls it, so adding a gate needs no workflow edit and CI can no
# longer drift from the local proof. `gates.py list --ci --os <os>` prints what a job runs.
#
# FR-094: the test suite was 17 of the 18 minutes on Windows and 16 on macOS. Each of those OSes
# now runs its tests in three shards on three runners (shard 1 also runs the other gates), and a
# small job with the required check's name passes only when every shard passed. Branch protection
# keeps requiring `consistency`, `consistency-windows` and `consistency-macos`, unchanged.
name: pack-consistency
on:
  push:
    branches: [main]
  # Unfiltered on purpose: this workflow's jobs are required checks, and a path-filtered
  # required check never reports on a PR outside its paths, which blocks that PR forever.
  pull_request:
  workflow_dispatch:


# CI-speed C3: a newer push to the same PR supersedes the older run. Dispatches and main pushes
# are keyed by run id, so they are never cancelled and never queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 50   # PACK-W reads which commit last changed pack/; depth 1 passes vacuously
      # The doctrine comparison baseline. At the SAME depth as the checkout: a depth-1 fetch of
      # main on a push to main marks HEAD itself shallow and cuts the history PACK-W reads.
      - name: Fetch doctrine comparison baseline
        run: git fetch --no-tags --depth=50 origin main:refs/remotes/origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.x" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test tools
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pytest pytest-xdist
          npm ci
      - name: Gates (tools/gates.py)
        run: python3 tools/gates.py run --ci

  # Cross-platform readiness (docs/plans/cross-platform-readiness.md P0): the Python gates on
  # Windows with the documented Windows interpreter form (`python`), plus the Windows-only proofs
  # (cp1252 --help, byte-identical regeneration, the pre-commit hook under Git Bash `sh`). Bash is
  # the shell so `sh` is on PATH, the way Claude Code runs hook commands on Windows.
  windows-shard:
    name: windows shard ${{ matrix.shard }}/3
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 50   # PACK-W reads which commit last changed pack/; depth 1 passes vacuously
      - name: Fetch doctrine comparison baseline
        run: git fetch --no-tags --depth=50 origin main:refs/remotes/origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.x" }
      - name: Install test tools
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet pytest pytest-xdist
      - name: Gates (tools/gates.py)
        shell: bash
        run: python tools/gates.py run --ci --shard ${{ matrix.shard }}/3

  consistency-windows:
    needs: windows-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Windows shard passed
        run: test "${{ needs.windows-shard.result }}" = success

  # The macOS half of P0: stock macOS has no `python`; the documented `python3` form runs.
  macos-shard:
    name: macos shard ${{ matrix.shard }}/3
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 50   # PACK-W reads which commit last changed pack/; depth 1 passes vacuously
      - name: Fetch doctrine comparison baseline
        run: git fetch --no-tags --depth=50 origin main:refs/remotes/origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.x" }
      - name: Install test tools
        run: python3 -m pip install --disable-pip-version-check --quiet pytest pytest-xdist
      - name: Gates (tools/gates.py)
        run: python3 tools/gates.py run --ci --shard ${{ matrix.shard }}/3

  consistency-macos:
    needs: macos-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every macOS shard passed
        run: test "${{ needs.macos-shard.result }}" = success

  # CI-speed C6 / P9: per-job wall-clock against the trailing median of green main runs. Not a
  # required check -- runner timings are noisy -- but it fails red above 1.5x so growth is seen.
  # `--since` is the day the sharded layout landed: older runs are a different job shape.
  duration-budget:
    needs: [consistency, windows-shard, macos-shard]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Duration budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci-duration-budget.py --repo "${{ github.repository }}" --run "${{ github.run_id }}"
          --workflow pack-consistency.yml
          --jobs "consistency,windows shard 1/3,windows shard 2/3,windows shard 3/3,macos shard 1/3,macos shard 2/3,macos shard 3/3"
          --since 2026-10-19
