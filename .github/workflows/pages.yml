# Publishes the AI-Forward site to GitHub Pages with the portal as the shareable front door.
# Approved "Option A + publish boundary" (docs/notes/hosting-and-dream-manifest.md):
#   * serve from a root where the portal's relative links resolve (root index.html redirects to
#     docs/portal/index.html), so timianmalloo.github.io/ai-forward/ lands on the Documentation Portal;
#   * enforce the publish boundary in tools/build-pages-bundle.py - raw dreams, the audit log, and the
#     operational federation data (manifests, plans, working ledgers) are KEPT LOCAL and never published.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "pack/**"
      - "web/**"
      - "learnings/fleet-classes.*"
      - "tools/build-pages-bundle.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# FR-063. Every action is pinned to a full commit SHA, not a tag. This is the only workflow in
# the repo that can mint an OIDC token (`id-token: write`) and write to Pages, so a mutable tag
# here is a supply-chain write primitive: whoever moves `v4` runs code with those permissions.
# SHAs were resolved from each action's tag ref at pin time and verified to be real commits -
# never copied from memory. `check-consistency.py :: check_workflow_action_pinning()` fails the
# build if a bare tag is reintroduced, so this is a control, not a convention.
# Note: actions/checkout is pinned here to the current v4 (11d5960, 2026-07); pack-consistency.yml
# still pins the older 34e1148 (2025-11). Both are valid immutable pins; unifying them is a
# version bump on the required gate and is deliberately out of scope for this security fix.

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      # Assemble the publishable bundle. The script FAILS (non-zero) if any local-only tree
      # (raw dreams / audit / manifests / plans / working ledgers) leaked into the bundle,
      # so a boundary violation blocks the deploy rather than publishing sensitive data.
      - name: Build Pages bundle (publish boundary enforced)
        run: python tools/build-pages-bundle.py --out _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
