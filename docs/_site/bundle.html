  "markdown": "\n# AI-Forward — Documentation\n\nA **Map of Content** (a curated link layer over the graph, not a folder mirror) for this\nrepository — the development home of the **AI-Forward Pack** and a live install of it.\n\n> New here? Start with the **[Interactive Explainer](../web/ai-forward-pack-explainer.html)** —\n> it walks the knowledge, the skills, the Rigor Protocol, and the UI-template grammar, and lets\n> you preview every interface archetype before choosing one.\n\n## The documentation surfaces\n\n| Surface | What it is | Open |\n|---|---|---|\n| **Pack Index** | The **whole repo** — knowledge, skills, templates, scripts, personas, examples, and the knowledge graph — navigable and **searchable** in one page. Loads `web/pack-index.js` (regenerated by `tools/build-web-index.py`, wired into `sync-pack.ps1`). | [`web/index.html`](../web/index.html) |\n| **Interactive Explainer** | Self-contained React/HTML page explaining the pack's reasoning, personas, skills, and the UI archetype grammar — with a table of all template types and linkable, rendered **mockups** of each. | [`web/ai-forward-pack-explainer.html`](../web/ai-forward-pack-explainer.html) |\n| **Docs Explorer** | The knowledge graph, browsable as hierarchy · graph · mind map · health. Loads `docs/docs-index.js`. | [`docs/index.html`](index.html) |\n| **Documentation Portal** | The **published front door** — what GitHub Pages serves. Getting started, capabilities, every skill, multi-agent collaboration, the prompt loop, foundations, UI, architecture, systems, graph, reference. Loads `docs/portal/portal-data.js`. | [`docs/portal/index.html`](portal/index.html) |\n| **API reference** | JavaDoc-style reference for the **deployed script bundle** — generated from each module's own docstrings and argparse definitions, with undocumented members listed as recorded gaps. | [`docs/api/index.md`](api/index.md) |\n| **Close-up bundle view** | The markdown bundle rendered with navigation and Mermaid, self-contained and openable over `file://`. | [`docs/_site/index.html`](_site/index.html) |\n\n## Architecture of record\n\n- **[Architecture Overview](architecture.md)** — the source→build→install→consumer structure, the four diagram families (component · sequence · layered · class), and the tool/CLI reference.\n- **[API reference](api/index.md)** — the public surface, module by module, with computed coverage.\n- **[Forensic Review](reviews/forensic-review.md)** · **[Proposed Remediation Backlog](backlog/forensic-review.md)** — evidence-based review of the repository, focused on commit `5d7b952` and model/task orchestration.\n\n## The pack itself (payload docs)\n\n- **[Pack README](ai-forward-pack/README.md)** · **[Pack OVERVIEW](ai-forward-pack/OVERVIEW.md)** · **[Research synthesis](ai-forward-pack/research-synthesis.md)** · **[INSTALL](ai-forward-pack/INSTALL.md)**\n- **The reasoning spine:** the Rigor Protocol, the Body of Knowledge, the Rules of the Road (`.claude/knowledge/`).\n- **The skills** — deliberately *not* listed here. Any hand-kept roster of them rots: this file\n  claimed \"17 skills\" and named a `/design` that had been renamed, months after both facts\n  changed. Read them from a surface that is derived and therefore cannot drift — the\n  **[Portal's Skills section](portal/index.html)** or the **[Pack Index](../web/index.html)**,\n  both generated from `pack/commands/*/SKILL.md` and held by\n  `tests/docs_explorer/test_portal_inventory.py`.\n- **The persona council** and the **UI archetype grammar + catalog** (`.claude/knowledge/`) —\n  the roster and its veto strengths are likewise derived, in the Portal's\n  *Multi-Agent Collaboration* section.\n\n## How this documentation stays current\n\nTwo gates, because staleness has two shapes.\n\n**Change-based** — `tools/check-consistency.py` re-runs every generator in `--check` mode and\nfails when a derived artifact disagrees with its source: `docs/api/`, `docs/portal/portal-data.js`\nand `web/pack-index.js`. `docs-graph.py validate` fails on invalid frontmatter, dangling typed\nlinks, entries whose files are gone, and index-versus-frontmatter disagreement. Both run in\n`tools/verify-bundle.ps1` and in CI on every push.\n\n**Time-based** — `.github/workflows/docs.yml` runs weekly, because an artifact's `review-by`\nlapses on a *date*, not on a commit: on a quiet week nothing pushes and nothing notices. It fails\non a push or PR and warns on the schedule, so a review-by that lapsed overnight raises a signal\nfor that artifact's owner without reddening `main` for everyone. `docs-graph.py snapshot` records\nthe graph-health trend that makes governance drift visible as a series.\n\nCoverage, confidence labels, and the known gaps are recorded in\n[`_meta.json`](_meta.json) — including the largest open debt, that 60% of the deployed bundle's\npublic functions still carry no docstring.\n\n---\n*Map of Content per Knowledge-Visualization Standard V3. Frontmatter is the record; this index\nis a curated projection, not a generated folder listing.*\n"

  "id": "architecture",
  "title": "AI-Forward — Architecture Overview",
  "markdown": "\n<!--\nProduced by /document (Rigor Protocol run on the codebase as the subject of documentation).\nGround truth is the repository itself. Confidence labels: [Verified] traced to a file/run;\n[Inferred] reasoned, not executed; [Flagged] carried as a risk. The documented commit and\ncoverage are in docs/_meta.json. This bundle is companion to the self-contained interactive explainer\nweb/ai-forward-pack-explainer.html (generated by this run).\n-->\n\n# Architecture: AI-Forward (pack source + live dogfood install)\n\n- **Status:** Accepted\n- **Tier:** N/A — this repository is a knowledge/tooling package with no inference client.\n  The short-lived model-orchestration experiment was reverted after forensic review; model\n  selection remains the host/user's responsibility. `[Verified]`\n- **Driving context:** `README.md`, `CLAUDE.md`, `pack/OVERVIEW.md`\n- **Documented commit:** see `docs/_meta.json`\n\n## Context & constraints\n\nThis repository is **two things at once** (`README.md` §\"This repo is two things at once\"):\n\n1. **The canonical source** of the AI-Forward Pack — everything you edit to expand the pack lives under `pack/`. `[Verified: README.md, pack/]`\n2. **A live install of the pack** — the pack is installed into this same repo (`.claude/`, `docs/`) so the skills, agents, and knowledge are active in Claude Code *while you work on the pack itself*. Dogfooding: the pack is built using the pack. `[Verified: .claude/, CLAUDE.md]`\n\nThe load-bearing constraint that shapes the whole structure:\n\n> **`.claude/` and `docs/` are GENERATED from `pack/`** by `tools/sync-pack.ps1` and committed so a fresh clone has a working install with no setup. `pack/` is the single source of truth — never edit the generated copies directly; they are overwritten on the next sync. `[Verified: CLAUDE.md, tools/sync-pack.ps1]`\n\nGenerated knowledge documents under `.claude/knowledge/` and `docs/ai-forward-pack/` carry **no YAML frontmatter** (they are vendored prose, not graph nodes). Project documentation under `docs/` is the graph authority; it contains **128 valid artifacts with no stale, flagged, orphan, dangling, or index-drift findings**. `[Verified: docs-graph.py inventory/validate, pack revision 53, 2026-08-30]`\n\n## Archetype & rationale\n\nNo LOA system archetype (A–I) applies — those classify AI-integrated *runtime* systems. The applicable shape here is a classic **source → build → install → consumer** pipeline with a **dogfood loopback**: the install layer feeds back into the authoring experience (Claude Code reads `.claude/` while you edit `pack/`). `[Inferred from repo structure]`\n\n## Component map & boundaries\n\nThe major components and the real dependency edges between them (read from `tools/sync-pack.ps1`, `tools/package-pack.ps1`, and the directory layout):\n\n```mermaid\nflowchart TB\n  subgraph SRC[\"pack/ — canonical source (edit here)\"]\n    K[\"knowledge/*.md<br/>(reasoning spine + roster + foundation)\"]\n    C[\"commands/&lt;name&gt;/SKILL.md<br/>(the 24 skills)\"]\n    T[\"templates/*<br/>(artifacts each skill emits)\"]\n    A[\"adapters/<br/>(Claude Code + Copilot agents, INSTALL.md)\"]\n    SC[\"scripts/ (20) · evals/ · ci/ · examples/\"]\n    CB[\"context-budget.json<br/>(always-on budget baseline)\"]\n    PD[\"README · OVERVIEW · research-synthesis\"]\n  end\n\n  subgraph TOOLS[\"tools/ — build\"]\n    SYNC[\"sync-pack.ps1\"]\n    PKG[\"package-pack.ps1\"]\n    GEN[\"build-docs-portal.py<br/>build-web-index.py<br/>build-api-docs.py\"]\n  end\n\n  subgraph INSTALL[\"generated install (do not hand-edit)\"]\n    CK[\".claude/knowledge/*.md<br/>(all 39, verbatim)\"]\n    CS[\".claude/skills/*\"]\n    CA[\".claude/agents/*.md\"]\n    GI[\".github/instructions/<br/>always + glob-scoped\"]\n    GK[\".github/knowledge/<br/>skill + reference, on demand\"]\n    GP[\".github/prompts/ · .github/agents/\"]\n    DP[\"docs/ai-forward-pack/<br/>templates + scripts + pack docs\"]\n    EXP[\"docs/index.html<br/>(Docs Explorer)\"]\n    IDX[\"docs/docs-index.js<br/>(derived graph index)\"]\n    PORT[\"docs/portal/portal-data.js<br/>(Documentation Portal data)\"]\n    WIX[\"web/pack-index.js\"]\n    ARCH[\"docs/architecture.md · index.md · api/ · _meta.json<br/>(this bundle)\"]\n  end\n\n  subgraph CONSUMERS[\"consumers\"]\n    CC[\"Claude Code / Copilot<br/>(read .claude/ + .github/)\"]\n    WEBE[\"web/ai-forward-pack-explainer.html<br/>(interactive explainer)\"]\n    PAGES[\"GitHub Pages<br/>(portal is the front door)\"]\n    ZIP[\"dist/ai-forward-pack.zip\"]\n  end\n\n  K --> SYNC\n  C --> SYNC\n  T --> SYNC\n  A --> SYNC\n  CB --> SYNC\n  SYNC --> CK & CS & CA & DP & EXP\n  SYNC -- \"routes on each doc's load: scope\" --> GI & GK\n  SYNC --> GP\n  C -. \"skills reference\" .-> CK\n  CA -. \"agents reference\" .-> CK\n  ARCH --> GRAPH[\"docs-graph.py derive\"]\n  GRAPH --> IDX\n  SYNC --> GRAPH\n  SYNC --> GEN\n  GEN --> PORT & WIX\n  ARCH --> GEN\n  IDX --> EXP & PORT\n  CK --> CC\n  CS --> CC\n  CA --> CC\n  GI --> CC\n  PORT --> PAGES\n  WEBE --> PAGES\n  SRC --> PKG --> ZIP\n  CK -. \"derived content\" .-> WEBE\n```\n\nBoundaries that matter:\n- **Source ↔ install boundary** — crossed *only* by `tools/sync-pack.ps1`. Editing the install side directly is a contract violation (the next sync overwrites it). `[Verified: CLAUDE.md, sync-pack.ps1]`\n- **`sync-pack.ps1` write scope** — `.claude/{knowledge,skills,agents}`, all four `.github/` surfaces, `docs/ai-forward-pack/**`, `docs/index.html`, and the CLAUDE.md / AGENTS.md managed blocks. It then **invokes the derivation tools**: `docs-graph.py derive`, `build-web-index.py`, `build-docs-portal.py`. `[Verified: tools/sync-pack.ps1]`\n- **It does not write** `.claude/settings.local.json`, `.github/copilot-instructions.md`, or this bundle's hand-authored files (`docs/architecture.md`, `docs/index.md`), so they have a stable home. `[Verified: tools/sync-pack.ps1 header + body]`\n- **Correction (2026-09-03).** This section previously stated that sync \"intentionally does not touch `docs/docs-index.js`\". That has been false since FR-060/FR-068 moved derivation *into* sync so the index could never lag a run that added an artifact. The index is still never hand-edited — it is derived from frontmatter — but sync is now one of the things that derives it.\n- **Load-scope routing** — a knowledge doc reaches `.github/instructions/` only if its frontmatter says `load: always` or `load: glob`; `skill` and `reference` docs go to `.github/knowledge/` and are read on demand. This is what keeps the always-on prefix at ~43.7K rather than ~184K estimated tokens. `[Verified: sync-pack.ps1 Get-LoadScope; pack/context-budget.json]`\n\n## Key flow — the sandbox / dogfood loop (sequence)\n\nThe authoring loop from `README.md` §\"Expanding the pack\", with the graph-refresh step `/document` adds:\n\n```mermaid\nsequenceDiagram\n  actor Dev as Author\n  participant Pack as pack/ (source)\n  participant Sync as tools/sync-pack.ps1\n  participant Install as .claude/ + docs/\n  participant CC as Claude Code (this repo)\n  participant Graph as docs-graph.py\n  participant Verify as tools/verify-bundle.ps1\n  participant Explorer as docs/index.html\n\n  Dev->>Pack: edit a knowledge doc / SKILL.md / persona / template\n  Dev->>Sync: pwsh tools/sync-pack.ps1\n  Sync->>Install: mirror knowledge, skills, agents, templates, scripts\n  Sync->>Install: route each knowledge doc by its load: scope<br/>(instructions vs .github/knowledge)\n  Sync->>Install: re-paste the CLAUDE.md / AGENTS.md managed blocks\n  Sync->>Graph: docs-graph.py derive\n  Graph->>Install: write docs/docs-index.js from frontmatter\n  Sync->>Install: build-web-index.py, build-docs-portal.py\n  Note over Sync,Install: derivation runs INSIDE sync (FR-068), so the<br/>index can never lag a run that added an artifact\n  Dev->>CC: try the change (regenerated skills/agents are now live)\n  CC-->>Dev: run a skill; dogfood the edit\n  Dev->>Verify: pwsh tools/verify-bundle.ps1\n  Verify->>Verify: 10 gates — counts · drift · tests · explorer ·<br/>graph · foundation · audit · evals · context budget\n  Verify-->>Dev: CONSISTENT, or the first thing that is wrong\n  Graph->>Explorer: index loaded; hierarchy · graph · mind map · health render\n  Dev->>Pack: commit pack/ + .claude/ + .github/ + docs/ together (lockstep)\n```\n\nThe gate is part of the loop, not an afterthought: `main` enforces linear history and has **no\nrequired status check**, so `verify-bundle.ps1` before the push is the only thing standing between\nan author and a red `main`. `[Verified: README.md §\"Expanding the pack (the sandbox loop)\", tools/sync-pack.ps1, tools/verify-bundle.ps1, docs/notes/required-status-checks.md]`\n\n## Reverted model-orchestration experiment (historical)\n\nCommit `5d7b952` added a global model-orchestration standard and static routing lookup. The\nforensic review found that the capability was not wired into skills/personas, contradicted its\nhard adversary-independence rule, could reduce T2 rigor, lacked behavioral proof/audit support,\nand had no provider/data-governance boundary. The user chose removal rather than remediation.\n\nThe active architecture therefore has **no model-per-task control plane**. The existing\nOrchestrator remains a process/persona facilitator only. The historical evidence and closed\nfindings remain in `docs/reviews/forensic-review.md`,\n`docs/backlog/forensic-review.md`, and the superseded/accepted decision-note pair.\n\n## Layered view (source → consumer)\n\nThe repo's own layering (distinct from the LOA *capability* tiers it ships as payload):\n\n```mermaid\nflowchart TB\n  subgraph L4[\"Consumer layer\"]\n    direction LR\n    cc[Claude Code / Copilot]:::c\n    ex[Docs Explorer + web explainer]:::c\n    z[dist/ zip for other repos]:::c\n  end\n  subgraph L3[\"Install layer (generated, committed)\"]\n    direction LR\n    claude[.claude/ knowledge·skills·agents]:::i\n    gh[.github/ instructions·knowledge·prompts·agents]:::i\n    docs[docs/ pack-docs·scripts·templates·index·api·portal]:::i\n  end\n  subgraph L2[\"Build layer\"]\n    direction LR\n    sync[sync-pack.ps1]:::b\n    pkg[package-pack.ps1]:::b\n    gen[derivation: docs-graph · portal · web-index · api-docs]:::b\n  end\n  subgraph L1[\"Source layer (single source of truth)\"]\n    pack[pack/ knowledge·commands·templates·adapters·scripts]:::s\n  end\n  L1 --> L2 --> L3 --> L4\n  classDef s fill:#1d2b4d,stroke:#5a7cff,color:#dde6ff\n  classDef b fill:#13324a,stroke:#5ad1c7,color:#dffaf6\n  classDef i fill:#2a2440,stroke:#a98bff,color:#efeaff\n  classDef c fill:#163024,stroke:#56d364,color:#dcffe4\n```\n\nDependency direction points **up only** (source → build → install → consumer); no consumer writes back into source except through the human author editing `pack/`. `[Verified: tools/*.ps1]`\n\n## Domain model (class) — the UI Archetype Grammar\n\nThe most code-like structure in the repo is the **Archetype Grammar** (`ui-archetype-grammar.md` EBNF, G1–G16) and its catalog (`ui-archetype-catalog.md`). Documented here as a class model because it is the conceptual schema the experience and the codegen contract are built on:\n\n```mermaid\nclassDiagram\n  class Signature {\n    +Name name\n    +FacetList facets\n    +StyleHints? hints\n    +validate() conflicts\n    +roundTrip() bool  %% G10: identify AND generate\n  }\n  class Facet {\n    <<abstract>>\n    +String key\n  }\n  class SingleValuedFacet {\n    +Value value  %% Type, Arch, Layout, Density, Pacing, ...\n  }\n  class MultiValuedFacet {\n    +Value[] values  %% Nav, Input, Feedback, Motion, A11y (joined with +)\n  }\n  class StyleHints {\n    +String[] hints  %% bounded NL decoration, applied last\n  }\n  class Archetype {\n    +String id          %% A1..F2\n    +String name\n    +Exemplar[] exemplars\n    +Signature canonical\n    +String codegenDescriptor\n  }\n  Signature \"1\" o-- \"4..*\" Facet : composes\n  Facet <|-- SingleValuedFacet\n  Facet <|-- MultiValuedFacet\n  Signature \"0..1\" *-- \"1\" StyleHints : decorated by\n  Archetype \"1\" *-- \"1\" Signature : canonical\n  Archetype \"1\" o-- \"1..*\" Exemplar\n  note for Signature \"G4: MUST carry Type, Arch, Layout, Pacing.\\nG1: always composed with a concrete U1–U20 / S1–S10 spec.\"\n```\n\n`[Verified: ui-archetype-grammar.md §2 EBNF, G1/G4/G5/G10; ui-archetype-catalog.md]`\n\n## Tool & CLI reference (the repo's public surface)\n\nThe **public surface is the deployed script bundle** — `pack/scripts/*.py`, which lands in every consuming repo as `docs/ai-forward-pack/scripts/`. That surface now has a generated JavaDoc-style reference at **[`docs/api/`](api/index.md)**, extracted from the modules' own docstrings and argparse definitions. Everything under `tools/` is repo-local build tooling and is deliberately *not* deployed. `[Verified: tools/, pack/scripts/, docs/ai-forward-pack/scripts/, tools/build-api-docs.py]`\n\n| Command | Purpose | Notes |\n|---|---|---|\n| `pwsh tools/sync-pack.ps1` | Regenerate `.claude/`, `.github/`, and `docs/` from `pack/`. | Run after every `pack/` edit. Also runs `docs-graph.py derive`, `build-web-index.py`, and `build-docs-portal.py`. |\n| `pwsh tools/package-pack.ps1` | Build `dist/ai-forward-pack.zip` for sharing. | Carries full Claude Code + Copilot wiring. |\n| `pwsh tools/verify-bundle.ps1` | Run the complete **ten-gate** local proof, matching CI's gate set. | Gate 2 synchronizes and compares generated surfaces; gate 8 is the always-on context budget. CRLF-only working-copy noise may need normalization on Windows. |\n| `python tools/build-api-docs.py [--check]` | Generate `docs/api/` from `pack/scripts/`. | `--check` is the drift gate; prose comes only from source docstrings, gaps are recorded not invented. |\n| `python pack/scripts/context-budget.py <cmd>` | The always-on context budget: `report`, `gate`, `agents`, `preflight`. | Ratchets against the baseline in `pack/context-budget.json`. |\n| `python tools/new-capability.py ...` | Scaffold a skill or knowledge extension across source surfaces. | Used by `/extendaibundle`. |\n| `python tools/check-consistency.py` | Check counts, skill/prompt parity, prose drift, deployed-agent parity, proof coverage, workflow pinning, review currency, and derived-artifact drift. | Reads `pack/` as the source of truth and fails closed on mismatches. |\n| `python docs/ai-forward-pack/scripts/docs-graph.py <cmd>` | The knowledge-graph mechanics (V18). | Stdlib-only Python 3.8+. |\n\n`docs-graph.py` subcommands (`[Verified: --help]`): `inventory` (scan the graph → JSON), `derive` (frontmatter → `docs/docs-index.js`), `validate` (inventory + nonzero exit on findings, CI-able), `freshness` (stale + flagged + orphans gate), `flag` / `clear-flag` (V16 review propagation), `stub` (scaffold a schema-correct artifact), `snapshot` (append a graph-health record), `rollup` (aggregate per-design STRIDE / privacy tables into a register).\n\n## Cross-cutting concerns\n\n- **Identity & trust boundaries:** none — this is a static content/tooling repo with no runtime auth surface. `[Verified]`\n- **Failure & resilience:** the only \"runtime\" is the build tools; `sync-pack.ps1` is idempotent (it mirrors source over install each run). `[Inferred]`\n- **Observability:** N/A at repo runtime; the *Observability Standard* (O1–O13) is shipped as pack payload, not applied to this repo's tools. `[Verified]`\n- **Data governance / privacy:** no personal data is stored or processed. `[Verified]`\n\n## Flagged risks & residual unknowns\n\n- **`[Resolved 2026-06-22; reverified 2026-07-12]` Knowledge graph populated; vendored foundation docs deliberately excluded (decision).** The graph holds the project's dogfood artifacts while vendored foundation/standards docs deliberately stay out: they deploy as *always-applied reference instructions*, not parallel graph authorities. `[Decision recorded per BoK Part IX / V17; pre-review inventory = 22 artifacts, 0 proble   "markdown": "\n# `apply-learnings.py`\n\n*Generated from `pack/scripts/apply-learnings.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\napply-learnings.py - the AI-Forward federation / push mechanism.\n\nDistributes approved, generalised fleet learnings (from learnings/fleet-classes.jsonl in the\nai-forward repo) into one or more target repos, RECONCILING each against that repo's existing\ndefect-class register so nothing is duplicated or silently contradicted. It produces a REVIEWABLE\nplan + a diff/patch per target repo - it NEVER merges and NEVER executes anything in a target\n(spec-dreaming US-5, ADR-0002/0005). The second, pull-based federation path is /updatepack, which\ninherits general classes shipped into the pack itself.\n\nReconciliation (ADR-0004, slug-exact + human-flagged; no fuzzy index):\n  * add     - the class has no equivalent in the target -> append to the target's register.\n  * merge   - the target already has the class (slug/id or signature match) -> append the instance\n              / upgrade the control note, never a duplicate entry.\n  * conflict- the incoming class contradicts an existing directive -> SURFACE in the plan for the\n              human to resolve; never overridden.\n\nPython 3.8+, stdlib only. Safety: strip+scrub runs again before anything is written to a plan\n(defence in depth); a target without the pack is skipped with a note.\n\nTargeting/record layer (ADR-0006, the Dream Manifest):\n  * manifest-init --repos a,b,c [--dream id]  -> scaffold learnings/manifests/<id>.json (every fleet\n    class assigned to every repo, scope=all, status=pending) + a self-contained compose HTML matrix.\n  * push --manifest <file>  -> reconcile PER ASSIGNMENT (a learning only into its `targets`), write a\n    reviewable plan per repo, record the outcome back into the manifest's status map, re-render the\n    rollout HTML. Manifests name repos -> LOCAL-ONLY (excluded from the published bundle).\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `manifest-init` | scaffold a learnings×repos manifest + compose HTML from the fleet store |\n| `push` | reconcile fleet learnings into target repos -> plans |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--dream` | optional dream id this manifest derives from |\n| `--id` | manifest id (default: manifest-<timestamp>) |\n| `--manifest` | a learnings×repos manifest (learnings/manifests/<id>.json) — targets per assignment, records status back |\n| `--repos` | comma-separated repo paths, or 'all' (sibling repos with the pack) |\n| `--root` | the ai-forward repo root (holds learnings/) |\n| `--session` | session id for the audit trail |\n\n## Functions\n\n### `now_iso()`\n\n**Coverage gap** — no docstring in the source.\n\n### `find_root(start)`\n\n**Coverage gap** — no docstring in the source.\n\n### `read_jsonl(path)`\n\n**Coverage gap** — no docstring in the source.\n\n### `scrub(text)`\n\n**Coverage gap** — no docstring in the source.\n\n### `slug(sig)`\n\n**Coverage gap** — no docstring in the source.\n\n### `target_has_pack(repo)`\n\n**Coverage gap** — no docstring in the source.\n\n### `target_register(repo)`\n\nReturn {token-set, ids, raw} of the target's existing defect-class register for reconciliation.\n\n### `reconcile(learning, reg)`\n\nClassify one incoming learning against a target register: add | merge | conflict.\n\n### `load_fleet(root)`\n\nDeduped list of promoted fleet learnings (latest wins by slug).\n\n### `control_text(record)`\n\nThe control on a learning may be a {rung, text} object (what a dream writes) or a bare\nstring (a hand-edited store, or an older record — this JSONL is a plain committed file\nanyone can edit). Chaining `.get(\"control\", {}).get(\"text\")` crashed with an unhandled\nAttributeError on the string form, in the script that writes into other people's\nrepositories, AFTER it may already have written plans for earlier targets. Neither shape\nis malformed enough to justify that; a genuinely absent control still returns \"\" and is\nskipped by the caller. Swept as a class: the identical line existed in dream.py.\n\n### `plan_repo(repo, learnings)`\n\nReconcile a set of learnings into one target repo -> a plan list (add|merge|conflict|skip).\nShared by `push --repos` and `push --manifest`; never merges, only plans (ADR-0005).\n\n### `find_template(root, name)`\n\nResolve a pack template whether running from the ai-forward repo or an installed target.\n\n### `render_manifest_html(root, manifest, learnings, mode)`\n\nRender the self-contained learnings×repos matrix (compose|rollout) with the data inlined.\n\n### `render_patch(repo, plan)`\n\nA human-readable reconciliation plan + the exact register additions (never auto-applied).\n\n### `cmd_push(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_manifest_init(args)`\n\nScaffold a learnings×repos manifest from the fleet store + render the compose HTML.\n\n## Coverage\n\n- Public functions: **16** · documented: **9** (**56%**)\n- Undocumented (recorded, not invented): `now_iso`, `find_root`, `read_jsonl`, `scrub`, `slug`, `target_has_pack`, `cmd_push`\n\n"

  "title": "API — audit-log.py",
  "markdown": "\n# `audit-log.py`\n\n*Generated from `pack/scripts/audit-log.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\naudit-log.py — the AI-Forward Pack audit & change log bundle (audit-and-change-log.md).\n\nDurable, committed, history-as-knowledge for a repo: an append-only record of every\nmeaningful prompt / skill / script / decision, so any future Copilot or Claude Code\nsession reads the project's own history instead of starting blind. The canonical logs\nare append-only JSONL (clean git diffs, like docs/health-history.jsonl); the viewer\nreads a derived window.AUDIT_DATA JS (loadable over file://, like docs/docs-index.js).\nPython 3.8+, stdlib only — no dependencies.\n\nTwo logs, one bundle:\n  docs/audit/audit-log.jsonl    every action (shortname, datetime, session, prompt, summary, …)\n  docs/audit/change-log.jsonl   the meaningful design changes / decisions (+ git before/after)\n  docs/audit/audit-data.js      derived window.AUDIT_DATA = {audit:[…], changes:[…]} (the viewer's data)\n  docs/audit/index.html         the interactive viewer (self-bootstrapped from the template)\n\nSubcommands\n  append      Add an audit entry.            (Audit Mandate — every skill's last action)\n  change      Add a change-log entry.        (Change Mandate — collectknowledge/define-architecture/design-slice/migrate)\n  list        Show the last N entries (audit|change). For the CLI skill.\n  search      Filter by --session / --since / --until / --keyword. For the CLI skill.\n  get         Print one entry by --id (use --field prompt to extract the prompt to re-run).\n  render      Regenerate audit-data.js from the JSONL and ensure the viewer exists (repair).\n  git-context Print the current git {sha, short, branch, pushed} as JSON (a helper).\n  verify      Fail when any log line is unreadable — the system of record must never lose\n              an entry silently (FR-052). CI-able.\n  suggest     Discern unlogged meaningful changes (recent commits + new ADRs/notes not in the change log).\n  import      Ingest a session-export JSON array of turns into the audit log (build on session history).\n\nConventions\n  --root defaults to docs/. The audit dir is <root>/audit. The viewer template is resolved\n  relative to this script (pack/templates or docs/ai-forward-pack/templates). git is optional —\n  every git call degrades gracefully when git or a repo is absent. This tool never invents a\n  prompt or a summary; required fields must be supplied (flags, --*-file, or --from-json -).\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `append` | add an audit entry |\n| `change` | add a change-log entry |\n| `get` | print one entry by id |\n| `git-context` | print current git context as JSON |\n| `import` | ingest a session-export JSON array into the audit log |\n| `list` | show the last N entries |\n| `render` | regenerate audit-data.js and ensure the viewer exists |\n| `search` | filter by session/datetime/keyword |\n| `selfcheck` | bounded inline session self-assessment (FC-1): goal-state presence gaps + scope review for a session |\n| `start` | record this run's start stamp (call at grounding) so the closing `append` records duration automatically (IO1) |\n| `suggest` | surface meaningful changes not yet in the change log |\n| `verify` | fail if any log line is unreadable (FR-052; CI-able) |\n| `yield` | persona yield: findings raised vs accepted (P6) |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--actor` | _(no help text — coverage gap)_ |\n| `--agent-run` | one sub-agent run as '<agent>|<start-iso>|<end-iso>'; repeatable. Records agent_runs + a parallelism block (agent_seconds, span_seconds, speedup, peak_concurrency) so fan-out is MEASURED, not asserted (P8). Summed duration cannot tell serial from parallel; the union of the intervals can. |\n| `--artifact` | _(no help text — coverage gap)_ |\n| `--audit-ref` | _(no help text — coverage gap)_ |\n| `--change` | link to a change-log id (cl-NNNN) |\n| `--datetime` | _(no help text — coverage gap)_ |\n| `--done-when` | the terminal condition (front matter CT19); the PACK-O presence signal /dream mines (AL5b) |\n| `--field` | print just this field (e.g. prompt) |\n| `--file` | JSON file (or - for stdin) |\n| `--from-json` | read fields from a JSON object (path or - for stdin) |\n| `--git-before` | HEAD sha captured before the work began |\n| `--git` | capture current git context |\n| `--goal` | the turn's goal (front matter CT19) |\n| `--id` | _(no help text — coverage gap)_ |\n| `--json` | _(no help text — coverage gap)_ |\n| `--keyword` | _(no help text — coverage gap)_ |\n| `--kind` | _(no help text — coverage gap)_ |\n| `--n` | _(no help text — coverage gap)_ |\n| `--outcome` | _(no help text — coverage gap)_ |\n| `--persona-yield` | one persona's findings raised vs accepted; repeatable. Makes the roster tunable on measured yield rather than belief (P6) — an advisory lens re-convenes only on an accepted finding. |\n| `--project` | project name for the viewer (default: repo dir name) |\n| `--prompt-file` | _(no help text — coverage gap)_ |\n| `--prompt` | _(no help text — coverage gap)_ |\n| `--rationale` | _(no help text — coverage gap)_ |\n| `--root` | docs root (default: docs); audit dir is <root>/audit |\n| `--session` | _(no help text — coverage gap)_ |\n| `--shortname` | _(no help text — coverage gap)_ |\n| `--signal-acceptance-met` | signal: the done_when acceptance criterion was met |\n| `--signal-regression` | signal: a known regression was introduced (a claim, so emit only when checked) |\n| `--signal-verification-executed` | signal: the verification (red-observed) was actually executed |\n| `--signal-verification-path` | signal: a committed Proof Pack / verification path exists (watcher AL2a) |\n| `--since` | _(no help text — coverage gap)_ |\n| `--skill` | _(no help text — coverage gap)_ |\n| `--started` | ISO-8601 UTC start stamp captured at grounding; records started_at + duration_seconds so elapsed time is MEASURED, not modeled (instrumentation over inference, IO1) |\n| `--summary-file` | _(no help text — coverage gap)_ |\n| `--summary` | _(no help text — coverage gap)_ |\n| `--supersedes` | _(no help text — coverage gap)_ |\n| `--tag` | _(no help text — coverage gap)_ |\n| `--title` | _(no help text — coverage gap)_ |\n| `--tool` | _(no help text — coverage gap)_ |\n| `--until` | _(no help text — coverage gap)_ |\n\n## Functions\n\n### `now_iso()`\n\n**Coverage gap** — no docstring in the source.\n\n### `parse_iso(s)`\n\nParse an ISO-8601 UTC stamp. Returns None on anything unparseable -- an unusable\n--started value must degrade to 'no duration recorded', never to a wrong duration.\n\n### `duration_fields(started, ended_iso)`\n\nInstrumentation over inference: when a start stamp is supplied, RECORD the elapsed\nseconds rather than leaving a future reader to model it. Returns {} when the start is\nabsent or unparseable, and refuses a negative duration (clock skew) rather than\nemitting a number that is precise and wrong.\n\n### `parse_agent_run(spec)`\n\n'<agent>|<start-iso>|<end-iso>' -> a span dict, or None when unusable.\n\nDegrades to None on anything unparseable or time-reversed, never to a plausible wrong\nspan (IO8) -- a fabricated interval would corrupt the very measurement it exists for.\n\n### `parallelism_fields(runs)`\n\nUnion-of-intervals wall clock vs summed run time, from a list of parse_agent_run spans.\n\nReturns {} when no usable span is present -- \"not recorded\" rather than a speedup of 1.0\nthat a reader would mistake for a measurement of serial execution.\n\n### `parse_persona_yield(spec)`\n\n'<persona>|<raised>|<accepted>' -> a yield record, or None when unusable.\n\nRefuses accepted > raised and negative counts: a row that cannot be true would corrupt\nevery ratio derived from it, and a corrupt ratio is worse than a missing one (IO8).\n\n### `aggregate_persona_yield(entries)`\n\nRoll persona_yield records up across audit entries.\n\n`acceptance` is None when nothing was raised: 0/0 is an absence of evidence, not a\nmeasured 0% -- reporting 0.0 would read as a verdict on a persona never actually asked.\n\n### `should_reconvene(stats, advisory=…)`\n\nShould this persona be convened AGAIN on the same work? (P6)\n\nAdvisory lenses re-convene on evidence: a repeat run has to be earned by a finding that\nwas actually accepted. Hard-veto lenses are never yield-gated -- a veto exists to be\nable to say no, and gating it on past productivity would silence precisely the review\nthat has been quiet because the work was clean.\n\nA persona with no history always gets its first run; the rule gates repeats, not entry.\n\n### `record_start(root, session, stamp=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `consume_start(root, session)`\n\nReturn the recorded start for this session and clear it, so one marker measures one\nrun. Returns None when there is none -- which degrades to no duration (IO8).\n\n### `audit_dir(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `log_path(root, which)`\n\n**Coverage gap** — no docstring in the source.\n\n### `read_log(root, which, warn=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `append_log(root, which, entry)`\n\n**Coverage gap** — no docstring in the source.\n\n### `next_id(entries, prefix, allocator=…)`\n\nMint the next identifier. EXPAND step of expand-migrate-contract (ADR-0008).\n\nThis function was literally the KG-B shape: max(existing) + 1 over the LOCAL file only.\nTwo branches minting before either has pushed cannot see each other, so the collision is\nstructural -- nine recorded occurrences, twice reaching main, once destroying an entry\nwhen the conflict was resolved by deduping on the id.\n\nThe sequential path is RETAINED, not deleted: every existing al-NNNN keeps its value,\nthere is no backfill (so nothing is guessed), and COORD_LEGACY_IDS=1 restores the old\nscheme entirely. Removing it is the CONTRACT step and is a later decision.\n\n### `git(args, root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `git_context(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `commits_between(before, after, root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `ensure_hub(adir)`\n\nAL7 requires the bundle be registered in the knowledge graph through a hub artifact.\nNothing created it: a fresh install produced audit-data.js, audit-log.jsonl and\nindex.html but no .md, so the bundle was invisible to the graph. Bootstrapped here\nalongside the viewer (AL11) because the same trigger applies - if it is missing, make it.\n\nLinks are deliberately EMPTY: a fresh install has no other artifact to point at, and a\ndangling link fails `docs-graph.py validate` outright. An INBOUND link (from the UI guide\nhub, or the first skill-authored artifact) clears the orphan check - verified by execution.\n\n### `find_template()`\n\n**Coverage gap** — no docstring in the source.\n\n### `project_name(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `render(root, project=…)`\n\nRegenerate audit-data.js and the managed viewer from canonical sources.\n\n### `cmd_start(args)`\n\nInstrumentation over inference (IO1): called as a skill's FIRST action (grounding). It\npersists the run's start stamp keyed by session, so the closing `append` records\nduration_seconds automatically -- no flag to remember, no variable to thread through.\nThat is what makes the measurement default-on rather than opt-in.\n\n### `cmd_append(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_change(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_list(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_search(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_get(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_render(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_git_context(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_yield(args)`\n\nPersona yield across the log: what each lens raised, and what actually landed (P6).\n\nThis is the report the roster is tuned from. It never issues a verdict on a persona --\nit reports the ratio and marks the ones with no evidence either way, because \"never\nraised anything\" and \"raised things nobody took\" are different facts with different\nresponses.\n\n### `cmd_verify(args)`\n\nFR-052. Assert the system of record is fully readable.\n\n`read_log` deliberately survives a malformed line so the tooling keeps working — but a\nline that is silently dropped is a line /dream will never see, and the consolidation\nwould report success over an incomplete corpus. This makes the skip COUNTABLE and\ntherefore gateable: exit 1 while any line is unreadable, naming file and line number.\n\n### `cmd_suggest(args)`\n\nAdvisory: surface meaningful changes that may not be in the change log yet.\n\n### `cmd_selfcheck(args)`\n\nBounded inline session self-assessment (FC-1, spec-agent-focus-controls). One deterministic\npass over a session's substantive turns -> goal-state presence gaps + done_when->summary review\npairs. Advisory and never a scope verdict (the agent/human judges drift); no network, no model,\nno second pass. This is the rung-2 mechanical aid to the CT25 closing self-assessment.\n\n### `cmd_import(args)`\n\nIngest a session-export JSON array of turns into the audit log (build on session history).\n\n## Coverage\n\n- Public functions: **35** · documented: **17** (**49%**)\n- Undocumented (recorded, not invented): `now_iso`, `record_start`, `audit_dir`, `log_path`, `read_log`, `append_log`, `git`, `git_context`, `commits_between`, `find_template`, `project_name`, `cmd_append`, `cmd_change`, `cmd_list`, `cmd_search`, `cmd_get`, `cmd_render`, `cmd_git_context`\n\n"

 {
  "id": "api-context-budget",
  "title": "API — context-budget.py",
  "markdown": "\n# `context-budget.py`\n\n*Generated from `pack/scripts/context-budget.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\ncontext-budget.py — the always-on context budget, measured (AI-Forward Pack).\n\nAn instruction set that is attached to every request IS the static prefix of every call.\nIt is re-read on every turn, it is billed on every turn (cached or not), and it subtracts\nfrom the window before the user has said anything. Left undeclared, it grows silently:\neach new knowledge doc looks free at the moment it is written, because nothing reports\nwhat it costs.\n\nThis makes that cost a NUMBER, emitted on the normal path (instrumentation-over-inference\nIO2/IO4: a feature is not done until its behaviour is measurable by default), and gates it\nso the set cannot re-grow UNNOTICED (continuous-improvement CI6: a lesson recorded as\nprose is a memoir). The control is a ratchet, not a ceiling: growing the set is fine,\ngrowing it without recording that you did is what fails.\n\nEvery knowledge doc declares its own load scope in frontmatter:\n\n    load: always                # attached to every request  -> Tier A, counts against the budget\n    load: glob                  # attached to matching files -> Tier B, costs nothing elsewhere\n    applyTo: \"**/*.cs,**/*.csx\"\n    load: skill                 # read on demand by a skill  -> Tier C\n    skills: [specify, implement]\n    load: reference             # consulted, never attached  -> Tier D\n\nFOUNDATION.md is the vendored provenance manifest: always-loaded by definition, kept\nverbatim, and carries no frontmatter of its own.\n\nSubcommands\n  report      Tier table + the always-on total.\n  gate        Fail on unacknowledged growth past the recorded baseline (ratchet),\n              and on a derived backstop. CI-able. See pack/context-budget.json.\n  agents      Per-agent declared knowledge prefix (the sub-agent lens, P3).\n  preflight   Fail when an assembled prefix would not fit a model's window (P5).\n\nToken figures are ESTIMATES (chars / 4.83) and are labelled as such everywhere. The ratio\nis calibrated against a measured system prompt of 184,364 tokens over 890,204 characters of\nthis doc set. It is accurate enough to gate on and is never presented as a measurement:\nwhere an exact count matters, count with the target model's tokenizer.\n\nPython 3.8+, stdlib only.\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `agents` | per-agent declared knowledge prefix |\n| `gate` | fail on unacknowledged always-on growth (CI-able) |\n| `preflight` | fail before a fan-out that cannot fit |\n| `report` | tier table + always-on total |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--agent` | preflight one agent's lens instead of the main thread |\n| `--agents-dir` | override agent definition discovery |\n| `--ceiling` | override the derived backstop from context-budget.json |\n| `--config` | override context-budget.json discovery |\n| `--knowledge-dir` | override knowledge doc discovery |\n| `--min-headroom` | working headroom the task itself needs (default 32000) |\n| `--overhead` | any further fixed prefix |\n| `--tools` | tool-definition tokens (default 24070, the profiled figure) |\n| `--update-baseline` | record the current total as the new baseline; commit the diff alongside the change that caused the growth |\n| `--window` | target model context window |\n| `-v`, `--verbose` | list every doc |\n\n## Types\n\n### `EmptyCorpus`\n\nThe scanned directory held no knowledge docs.\n\n## Functions\n\n### `est_tokens(chars)`\n\nEstimated tokens for a character count. Always reported as an estimate.\n\n### `find_dir(*candidates, predicate=…)`\n\nResolve a pack directory from either the pack layout or an installed repo.\n\n`predicate` guards against a same-named directory that is not the one meant: walking up\nfrom docs/ai-forward-pack/scripts, a bare \"knowledge\" candidate matches docs/knowledge/\n(the evidence dirs), which contains no knowledge docs at all. Matching it produced an\nempty scan that the gate then reported as clean -- defect class PACK-P.\n\n### `knowledge_dir(explicit=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `config_path(explicit=…)`\n\nLocate the committed budget config (pack/ in the source repo, docs/ai-forward-pack/ once\ninstalled). Returns None when absent -- the gate then runs ceiling-only and says so.\n\n### `load_config(explicit=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `write_baseline(path, total)`\n\nRewrite only always_on_tokens + the stamp, preserving comments, key order and formatting.\n\n### `agents_dirs(explicit=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `read_frontmatter(path)`\n\nReturn (meta_dict, body). meta values are raw strings; lists are parsed for [a, b].\n\n### `scan(kdir)`\n\nEvery knowledge doc with its declared scope and estimated size. Sorted, deterministic.\n\n### `always_on(docs)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_report(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_gate(args)`\n\nFail on UNACKNOWLEDGED GROWTH first, and on the derived backstop second.\n\nThe ratchet is the real control. PACK-R is silent accumulation, so the question that\nmatters is \"did this change grow the always-on set without saying so?\", not \"is the\nnumber above X\". An absolute ceiling answers the second question, stays quiet through\nthe whole accumulation, and then red-lights an ordinary paragraph -- which trains people\nto raise the ceiling reflexively, the exact habit the gate exists to break.\n\n### `cmd_agents(args)`\n\nPer-agent declared knowledge prefix (P3). An agent inherits its LENS, not the world.\n\n### `cmd_preflight(args)`\n\nFail BEFORE a fan-out when the assembled prefix cannot fit the target window (P5).\n\nOne failure at the context ceiling predicts every sibling in the wave: the prefix is\nthe same for all of them. Probing it once costs a subsecond; discovering it per-run\ncost 27 of 39 delegated runs in the profiled session.\n\n## Coverage\n\n- Public functions: **14** · documented: **9** (**64%**)\n- Undocumented (recorded, not invented): `knowledge_dir`, `load_config`, `agents_dirs`, `always_on`, `cmd_report`\n\n"

  "markdown": "\n# `coord-core.py`\n\n*Generated from `pack/scripts/coord-core.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\ncoord-core.py - agent coordination, Phase 1 walking skeleton.\n\nHolds the record of intent and answers \"may this session touch this artifact?\" from it.\nAppend-only JSONL, one file per session; every piece of state is a fold over it. No daemon,\nno database, no dependency beyond the standard library (ADR-0007).\n\nFour controls here were observed failing on the un-fixed shape before they were trusted:\n  LOG-A     an append onto a file not ending in a newline fuses two records and loses BOTH\n  R4        a check that scanned nothing must not report \"free\"\n  CTRL-PORT os.open without O_BINARY translates newlines on Windows -- which also MASKED\n            the LOG-A control, because a stray CR still terminates a line\n  F8        a claim over the coordination record itself would lock the substrate\n\nDesign: docs/design/coord-core-phase1.md\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `add` | append an open seam request |\n| `allocate` | one collision-proof identifier |\n| `check` | may this session touch this path? |\n| `claim` | declare intent over an artifact set |\n| `class` | what class is this artifact? |\n| `collaborate` | cross-session collaboration checks |\n| `doctor` | is the driver effective? is the registry sane? |\n| `guard` | refuse to move HEAD over work held in one place |\n| `hook` | PreToolUse adapter: stdin JSON in, decision JSON out |\n| `install` | write the pre-commit hook; print the settings entry |\n| `list` | list seam requests |\n| `merge-derived` | the .gitattributes merge driver (always 0) |\n| `merge-register` | union two append-only registers (always 0) |\n| `metrics` | the four measures this layer exists to move |\n| `plugin` | emit the bundle both harnesses read; never installs |\n| `precommit` | the universal floor: refuse unclaimed staged paths |\n| `regen` | run the regenerations the driver deferred |\n| `release` | drop a lease |\n| `request` | record or resolve a seam request |\n| `resolve` | resolve a seam request |\n| `session` | one session per working tree |\n| `tail` | the merged chronological stream |\n| `worktree` | session worktree lifecycle: new | list | cleanup |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--base` | commit/branch to branch from (default: current HEAD) |\n| `--branch` | branch to create; name it for the WORK, not the session |\n| `--contract` | _(no help text — coverage gap)_ |\n| `--emit` | _(no help text — coverage gap)_ |\n| `--fix` | push, the cheapest second copy |\n| `--from-role` | _(no help text — coverage gap)_ |\n| `--json` | _(no help text — coverage gap)_ |\n| `--path` | _(no help text — coverage gap)_ |\n| `--reason` | _(no help text — coverage gap)_ |\n| `--register` | _(no help text — coverage gap)_ |\n| `--remove` | cleanup: actually delete. Off by default - deletion is irreversible |\n| `--resolution` | _(no help text — coverage gap)_ |\n| `--scheme` | _(no help text — coverage gap)_ |\n| `--session` | session id to register (default: $AGENT_SESSION) |\n| `--status` | _(no help text — coverage gap)_ |\n| `--timeout` | _(no help text — coverage gap)_ |\n| `--to` | _(no help text — coverage gap)_ |\n| `--ttl` | _(no help text — coverage gap)_ |\n| `--wi` | _(no help text — coverage gap)_ |\n| `-n` | _(no help text — coverage gap)_ |\n\n## Types\n\n### `CoordError`\n\n_(no docstring — coverage gap)_\n\n## Functions\n\n### `repo_root(cwd)`\n\nThe PRIMARY checkout of this repository, from any worktree.\n\nThe record is per REPOSITORY, not per checkout. `--git-common-dir` is the primitive\nthat says so: from a linked worktree it returns the primary .git (absolute), and from\nthe primary checkout it returns a relative \".git\". Its parent is the primary checkout\nin both cases.\n\nFound by running the Phase-1 demo: with the root defaulting to cwd/.agents, every\nworktree got its own private record and two sessions could never see each other -\nwhich is the exact criterion this phase exists to satisfy.\n\nRead from the filesystem, NOT by shelling out to `git rev-parse --git-common-dir`.\nThe first implementation did shell out and cost ~35 ms of the check's budget - measured\nat 82 ms p95, which met NFR-P1 but blew straight through ADR-0007's own 60 ms\ncompaction trigger. On the hot path of every edit, a subprocess is not free.\n\nThe layout this reads is git's own:\n  primary checkout -> .git is a DIRECTORY; the repo root is its parent\n  linked worktree  -> .git is a FILE holding \"gitdir: <primary>/.git/worktrees/<name>\"\n\n### `resolve_root(cwd, raw)`\n\nResolve COORD_ROOT, refusing anything outside the repository.\n\nCOORD_ROOT is attacker-controllable input that selects which file becomes trusted\nstate (STRIDE B1, elevation of privilege). Found at the design gate, not in the draft.\n\n### `overlaps(a, b)`\n\nDo two path patterns intersect? Prefer a false positive: a false refusal costs a\nmessage, a false grant costs a merge.\n\nCompared by SEGMENT, not by string prefix, so src/Foo/** and src/FooBar/** are\ncorrectly disjoint.\n\nsimplify: fnmatch both ways plus a segment-prefix test.\n  ceiling: a wildcard in the middle of a pattern, and character classes.\n  upgrade trigger: the first refusal a human calls wrong, or Phase 3's artifact-class\n  registry introducing nested patterns.\n\n### `make_event(kind, session, agent, wi, path, at, ttl=…, seq=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `append_event(root, event)`\n\nAppend one event as exactly one write() - atomic under O_APPEND (spike S3).\n\n### `read_events(root)`\n\nReturn (events, errors, files_scanned).\n\nErrors are collected, never raised - but a single error makes the whole check\nnot_checked. Fail safe, never open (NFR-R2).\n\n### `fold(events, now)`\n\nPure fold: events -> live leases. Replaying is idempotent (NFR-R1).\n\nderive-don't-store (DM7): `expires` is computed here (at + ttl) and never persisted.\nTwo stored definitions of one quantity is the defect signature.\n\n### `check(root, path, me, now)`\n\n**Coverage gap** — no docstring in the source.\n\n### `render(decision)`\n\nFour labelled lines, fixed order: what happened - who - why - what to do.\n\nNo colour is load-bearing: every state is distinguishable from the text and the exit\ncode alone. Accessibility and machine-readability are the same requirement here.\n\"refused\" is never softened to \"denied\" or \"unavailable\" - the reader is a model that\nmust not read the outcome as a transient failure worth retrying.\n\n### `append_decision(root, session, agent, path, decision)`\n\nRecord one enforcement decision. Never folded; read by `tail` and `metrics`.\n\nG14: the verdict is computed BEFORE this is attempted and cannot be changed by it.\nA refusal that cannot be recorded is still a refusal.\n\n### `read_decisions(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `append_record(path, record)`\n\nAppend one JSONL row to a small operator ledger.\n\n### `request_log_path(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `read_request_events(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `fold_requests(events)`\n\n**Coverage gap** — no docstring in the source.\n\n### `unique_commits(repo)`\n\nCommits reachable from HEAD and from NO other ref. Returns (count, reason_code).\n\n`--all` is FORBIDDEN in this expression. Spike S9 reproduced the recorded bug:\n`git rev-list HEAD --not --all` returns 0 for a branch holding exactly one commit\nthat exists nowhere else, because --all implicitly includes HEAD -- so the expression\nreduces to `HEAD --not HEAD` and reports SAFE for the one case the guard exists to\ncatch. `--exclude=<branch> --all` fails identically, because it does not exclude HEAD.\n\n### `staged_paths(repo)`\n\nStaged paths, NUL-separated. Returns (paths, error).\n\nS8: `--cached` works before the first commit; appending HEAD is FATAL there, so HEAD\nis never passed. The -z form is required - a path containing a space is otherwise\nsplit, and one containing a quote is otherwise escaped.\n\n### `entry_fingerprint(row)`\n\nA stable identity for a register entry, EXCLUDING its id.\n\nThe id is deliberately excluded. In the recorded KG-B instance the two entries had the\nSAME id and different content, and the register's own write-up names them by\n`shortname` rather than by id because rebases had renumbered them three times. A\nfingerprint keyed on the id would both miss the real loss and cry wolf on every\nlegitimate renumber.\n\n`renumbered_from` is excluded for the same reason, and the conservation check found\nthat itself: it is provenance ABOUT a merge, not part of the entry's identity, and\nincluding it made a renumbered entry look destroyed.\n\n### `conservation_lost(ours, theirs, merged)`\n\nEntries present on either side and absent from the merge. Empty means conserved.\n\nUnique ids stop the COLLISION; only this stops the RESOLUTION from destroying an entry,\nwhich is what actually happened. The recorded resolution reported \"203 ours + 203 theirs\n-> 203 unique\" and was caught only because that arithmetic is impossible.\n\n### `merge_register(ours, theirs, base=…)`\n\nUnion two append-only registers by fingerprint. Returns (merged, lost).\n\nAppend-only means the correct resolution is a union, never a pick. Order is preserved:\nours first, then whatever theirs adds.\n\nWhen `base` is supplied, KG-B's own prescribed resolution also applies: *the id is a\nsequence, not an identity.* The side that already published an id keeps it, and an\nentry this merge INTRODUCES on a colliding id is renumbered from the allocator rather\nthan deduped away. NFR-C2 still holds -- nothing already in the base is ever rewritten,\nand with no base the driver cannot tell who published first, so it conserves and does\nnot guess.\n\n### `cmd_merge_register(result_path, base_path, theirs_path, real_path)`\n\nThe merge driver for `register`-class artifacts. ALWAYS exits 0 (the S12b rule).\n\n### `load_registry(root)`\n\nParse `.agents/artifacts.yml` into [(pattern, class, command)].\n\nsimplify: a line-oriented parser for `pattern: class [command...]` plus `#` comments,\n  NOT general YAML.\n  ceiling: anchors, nesting, multi-line values.\n  upgrade trigger: the first registry a human writes that this rejects.\nThirty lines against a dependency the pack does not have (NFR-P2) -- the\nGratuitous-Dependency gate holds at rung 5.\n\nRaises CoordError; never returns a partly-parsed registry, because a half-read registry\nwould silently reclassify whatever it failed to read.\n\n### `classify(root, path)`\n\n(class, reason_code). Longest matching pattern wins; the default is `authored`.\n\nPattern: Null Object -- an unclassified path yields the SAFE class, so no call site\nneeds a branch for \"unknown\".\n\n### `regen_command(root, path)`\n\n**Coverage gap** — no docstring in the source.\n\n### `record_regen_owed(root, path)`\n\n**Coverage gap** — no docstring in the source.\n\n### `regen_owed(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `clear_regen_owed(root, paths)`\n\n**Coverage gap** — no docstring in the source.\n\n### `parse_hook_request(event, repo)`\n\nNormalise any harness's PreToolUse envelope to [(tool_name, repo_relative_path)].\n\nA path of None means \"this tool call carries no path\" -- a shell command, a search, a\nread. That is not the same as \"no path found\", and the difference decides whether the\nlayer has an opinion at all.\n\n### `detect_harness(event)`\n\n**Coverage gap** — no docstring in the source.\n\n### `hook_decision_of(response)`\n\nRead a decision back out of any harness's response envelope.\n\nUsed by the conformance suite so the assertion does not have to know which shape it is\nlooking at -- adding a harness means adding a fixture and a branch here, not rewriting\nthe tests.\n\n### `hook_response_is_valid(response, harness)`\n\nDoes this response match the envelope that harness actually reads?\n\nCopilot consumes the Claude plugin format, and the recorded corpus does not show the\nresponse shape -- so both adapters emit the Claude envelope and this returns True for\nboth. That is a DELIBERATE, RECORDED assumption, not a verified fact: it is exactly\nwhat a live Copilot deny would confirm or refute (H13).\n\n### `hook_response(decision, reason)`\n\nThe PreToolUse envelope. ALWAYS printed, and the caller ALWAYS exits 0 - the\nharness reads the decision in the JSON, not the exit code. Conflating them would make\na crashed hook indistinguishable from a refusal.\n\n### `cmd_hook(root, session, agent, now, stdin_text, repo=…)`\n\nG1: this must never raise. A hook that crashes on a bad payload blocks every edit.\n\nEnvelope-agnostic: `parse_hook_request` normalises whichever harness is calling. Copilot\nBATCHES tool calls, so one invocation can carry several paths -- and if any of them is\nrefused the whole batch is refused. A false refusal costs a message; a false grant costs\na merge.\n\n### `cmd_precommit(root, repo, session, agent, now)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_guard(repo, fix)`\n\n**Coverage gap** — no docstring in the source.\n\n### `active_sessions(root, now, stale_seconds=…)`\n\nFold the append-only record into active collaboration sessions.\n\nThe session ledger is evidence that someone announced themselves, not proof that nobody\nelse exists (DC-024). This fold therefore reports only positive liveness; callers that\nneed absence-of-use proof must also inspect the filesystem/worktree state.\n\n### `session_contract_path(repo)`\n\n**Coverage gap** — no docstring in the source.\n\n### `contract_ownership(repo)`\n\nParse the simple ownership tables from the session contract template.\n\nThis is intentionally Markdown-shaped rather than a general Markdown parser: the pack\nowns the template and the rows are `| Path | Why |` under `### <Role> owns`.\nUnknown shapes simply yield no ownership facts; the contract remains human-readable.\n\n### `infer_session_roles(session, agent, ownership)`\n\nInfer contract role membership from session/agent labels.\n\nThis stays advisory. A false warning costs a message; a false grant is what creates\ncross-owned edits. A later slice can replace this with explicit `COORD_ROLE`.\n\n### `owner_rows_for_path(ownership, path)`\n\n**Coverage gap** — no docstring in the source.\n\n### `collaboration_findings(root, repo, now, snapshot=…)`\n\nReturn collaboration health findings.\n\nThis is a small operator gate over the live session fold. It is deliberately advisory:\nit catches the AI-DE class where two sessions had to publish a contract and claim files\nto avoid merge/rebase damage, but it does not pretend a claim is a distributed lock.\n\n### `cmd_session_list(root, now, as_json=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_collaborate(root, repo, action, now, as_json=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_request(root, action, now, session, agent, args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `worktree_inventory(repo)`\n\nParse `git worktree list --porcelain`. Returns (records, error).\n\nPorcelain is used rather than the human format because a path containing a space is\notherwise unparseable - the same reasoning as staged_paths()'s -z form.\n\n### `worktree_is_clean(path)`\n\nTrue when there is nothing modified, staged OR UNTRACKED.\n\nUntracked is the condition that matters most: a new file nobody has committed exists\nnowhere else, so deleting its tree destroys the only copy. `git status --porcelain`\nincludes untracked by default and the -z form survives paths with spaces or quotes.\n\n### `worktree_safety(record, primary, cwd, live_keys, index)`\n\nWT7, in order, fail-safe. Returns (safe, reason).\n\nEvery condition is a HARD STOP that reports rather than removes. A cleanup that deletes\non a heuristic will eventually delete the tree that mattered, and that single event ends\nthe adoption of the whole practice.\n\n### `cmd_worktree(root, repo, action, cwd, now, session=…, agent=…, branch=…, base=…, remove=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_session(root, action, session, agent, cwd, now)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_metrics(root, repo, as_json)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_install(repo, root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_merge_derived(root, repo, result_path, base_path, theirs_path, real_path)`\n\nThe .gitattributes merge driver. ALWAYS returns 0 -- see _write_conflict.\n\nResolves a `derived` artifact to OURS and records that a regeneration is owed; anything\nit cannot classify as derived gets conventional conflict markers instead.\n\n### `cmd_regen(root, repo, timeout=…)`\n\nRun the regenerations the driver deferred. Returns (exit_code, results).\n\nA failed regeneration STAYS OWED and reports non-zero: a stale derived artifact looks\nfinished, which is worse than a conflict.\n\n### `driver_status(repo)`\n\nIs the merge driver EFFECTIVE? Requires reading BOTH sources (spike S13).\n\n`git check-attr` reports the DECLARATION whether or not a driver exists, and\n`git config` reports the registration without knowing what it covers. Only comparing\nthe two finds the gap -- and .git/config is per-clone and never committed, so a fresh\nclone or a new worktree is exactly where the gap appears.\n\n### `cmd_doctor(root, repo)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_plugin_emit(out_dir)`\n\nWrite the plugin bundle BOTH harnesses read. It never installs anything.\n\nS14 established that Copilot CLI consumes the Claude plugin format verbatim --\n`.claude-plugin/plugin.json` plus `hooks/hooks.json` with the same matcher/hooks shape\nand the same ${CLAUDE_PLUGIN_ROOT} placeholder. One bundle therefore serves both, which\nis what made NFR-C1 cheap.\n\nSTRIDE B9: this writes only where it is told and PRINTS what it wrote. It never edits\n~/.copilot/settings.json or .claude/settings.json, because a layer that grants itself\ntool permissions is the elevation it exists to prevent -- the same rule `install`\nfollows by printing the settings entry rather than writing it.\n\n## Coverage\n\n- Public functions: **56** · documented: **33** (**59%**)\n- Undocumented (recorded, not invented): `make_event`, `check`, `read_decisions`, `request_log_path`, `read_request_events`, `fold_requests`, `regen_command`, `record_regen_owed`, `regen_owed`, `clear_regen_owed`, `detect_harness`, `cmd_precommit`, `cmd_guard`, `session_contract_path`, `owner_rows_for_path`, `cmd_session_list`, `cmd_collaborate`, `cmd_request`, `cmd_worktree`, `cmd_session`, `cmd_metrics`, `cmd_install`, `cmd_doctor`\n\n"

  "title": "API — coord_ids.py",
  "markdown": "\n# `coord_ids.py`\n\n*Generated from `pack/scripts/coord_ids.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\ncoord_ids.py - collision-proof identifiers, in ONE place.\n\nImported by both `coord-core.py` and `audit-log.py`. It exists as its own module rather than\nas a copy in each because six lines duplicated across two scripts is ONE-A -- a shared rule\nwith no gate accretes private copies, and the copies only diverge later, when one is edited.\nThe underscore in the filename is deliberate: a hyphen is not importable, which is why\n`bounded_process.py` is named the way it is.\n\nWHY NOT `uuid.uuid7()`: absent on the installed 3.12 (it landed in 3.14) and present on the\n\"3.x\"-pinned CI runner. A stdlib call that exists on the runner and not on the developer's\nmachine is PACK-J by construction. Established by spike S1, not assumed.\n\nWHY NOT SCANNING: the prevention built for KG-B scans every remote branch before allocating.\nIt works, it takes about a second over 22 branches, and it collided again within the hour --\ntwo sessions that mint before either has pushed are invisible to each other. Scanning is\nrejected as a DESIGN, not as an implementation.\n\nDesign: docs/design/coord-federation-phase3.md · ADR-0008.\n```\n\n## Functions\n\n### `new_id(scheme, ts_ms=…)`\n\n48 bits of millisecond timestamp + 80 bits of os.urandom, Crockford base32.\n\nTime-ordered, so a register still sorts chronologically without a sequence. Issuance\nrequires no communication between issuers -- that second property is the whole point,\nbecause a scheme that is only safe when issuers can see each other is the defect.\n\nProven at 1,500 ids from 6 separate processes pinned to a single millisecond with no\nshared state and no network: 0 collisions.\n\n### `resolve_prefix(rows, prefix)`\n\n(status, result, corpus_size) where status is unique | ambiguous | nomatch.\n\nThe git short-hash idiom. ADR-0008 accepted that a 26-character id is not human-sayable\nbut did not name the consumer that breaks: asking for an entry by number. Prefix recall\nrestores that WITHOUT introducing a second identity.\n\nThe corpus size is returned with EVERY verdict (R4/PACK-P): \"not found\" over an empty\nregister must never render the same as \"not found\" over a full one.\n\n## Coverage\n\n- Public functions: **2** · documented: **2** (**100%**)\n\n"
 },

  "markdown": "\n# `design-lint.py`\n\n*Generated from `pack/scripts/design-lint.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\ndesign-lint.py — token-reference linter for design-language docs (AI-Forward).\n\nMakes UI Standard U3 (\"reference a token, never an arbitrary value\") a *forcing\nfunction* for a DESIGN.md-style design-language doc (templates/design-language.template.md).\nStdlib only; lives in the script bundle (deployed to docs/ai-forward-pack/scripts/).\n\nChecks:\n  1. FAIL  — every `{group.token}` reference in the body resolves to a token declared\n            in the frontmatter (group in: colors, typography, rounded, spacing,\n            elevation, motion). An unresolved reference is a broken token contract.\n  2. FAIL  — the frontmatter declares at least a `colors:` and a `typography:` block\n            (a design language without them is not one).\n  3. WARN  — raw hex (`#rrggbb`) found in the body. Hex in the palette *table* is fine\n            (that's documentation); hex in a component/layout spec should be a `{token}`.\n            Non-failing — surfaced for human review.\n\nExit 0 clean (warnings allowed), 1 on any FAIL. Usage: design-lint.py <file.md> [...]\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--strict` | treat warnings as failures too |\n\n## Functions\n\n### `split_frontmatter(text)`\n\nReturn (frontmatter_lines, body_text). Frontmatter is the first --- ... --- block.\n\n### `parse_tokens(fm_lines)`\n\nMap each token-group to the set of token names declared under it.\n\nHandles both block style (`colors:` then indented `  primary: ...`) and\ninline-flow style (`rounded: { sm: 6px, md: 8px }` / `spacing: { scale: [...] }`).\n\n### `lint(path)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **3** · documented: **2** (**67%**)\n- Undocumented (recorded, not invented): `lint`\n\n"

  "markdown": "\n# `docs-graph.py`\n\n*Generated from `pack/scripts/docs-graph.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\ndocs-graph.py — the AI-Forward Pack docs script bundle (knowledge-visualization.md V18).\n\nDeterministic mechanics for the knowledge graph, so skills invoke ONE tool instead of\ngenerating ad-hoc scripts at prompt time. Python 3.8+, stdlib only (a built-in parser\ncovers the V2 frontmatter subset; no PyYAML needed).\n\nSubcommands\n  inventory   Scan the graph: artifacts, missing/invalid frontmatter, bad links,\n              unregistered rels, orphans, stale (V13), flagged (V16), index drift. JSON out.\n  derive      Full derivation sweep: frontmatter -> docs/docs-index.js (V2/V10).\n  validate    inventory + nonzero exit on DEFECTS (CI-able). `--gate fail` also fails on\n              suggestions (V16 flags, V13 staleness), which only warn by default.\n  freshness   The freshness gate's time-based half: stale + flagged + orphans; exit code.\n  flag        V16 propagation: --changed <id> --reason \"...\" flags inbound neighbors.\n  clear-flag  Clear a review-suggested flag (--id <artifact> --by <changed-id>) and\n              optionally --bump-review <days>.\n  stub        Scaffold a new artifact file with schema-correct frontmatter.\n  snapshot    Append a graph-health record to docs/health-history.jsonl (governance trend).\n  rollup      Aggregate per-artifact markdown tables under a heading (e.g. the designs'\n              STRIDE / privacy tables) into one register, each row prefixed with its\n              source artifact — paste-ready for the threat-model / privacy-review docs.\n  context     Build one deterministic, bounded, provenance-rich grounding packet.\n\nConventions\n  --root defaults to docs/. Excluded from the graph: docs/ai-forward-pack/**, docs/_site/**,\n  docs/index.html, docs/docs-index.js, non-.md files. Frontmatter is the record; this tool   "title": "API — dream.py",
  "markdown": "\n# `dream.py`\n\n*Generated from `pack/scripts/dream.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\ndream.py - the AI-Forward dreaming / continuous-improvement consolidation harness.\n\nOffline, reviewable consolidation over the committed corpus (audit-log.jsonl, change-log.jsonl,\nthe defect-class register, captured mitigations, and triggered simplify:/assume: markers). It runs\nlight -> (REM) -> deep and emits a *dream*: a set of reviewable proposals + an HTML review view + a\nDream Diary entry. It writes NO durable store on `run` - only `apply-decisions` (after a human\napproves in the HTML view) touches a durable store, and it re-validates + re-scrubs first.\n\nDesign authority: docs/architecture-dreaming.md + ADR-0002..0005 + spec-dreaming.\n- Deterministic at the floor (LOA P2): staging, taint gate, scrub, dedup, scoring, thresholds,\n  rendering, promotion and reconciliation are all stdlib. The one model step (REM abstraction) is an\n  INJECTED boundary (ADR-0005): `run` produces deterministic proposals; a runner may enrich them.\n- Human gate, no auto-merge (BoK D3): `run` proposes; `apply-decisions` writes only approved items.\n- Append-only inputs, new-artifact output: the source logs are never mutated.\n\nPython 3.8+, stdlib only. Subcommands:\n  run                 Consolidate the corpus -> a dream (dream.json + dream-data.js + review HTML + diary).\n  capture-mitigation  Append a MitigationRecord (the promotion oracle) - red-green or human-validated.\n  apply-decisions     Validate a decisions file from the review view, then promote approved learnings.\n  list                Show recent dreams / mitigations.\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `apply-decisions` | promote approved learnings from a decisions file |\n| `capture-mitigation` | append a MitigationRecord (the promotion oracle) |\n| `list` | show recent dreams and mitigations |\n| `run` | consolidate the corpus into a dream |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--boundary` | where the class applies / does not |\n| `--class` | the defect-class id/signature this addressed |\n| `--control` | the control the fix leaves behind |\n| `--days` | corpus window in days (default 30) |\n| `--oracle` | _(no help text — coverage gap)_ |\n| `--root` | repo root (default: discover from cwd) |\n| `--session` | session id for the audit trail |\n| `--summary` | what was mitigated |\n| `--test` | a verifying test id (repeatable; required for red-green) |\n\n## Functions\n\n### `find_root(start)`\n\n**Coverage gap** — no docstring in the source.\n\n### `now_iso()`\n\n**Coverage gap** — no docstring in the source.\n\n### `read_jsonl(path)`\n\n**Coverage gap** — no docstring in the source.\n\n### `append_jsonl(path, obj)`\n\n**Coverage gap** — no docstring in the source.\n\n### `scrub(text)`\n\n**Coverage gap** — no docstring in the source.\n\n### `control_text(record)`\n\nThe control on a learning may be a {rung, text} object (what a dream writes) or a bare\nstring (a hand-edited store, or an older record — this JSONL is a plain committed file\nanyone can edit). Chaining `.get(\"control\", {}).get(\"text\")` crashed with an unhandled\nAttributeError on the string form. A genuinely absent control still returns \"\" and is\nrejected by the caller, so the CI6 guard is unchanged; only the crash is gone.\n\n### `is_tainted(sig)`\n\n**Coverage gap** — no docstring in the source.\n\n### `parse_defect_classes(path)`\n\nVery small parser for docs/lessons/defect-classes.md: one entry per '### <ID> - <shape>'.\n\n### `grep_markers(root)`\n\nHarvest simplify:/assume: markers (bounded; skip generated/vendored trees).\n\n### `load_corpus(root, days)`\n\n**Coverage gap** — no docstring in the source.\n\n### `score(freq, distinct_days, has_control, recency=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `build_proposals(corpus)`\n\n**Coverage gap** — no docstring in the source.\n\n### `dream_id(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `render_data_js(dream)`\n\n**Coverage gap** — no docstring in the source.\n\n### `render_html(root, out_dir)`\n\n**Coverage gap** — no docstring in the source.\n\n### `append_diary(root, dream)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_run(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_capture_mitigation(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_apply_decisions(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_list(args)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **20** · documented: **3** (**15%**)\n- Undocumented (recorded, not invented): `find_root`, `now_iso`, `read_jsonl`, `append_jsonl`, `scrub`, `is_tainted`, `load_corpus`, `score`, `build_proposals`, `dream_id`, `render_data_js`, `render_html`, `append_diary`, `cmd_run`, `cmd_capture_mitigation`, `cmd_apply_decisions`, `cmd_list`\n\n"

  "markdown": "\n# `foundation-check.py`\n\n*Generated from `pack/scripts/foundation-check.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nfoundation-check.py — vendored-foundation drift detection (AI-Forward Pack).\n\nThe pack vendors foundation docs from the base Agent Knowledge Pack into knowledge/.\nThey WILL diverge over time; this makes divergence visible instead of surprising.\nHashes are computed over NORMALIZED content (CRLF->LF, trailing-space strip) so line\nendings never masquerade as drift. Stdlib only.\n\nUsage\n  foundation-check.py                 # verify knowledge/ matches FOUNDATION.md manifest\n  foundation-check.py --base <dir>    # additionally diff vendored vs base-pack copies\n  foundation-check.py --update        # rewrite manifest hashes from current knowledge/\nExit: 0 clean, 1 drift/missing.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--base` | path to the base Agent Knowledge Pack |\n| `--update` | rewrite manifest hashes from current files |\n\n## Functions\n\n### `nhash(path)`\n\n**Coverage gap** — no docstring in the source.\n\n### `read_manifest()`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **2** · documented: **0** (**0%**)\n- Undocumented (recorded, not invented): `nhash`, `read_manifest`\n\n"
