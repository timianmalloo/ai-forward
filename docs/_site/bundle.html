  "markdown": "\n# `graphify-setup.py`\n\n*Generated from `pack/scripts/graphify-setup.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\ngraphify-setup.py - stand up the CODE knowledge graph and join it to the docs graph.\n\nWHAT THIS IS\n  Graphify (graphify.com, Apache 2.0, PyPI `graphifyy`) builds an on-device knowledge graph\n  of a codebase that an AI assistant queries instead of grepping, with file:line citations and\n  a provenance tag on every edge. This script wires it into an AI-Forward repo and - the part\n  that does not exist anywhere else - JOINS it to the pack's documentation graph.\n\n  A repository has two knowledge graphs and the expensive defects live in the gap between them:\n    * the DOCS graph (docs-index.js, from V2 frontmatter) holds INTENT\n    * the CODE graph (graphify-out/graph.json)          holds REALITY\n  Nothing normally traverses both, which is exactly why documentation drifts from code. --join\n  computes the two gaps that matter: documentation with no implementation, and risk with no\n  governance.\n\nDESIGN RULES THIS HONORS  (knowledge/code-knowledge-graph.md, GK1-GK16)\n  * The docs graph stays the record; the code graph is a derived build output (GK2-GK3).\n  * Graph the SOURCE, never its generated projections (GK4) - .graphifyignore does this.\n  * Provenance is carried through: EXTRACTED -> Verified, INFERRED -> Inferred,\n    AMBIGUOUS -> Flagged (GK6). A citation is not a promotion.\n  * The join is a LENS: derived, never authoritative, and a prompt rather than a gate (GK11).\n\nUSAGE\n  graphify-setup.py --check                # is graphify installed, built, ignored, joined?\n  graphify-setup.py --install              # uv tool install graphifyy + register the skill\n  graphify-setup.py --init                 # write .graphifyignore + .gitignore rules\n  graphify-setup.py --build                # full, ignore-respecting re-extraction\n  graphify-setup.py --join                 # write docs/lenses/code-doc-join.md\n  ... --root <repo> --platform claude,copilot --dry-run --json\n\nStdlib only. Python 3.8+. Exit 0 on success, 1 on error, 2 on --check findings.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--build` | full ignore-respecting re-extraction |\n| `--check` | report state, write nothing (default) |\n| `--dry-run` | _(no help text — coverage gap)_ |\n| `--init` | write .graphifyignore and the .gitignore rule |\n| `--install` | install graphifyy and register the skill |\n| `--join` | write docs/lenses/code-doc-join.md |\n| `--json` | machine-readable join output |\n| `--platform` | assistants to register (default: claude,copilot) |\n| `--root` | repository root (default: .) |\n| `--top` | ungoverned symbols to report (default 15) |\n\n## Functions\n\n### `detect_repo_kind(root)`\n\nReturn (kind, canonical, rules). Detect - never assume - which copy is authoritative.\n\n### `ignore_template(root, tool=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `out(msg=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `write_text(path, text, dry)`\n\n**Coverage gap** — no docstring in the source.\n\n### `graphify_exe()`\n\nResolve the CLI, including uv's tool dir which is often not on PATH in a fresh shell.\n\n### `run(cmd, cwd, dry, label)`\n\n**Coverage gap** — no docstring in the source.\n\n### `load_code_graph(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `load_docs_graph(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `resolve_reference(root, artifact_path, ref)`\n\nResolve a referenced path the way a reader would: relative to the artifact first\n(so `../web/index.html` inside docs/index.md works), then relative to the repo root.\nReturns (normalised_repo_relative_path, exists).\n\n### `join_graphs(root, code, docs, top_n=…)`\n\nCompute the two gaps between intent and reality (GK11).\n\n### `render_join(j)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **11** · documented: **4** (**36%**)\n- Undocumented (recorded, not invented): `ignore_template`, `out`, `write_text`, `run`, `load_code_graph`, `load_docs_graph`, `render_join`\n\n"

  "markdown": "\n# `marker-lint.py`\n\n*Generated from `pack/scripts/marker-lint.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nmarker-lint.py - completeness check for the pack's inline decision markers.\n\nTier-1 of the prose->structure review (docs/proposals/prose-to-structure-review.html).\nThe `simplify:` (L5) and `assume:` (NG4) markers each carry required fields that were,\nuntil now, specified only in prose and therefore unenforced:\n\n  simplify: <shortcut> ... <TRIGGER>                 (the \"revisit when\" condition; L5/L6)\n  assume:   <belief> ... <CONSEQUENCE> ... <CONFIRM>  (what breaks + how to verify; NG4)\n\nThis lints for the *semantic components* the directives already require, using the existing\nfree-prose marker style (a trigger keyword / an em-dash clause / a \"Confirm:\" cue) rather than\nmandating a new label syntax - so every existing marker and the dream.py harvest regex keep\nworking. It is the first-class harvest command L6 names as the natural follow-up.\n\nPosture (V16a / the docs-graph.py --gate pattern): default reports and exits 0 (warn,\ngrandfathers legacy free-form); --gate exits 1 on any finding. --json for machine use. A clean\nscan of a non-empty corpus says so, so an empty run is distinguishable from a clean one (E14).\n\nStdlib only; Python 3.8+.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--gate` | exit nonzero on any finding (default: warn) |\n| `--include-md` | also scan .md files |\n| `--json` | emit JSON |\n| `--root` | directory to scan (default: cwd) |\n\n## Functions\n\n### `scan(root, include_md)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **1** · documented: **0** (**0%**)\n- Undocumented (recorded, not invented): `scan`\n\n"

  "markdown": "\n# `obsidian-setup.py`\n\n*Generated from `pack/scripts/obsidian-setup.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nobsidian-setup.py - stand up (and analyze) the Obsidian lens over an AI-Forward docs graph.\n\nWHAT THIS IS\n  The pack's knowledge graph lives in per-artifact YAML frontmatter under docs/ (V2), which\n  makes docs/ *already* a valid Obsidian vault. This script makes that lens real and shared:\n  it writes a committed .obsidian/ configuration (graph colour groups keyed to the pack's own\n  artifact types, the enabled plugin list, sensible defaults), seeds non-canonical dashboard\n  \"lenses\", and keeps per-user workspace/cache files out of git.\n\n  It ALSO ships a dependency-free graph analyzer (--analyze) that computes the same class of\n  structural insight the Obsidian graph-analysis plugins provide - degree, betweenness\n  centrality (Brandes), components, orphans, structural gaps - directly from docs-index.js.\n  That matters: the insight must not be locked behind a GUI plugin, because the pack promises\n  tool-neutrality (project-memory-and-obsidian.md M8: Obsidian is a reader, never the writer\n  of record).\n\nDESIGN RULES THIS HONORS\n  * Frontmatter stays the record; docs-graph.py stays the only writer of the graph. This\n    script never edits an artifact's frontmatter and never writes docs-index.js.\n  * Obsidian is never required. Every mode works, and --analyze is useful, with Obsidian\n    absent.\n  * Third-party plugin CODE is not downloaded by default. `--init` writes only the *enabled\n    list*, so Obsidian's own UI performs the install with the user's consent. `--fetch-plugins`\n    is an explicit, pinned opt-in.\n\nUSAGE\n  obsidian-setup.py --check                  # report state, write nothing (default)\n  obsidian-setup.py --init                   # write .obsidian/ config + lenses + .gitignore\n  obsidian-setup.py --analyze                # structural insight report to stdout\n  obsidian-setup.py --analyze --write        # ...and save it to docs/lenses/graph-insight.md\n  obsidian-setup.py --fetch-plugins          # opt-in: download pinned plugin releases\n  obsidian-setup.py --install-app            # print the OS install command (--yes to run it)\n  ... --root <repo> --vault docs --dry-run --json\n\nStdlib only. Python 3.8+. Exit 0 on success, 1 on error, 2 on --check findings.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--all-plugins` | include the optional-tier plugins |\n| `--analyze` | structural insight from docs-index.js |\n| `--check` | report state, write nothing (default) |\n| `--dry-run` | print the plan, write nothing |\n| `--fetch-plugins` | opt-in: download plugin code from GitHub releases |\n| `--init` | write .obsidian/ config, lenses, .gitignore |\n| `--install-app` | install the Obsidian desktop app |\n| `--json` | machine-readable output (with --analyze) |\n| `--root` | repository root (default: .) |\n| `--vault` | vault directory relative to root (default: docs) |\n| `--write` | with --analyze: save to <vault>/lenses/graph-insight.md |\n| `--yes` | with --install-app: actually run it |\n\n## Functions\n\n### `out(msg=…)`\n\nPrint without dying on a legacy Windows console codepage.\n\n### `write_json(path, obj, dry)`\n\n**Coverage gap** — no docstring in the source.\n\n### `write_text(path, text, dry)`\n\n**Coverage gap** — no docstring in the source.\n\n### `load_index(root)`\n\nParse docs/docs-index.js (a JS assignment wrapping a JSON object).\n\n### `build_graph(index)`\n\nReturn (nodes, undirected adjacency, directed out/in) keyed by artifact id.\n\n### `betweenness(nodes, adj)`\n\nBrandes' betweenness centrality, unweighted, on the undirected projection.\n\nO(V*E). Exact - no sampling - which is affordable at documentation scale and\nmeans the ranking is reproducible rather than approximate.\n\n### `components(nodes, adj)`\n\n**Coverage gap** — no docstring in the source.\n\n### `analyze(index, root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `render_report(a)`\n\n**Coverage gap** — no docstring in the source.\n\n### `type_colors()`\n\nGraph colour groups keyed to the PACK's artifact types.\n\nThis is the whole point of a committed graph.json: Obsidian's default graph is an\nundifferentiated hairball, and the pack's types are exactly the differentiation that\nmakes it readable. Queries use Obsidian's search syntax over frontmatter.\n\n### `init_vault(root, vault, dry, enable_optional)`\n\n**Coverage gap** — no docstring in the source.\n\n### `lens_notes(project)`\n\nNon-canonical dashboards. Each carries V2 frontmatter so it is a first-class\ngraph node rather than an un-indexed finding, and each states plainly that it is a\nLENS - a projection - never a source of truth (M5/M8).\n\n### `update_gitignore(root, vault, dry)`\n\n**Coverage gap** — no docstring in the source.\n\n### `fetch_registry()`\n\n**Coverage gap** — no docstring in the source.\n\n### `fetch_plugins(root, vault, dry, enable_optional)`\n\nExplicit opt-in: download plugin code from each plugin's GitHub release.\n\nThis executes third-party JavaScript inside Obsidian, so it is NOT the default.\nThe safer path - and the one --init sets up - is to let Obsidian's own plugin\nbrowser install them with the user's consent.\n\n### `app_install_command()`\n\n**Coverage gap** — no docstring in the source.\n\n### `app_installed()`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **17** · documented: **7** (**41%**)\n- Undocumented (recorded, not invented): `write_json`, `write_text`, `components`, `analyze`, `render_report`, `init_vault`, `update_gitignore`, `fetch_registry`, `app_install_command`, `app_installed`\n\n"

  "markdown": "\n# `pack-doctor.py`\n\n*Generated from `pack/scripts/pack-doctor.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\npack-doctor.py — AI-Forward install-health check (deployable; runs in a TARGET repo).\n\nReports whether THIS repo has the pack installed and healthy: the installed revision, both\ntool surfaces present, the managed blocks intact, and the knowledge graph valid + fresh.\nOne PASS/WARN/FAIL line per check with a suggested fix; exit 1 if any FAIL, or if any WARN\nis present under --strict.\n\nDistinct from tools/check-consistency.py (which validates the pack SOURCE — pack/ == docs).\nA target repo has no pack/, so this checks INSTALL health, not source consistency.\nDesign: docs/design/pack-doctor.md. Stdlib only; composes docs-graph.py for the graph half.\n\nUsage\n  pack-doctor.py [--root <repo>] [--json] [--strict]\nExit: 0 all PASS/WARN (or all PASS under --strict) · 1 any FAIL/strict WARN.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--json` | _(no help text — coverage gap)_ |\n| `--root` | _(no help text — coverage gap)_ |\n| `--strict` | treat warnings and inconclusive checks as release-blocking failures |\n\n## Functions\n\n### `check_installed(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `check_surface(root, label, subdirs)`\n\n**Coverage gap** — no docstring in the source.\n\n### `check_block(root, fname)`\n\n**Coverage gap** — no docstring in the source.\n\n### `check_graph(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `check_node_runner()`\n\nReport whether `npm run …` can actually resolve node on THIS machine.\n\nFR-055 / registered class PACK-C — *a documented command assumed portable*. The pack and\nits contributor docs say `npm run test:docs-explorer:core`. On a real Windows host that\ncommand printed `'node' is not recognized` while `node --version` succeeded and the\nidentical test invocation run directly passed 31/31. A contributor sees a failure that\nis not a failure and may \"fix\" a healthy suite; CI is Linux-only so it never surfaces\nthere — precisely the blind spot PACK-C describes.\n\nThe probe is the diagnosis: node resolving *for you* proves nothing, because npm runs\nscripts through a **child shell** (cmd.exe on Windows, sh elsewhere) whose PATH can\ndiffer from your own. So this spawns that same shell and asks it for node — which is the\nonly thing that predicts whether the documented command will work.\n\nMirrors check_interpreter()'s stance for `python3`: name the working invocation for this\nmachine once, here, instead of discovering it one command at a time (CI6).\n\n### `check_interpreter()`\n\nReport the invocation form that actually runs Python 3 on THIS machine.\n\nThe pack documents `python3 …` because that is the POSIX-correct name and matches every\nscript's shebang. It is not universally available: python.org's Windows installer ships\n`python.exe` and `py.exe` but **no `python3.exe`**, and Windows additionally provides a\n`python3` App-Execution-Alias that is not Python at all - it prints \"Python was not\nfound\" and exits 9009. So a Windows reader copy-pasting a documented command sees what\nlooks like a missing Python installation when Python is installed and working.\n\nThis check exists so that failure is reported once, here, with the right answer, instead\nof being discovered one command at a time (continuous-improvement.md CI6 - convert the\nlesson into a control that fires at the moment of the mistake).\n\n### `run(root)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **7** · documented: **2** (**29%**)\n- Undocumented (recorded, not invented): `check_installed`, `check_surface`, `check_block`, `check_graph`, `run`\n\n"

 {
  "id": "api-prompt-log",
  "title": "API — prompt-log.py",
  "markdown": "\n# `prompt-log.py`\n\n*Generated from `pack/scripts/prompt-log.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nprompt-log.py — the fast prompt-reuse lens over the project's audit log.\n\nA tiny, stdlib-only front-end for browsing, searching, and **reusing** the prompts already\nrecorded in the committed **audit log** (docs/audit/audit-log.jsonl). Unified with the Audit &\nChange Log Standard (audit-and-change-log.md): there is **one store of prompts** — the audit\nlog — and this is the reuse lens over it (its arrow-navigable stack + clipboard reuse), the\ncompanion to the broader /auditlog timeline/search/change-log/viewer.\n\n  add      log a prompt (writes a kind:prompt entry to the audit log)  -> via audit-log.py\n  list     show the stack, newest first (label · time)\n  search   freeform search; matches contain ALL terms\n  show     print one entry in full (label, time, text)\n  get      print one entry's RAW text only (for piping/copying)\n  browse   interactive stack: Up/Down move, Right expand, Left collapse, Enter reuse\n  pick     like browse, pre-filtered by a search query (powers /searchprompts)\n\nREUSE MODEL (honest about the medium). A script cannot type into the Copilot CLI's input\nline, so \"reuse\" copies the chosen prompt to the clipboard (pbcopy, when present) and prints\nit — you paste it into your next prompt (Cmd+V) and edit before sending.\n\nONE STORE. The default store is the committed audit log (docs/audit/audit-log.jsonl), so every\nprompt the audit mandate records — skill runs, scripts, and prompts you `add` — is reusable\nhere, and there is no second parallel prompt store. `add` writes through audit-log.py (the\nsingle writer of record, AL0.1) as a kind:prompt entry. Override the store with --store or\n$AIFORWARD_PROMPT_LOG (e.g. a legacy <repo>/.aiforward/prompts.jsonl); the reader adapts to\neither schema. Stdlib only; no third-party import.\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `add` | log a prompt (to the audit log by default) |\n| `browse` | interactive stack (↑/↓ move, → expand, ← collapse, Enter reuse) |\n| `get` | print one entry's RAW text (for piping/copying) |\n| `list` | show the stack, newest first |\n| `pick` | interactive stack pre-filtered by a query (powers /searchprompts) |\n| `search` | freeform search (matches contain ALL terms) |\n| `self-test` | exercise the data layer (no TTY needed) |\n| `show` | print one entry in full |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--copy` | also copy to the clipboard |\n| `--json` | emit JSON |\n| `--label` | a short label / shortname (default: derived from the first line) |\n| `--limit` | max entries to show (0 = all) |\n| `--no-copy` | don't copy the chosen prompt to the clipboard |\n| `--quiet` | don't echo the logged line |\n| `--session` | the session id to record on the audit entry (default: prompt-log) |\n| `--store` | _(no help text — coverage gap)_ |\n| `--summary` | the audit summary (default: 'prompt logged for reuse') |\n| `--tag` | a tag (repeatable) |\n| `--text` | the prompt text |\n\n## Functions\n\n### `resolve_store(explicit=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `load_entries(store)`\n\nReturn entries oldest-first in the stack shape; callers reverse for newest-first views.\n\nReads the unified audit log (or a legacy store) and adapts each row; rows with no prompt\ntext are skipped (you cannot reuse an empty prompt).\n\n### `append_entry(store, entry)`\n\n**Coverage gap** — no docstring in the source.\n\n### `newest_first(entries)`\n\n**Coverage gap** — no docstring in the source.\n\n### `filter_entries(entries, query)`\n\nCase-insensitive AND match over label+text; preserves order.\n\n### `resolve_one(entries_newest, ref)`\n\nResolve a 1-based newest-first index OR an id (full/unique-prefix) to an entry.\n\n### `copy_to_clipboard(text)`\n\npbcopy (macOS) / xclip / clip.exe when available; returns the tool name or None.\n\n### `cmd_add(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_list(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_search(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_show(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_get(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_browse(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_pick(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_selftest(args)`\n\nExercise the data layer end-to-end in a temp store (no TTY needed).\n\n### `build_parser()`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **16** · documented: **5** (**31%**)\n- Undocumented (recorded, not invented): `resolve_store`, `append_entry`, `newest_first`, `cmd_add`, `cmd_list`, `cmd_search`, `cmd_show`, `cmd_get`, `cmd_browse`, `cmd_pick`, `build_parser`\n\n"

  "markdown": "\n# `scrub.py`\n\n*Generated from `pack/scripts/scrub.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nscrub.py — first-pass PII/secret redaction for Markdown (deployable).\n\nRedacts OBVIOUS personal data (emails) and common secret shapes (token prefixes, private keys)\nfrom Markdown, with --check (report; nonzero on hit) and --write (redact in place). It is the\non-brand, dependency-free analogue of Squad's `scrub-emails`.\n\n  ⚠ THIS IS A FIRST-PASS, NOT CI-GRADE. Regex recall is limited — it will miss PII/secrets that\n  NLP (Microsoft Presidio) or entropy/rule engines (gitleaks, detect-secrets, TruffleHog) catch.\n  Use those in CI for real enforcement, and git-filter-repo / BFG to PURGE anything already\n  committed (scrub redacts going forward; it does not rewrite history).\n\nDesign: docs/design/rai-and-scrub.md. Stdlib only. Never prints a raw secret (preview is redacted).\n\nUsage\n  scrub.py [paths...] [--check | --write] [--aggressive] [--json]\n  (default paths: docs/ and pack/ ; default mode: --check)\nExit: --check -> 1 if any finding else 0 ; --write -> 0.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--aggressive` | also flag any 32+ char token (more false positives) |\n| `--check` | report findings, nonzero exit on any (default) |\n| `--json` | _(no help text — coverage gap)_ |\n| `--write` | redact findings in place |\n\n## Functions\n\n### `scan_text(text, aggressive=…)`\n\nYield (lineno, category, raw_match) for each finding (skips already-redacted spans).\n\n### `redact_text(text, aggressive=…)`\n\nReturn text with every match replaced by [REDACTED:<category>] (idempotent).\n\n## Coverage\n\n- Public functions: **2** · documented: **2** (**100%**)\n\n"

  "markdown": "\n# `ui-craft-gate.py`\n\n*Generated from `pack/scripts/ui-craft-gate.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nui-craft-gate.py - the UI craft gate for AI-Forward.\n\nRuns the Impeccable deterministic detector (`impeccable detect --json`) over a UI\nsurface and translates its findings into the pack's own review shape, per\n`ui-craft-detection.md` CD11: every finding gains a **dimension** (one of the\nDX22 rubric dimensions), a pack **severity** (Nit/Minor/Major/Blocker) with the\nCD12 accessibility and token-discipline floors applied, and the owning pack\ndirective. Stdlib only; lives in the script bundle (deployed to\ndocs/ai-forward-pack/scripts/).\n\nWhy this exists: the detector is the rung-2 automated control under the pack's UI\ncraft doctrine (`continuous-improvement.md` CI6), but its raw output is not a\nreview finding. This performs the translation once, in a script, rather than by\nhand in every session - and it applies the severity floors that U16 (accessibility\nhard veto) and U3/U20 (token discipline) require and a linter's own defaults do not.\n\nModes\n  (default)   report  - print the measurement + the rubric table; exit 0\n  --gate      gate    - exit 1 if any Blocker-mapped finding is present\n  --a11y-obligation   accessibility findings become Blockers (CD12)\n  --markdown          emit a paste-ready markdown section for docs/reviews/ui-<surface>.md\n  --json              emit the translated findings as JSON\n\nExit codes: 0 clean/report, 1 blockers present (with --gate), 2 detector unavailable\nor it scanned nothing (CD9 - an empty corpus is a success-shaped failure).\n\nUsage:\n  ui-craft-gate.py <file-or-dir-or-url> [...] [--gate] [--a11y-obligation]\n                   [--markdown] [--json] [--impeccable <cmd>]\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--a11y-obligation` | the product is under an accessibility obligation; accessibility findings become Blockers (CD12) |\n| `--gate` | exit 1 if any Blocker-mapped finding is present |\n| `--impeccable` | explicit detector command (default: auto-resolve) |\n| `--json` | emit the translated findings as JSON |\n| `--markdown` | emit a paste-ready markdown review section |\n\n## Functions\n\n### `resolve_detector(explicit=…)`\n\nReturn an argv prefix that runs the detector, or None.\n\nOrder: explicit --impeccable > `impeccable` on PATH > local node_modules >\n`npx impeccable`. Establishing the tool rather than assuming it is NG1.\n\n### `run_detector(prefix, targets)`\n\nRun `detect --json` and return the parsed finding list.\n\nThe detector exits non-zero when it finds anti-patterns, which is a *result*,\nnot a failure - so the exit code is deliberately not treated as an error\n(`end-to-end-integrity.md` E14: read the state, do not read the exit code).\n\n### `translate(findings, a11y_obligation)`\n\nCD11 - give each finding the pack's shape; CD12 - apply the severity floors.\n\n### `measurement(rows)`\n\nDX23 - measure before you diagnose. Counts are the diagnosis.\n\n### `render_markdown(rows, targets)`\n\n**Coverage gap** — no docstring in the source.\n\n### `render_text(rows, targets)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **6** · documented: **4** (**67%**)\n- Undocumented (recorded, not invented): `render_markdown`, `render_text`\n\n"

  "markdown": "\n# `visual-assets-setup.py`\n\n*Generated from `pack/scripts/visual-assets-setup.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nvisual-assets-setup.py - wire up a generation backend for UI visual assets (AI-Forward).\n\n`ui-visual-assets.md` (VA1-VA18) governs *whether and how* imagery, personas and motion\nmay be generated for a UI. This script is the *mechanism*: it reports which generation\nbackends a repo can actually reach, scaffolds the asset directory and manifest, and keeps\nthe credential and hygiene rules that VA9/VA11 depend on. Stdlib only; lives in the script\nbundle (deployed to docs/ai-forward-pack/scripts/).\n\nIt deliberately does NOT generate anything and NEVER writes a credential. Generation runs\nthrough the `/visualize` skill against whichever backend is configured; secrets live in the\nenvironment or the agent host's own MCP configuration, never in the repository.\n\nModes\n  --check      what is configured, what is missing, and exactly how to fix it\n  --init       scaffold docs/assets/, the DESIGN.md assets manifest, and .gitignore hygiene\n  --init-mcp   write a GIT-IGNORED project-level .mcp.json for an MCP backend, plus a\n               committed .mcp.json.example. Credentials come from the environment, or are\n               reused from an agent-host config that already has them. Never committed.\n  --backends   print the backend capability matrix and exit\n  --dry-run    with --init/--init-mcp: print what would change, write nothing\n  --json       machine-readable output for --check\n\nExit codes: 0 fine, 1 nothing usable is configured (with --check), 2 a hygiene problem was\nfound that needs a human (a credential appears to be committed).\n\nUsage:\n  visual-assets-setup.py --check [--json]\n  visual-assets-setup.py --init [--dry-run]\n  visual-assets-setup.py --backends\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--backends` | print the capability matrix |\n| `--check` | report what is configured |\n| `--dry-run` | with --init/--init-mcp, write nothing |\n| `--init-mcp` | write a git-ignored project .mcp.json (+ committed .example) for an MCP backend (default: higgsfield) |\n| `--init` | scaffold assets dir, manifest and hygiene |\n| `--json` | machine-readable --check |\n| `--root` | repository root (default: .) |\n\n## Functions\n\n### `repo_paths(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `find_design_md(root)`\n\nVA12's manifest lives in the design language. Resolve it the way the craft\ndetector does (repo root, then docs/) so both tools agree on one file (CD4).\n\n### `backend_status(name, spec)`\n\n**Coverage gap** — no docstring in the source.\n\n### `scan_for_committed_secrets(root)`\n\nA generation credential in the tree is a hygiene failure, not a style issue.\nDeliberately shallow and cheap: a first-pass tripwire, not a scanner (see the\nResponsible-AI policy - real enforcement belongs in CI secret scanning).\n\n### `resolve_mcp_entry(spec)`\n\nFind the installed server entry point. Established by looking, not assumed:\nthe global npm root differs per platform and per install method.\n\n### `read_user_mcp_credentials(spec)`\n\nReuse credentials already configured in the agent host, so `--init-mcp` works for\nsomeone who set the server up interactively and never exported the variables.\nReturns (creds, source) and NEVER logs a value.\n\n### `cmd_init_mcp(root, backend, dry_run)`\n\nWrite a GIT-IGNORED project-level .mcp.json plus a committed .example.\n\nCopilot CLI reads project config from `.mcp.json` (cwd up to the repo root) and\n`.github/mcp.json`, and project definitions take precedence over the user config.\nVerified from the official docs. What is NOT established is `${VAR}` expansion inside\nthe `env` block - the docs say environment variables \"must be configured here\" and the\nchangelog only documents auto-inclusion for vars referenced in command/args/cwd. So a\ncommitted config cannot carry the credentials, and this writes a git-ignored one\ninstead of relying on expansion that was never verified (NG1/NG6).\n\n### `cmd_backends()`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_check(root, as_json)`\n\n**Coverage gap** — no docstring in the source.\n\n### `ensure_gitignore(root, dry_run)`\n\n**Coverage gap** — no docstring in the source.\n\n### `ensure_manifest(root, dry_run)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_init(root, dry_run)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **12** · documented: **5** (**42%**)\n- Undocumented (recorded, not invented): `repo_paths`, `backend_status`, `cmd_backends`, `cmd_check`, `ensure_gitignore`, `ensure_manifest`, `cmd_init`\n\n"

<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const markedUrl = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";

function loadMarked(){
  return new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src=markedUrl; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}
const isDark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad:false, theme: isDark ? "dark" : "default", securityLevel:"loose" });

const docs = window.DOCS || [];
const byId = Object.fromEntries(docs.map(d=>[d.id,d]));

function buildNav(){
  const nav = document.getElementById("nav");
  const groups = {};
  docs.forEach(d=>{ (groups[d.group||"Pages"] ||= []).push(d); });
  for(const g of Object.keys(groups)){
    const h=document.createElement("div"); h.className="group"; h.textContent=g; nav.appendChild(h);
    groups[g].forEach(d=>{ const a=document.createElement("a"); a.textContent=d.title;
      a.href="#"+d.id; a.dataset.id=d.id; nav.appendChild(a); });
  }
}
async function render(id){
  const d = byId[id] || docs[0]; if(!d) return;
  document.getElementById("crumb").textContent = (d.group? d.group+" / ":"")+d.title;
  document.getElementById("content").innerHTML = window.marked.parse(d.markdown||"");
  // convert ```mermaid code blocks into rendered diagrams
  document.querySelectorAll("code.language-mermaid").forEach((c,i)=>{
    const div=document.createElement("div"); div.className="mermaid"; div.textContent=c.textContent;
    c.closest("pre").replaceWith(div);
  });
  try{ await mermaid.run({ querySelector:".mermaid" }); }catch(e){ console.warn("mermaid:",e); }
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active", a.dataset.id===d.id));
  const m=window.DOC_META||{}; document.getElementById("footer").textContent =
    `Generated ${m.generated||"—"} · documented commit ${(m.documented_sha||"—").slice(0,7)}`;
}
addEventListener("hashchange",()=>render(location.hash.slice(1)));
(async()=>{ await loadMarked(); buildNav(); render(location.hash.slice(1) || (docs[0]&&docs[0].id)); })();
</script>
