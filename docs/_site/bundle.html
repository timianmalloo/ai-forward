  "markdown": "\n# `pack-doctor.py`\n\n*Generated from `pack/scripts/pack-doctor.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\npack-doctor.py — AI-Forward install-health check (deployable; runs in a TARGET repo).\n\nReports whether THIS repo has the pack installed and healthy: the installed revision, both\ntool surfaces present, the managed blocks intact, and the knowledge graph valid + fresh.\nOne PASS/WARN/FAIL line per check with a suggested fix; exit 1 if any FAIL, or if any WARN\nis present under --strict.\n\nDistinct from tools/check-consistency.py (which validates the pack SOURCE — pack/ == docs).\nA target repo has no pack/, so this checks INSTALL health, not source consistency.\nDesign: docs/design/pack-doctor.md. Stdlib only; composes docs-graph.py for the graph half.\n\nUsage\n  pack-doctor.py [--root <repo>] [--json] [--strict]\nExit: 0 all PASS/WARN (or all PASS under --strict) · 1 any FAIL/strict WARN.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--json` | _(no help text — coverage gap)_ |\n| `--root` | _(no help text — coverage gap)_ |\n| `--strict` | treat warnings and inconclusive checks as release-blocking failures |\n\n## Functions\n\n### `check_installed(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `check_surface(root, label, subdirs)`\n\n**Coverage gap** — no docstring in the source.\n\n### `check_codex(root)`\n\nCheck the deployed pack contract, never claim a running Codex catalog was read.\n\n### `check_claude_md_import(root)`\n\nCTX-B / F-01. Copilot CLI loads BOTH AGENTS.md and CLAUDE.md as custom instructions\n(measured: two ~58 KB <custom_instruction> blocks in one captured prefix), while Claude\nCode reads only CLAUDE.md and expands an `@AGENTS.md` import in place. The pack's\nbyte-identical parity therefore pays the managed block twice on every Copilot request.\nThe fix is structural, so the check is too: CLAUDE.md must be the import stub.\n\n### `check_copilot_settings()`\n\nF-09 / WT1a. `contextTier: long_context` and `effortLevel: high` as GLOBAL defaults let a\nsession grow without a compaction and pay maximum reasoning on every T0 turn - the profiled\n23-hour session went 159k -> 564k tokens with zero compactions. Both are per-phase\nchoices (GO19), so a global setting is reported, not assumed.\n\n### `check_claude_settings(root)`\n\nF-12 / IO14. `showThinkingSummaries` is the richest thinking display Claude Code offers; a\nproject that profiles its sessions wants it on. Project scope (.claude/settings.json) so it\ntravels with the repo; the user file is reported but never edited.\n\n### `check_hooks(root)`\n\nF-07 / CTX-D. The re-read guard is a control only when a host runs it.\n\n### `check_block(root, fname)`\n\n**Coverage gap** — no docstring in the source.\n\n### `check_graph(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `check_mail(root)`\n\nThe message layer's invariants (design-message-layer section 9; D10).\n\nmail dir         FAIL when anything under .agents/mail/ is tracked (bodies would reach git)\nledger tracking  FAIL when .agents/log/ is ignored (D10 tracks the ledgers by default)\nmail twins       FAIL naming every state-changing mail id with no {\"type\":\"mail\"} ledger twin\ndoorbells        one line per harness from .agents/harness-status.json; absent -> \"not recorded\"\n\n### `check_requests(root)`\n\nTyped seam requests (spec-typed-seam-requests): FAIL on a request past its deadline with\nno recorded outcome; WARN on stale acks and untyped rows; `not recorded` with no store.\nOne reader: coord-core.py's request_doctor_lines, loaded beside this file.\n\n### `check_heartbeat(root)`\n\nProgress liveness (spec-liveness-and-track, P3): who beats, how fresh, how many stalled -\nor `not recorded` when no heartbeat row exists (CTX-H: an uninstalled control looks like a\nquiet fleet). One reader: coord-core.py's heartbeat_doctor_line, loaded beside this file.\n\n### `check_coordination(root)`\n\nIs the coordination layer switched ON in this repo? (CTX-H)\n\nThe layer ships inert: `coord-core.py` is deployed and nothing writes the one file the\nwhole mechanism keys on. An uninstalled layer reports \"0 decisions, nothing claimed\",\nwhich is indistinguishable from a working layer that saw no traffic -- so the absence\nhas to be checked here or it is not checked anywhere.\n\nThree states, three verdicts:\n  no script         the check does not apply\n  no/broken registry FAIL - every path is `authored`, nothing is ever regenerated\n  declared-not-registered WARN - .git/config is per-clone and never committed, so a\n                        fresh CLONE lands here. A worktree does NOT: it shares the\n                        parent's config and inherits the registration, which is why\n                        the remedy names the primary checkout and `coord install`\n                        refuses to run from a linked tree.\n\n### `check_node_runner()`\n\nReport whether `npm run …` can actually resolve node on THIS machine.\n\nFR-055 / registered class PACK-C — *a documented command assumed portable*. The pack and\nits contributor docs say `npm run test:docs-explorer:core`. On a real Windows host that\ncommand printed `'node' is not recognized` while `node --version` succeeded and the\nidentical test invocation run directly passed 31/31. A contributor sees a failure that\nis not a failure and may \"fix\" a healthy suite; CI is Linux-only so it never surfaces\nthere — precisely the blind spot PACK-C describes.\n\nThe probe is the diagnosis: node resolving *for you* proves nothing, because npm runs\nscripts through a **child shell** (cmd.exe on Windows, sh elsewhere) whose PATH can\ndiffer from your own. So this spawns that same shell and asks it for node — which is the\nonly thing that predicts whether the documented command will work.\n\nMirrors check_interpreter()'s stance for `python3`: name the working invocation for this\nmachine once, here, instead of discovering it one command at a time (CI6).\n\n### `check_interpreter()`\n\nReport the invocation form that actually runs Python 3 on THIS machine.\n\nThe pack documents `python3 …` because that is the POSIX-correct name and matches every\nscript's shebang. It is not universally available: python.org's Windows installer ships\n`python.exe` and `py.exe` but **no `python3.exe`**, and Windows additionally provides a\n`python3` App-Execution-Alias that is not Python at all - it prints \"Python was not\nfound\" and exits 9009. So a Windows reader copy-pasting a documented command sees what\nlooks like a missing Python installation when Python is installed and working.\n\nThis check exists so that failure is reported once, here, with the right answer, instead\nof being discovered one command at a time (continuous-improvement.md CI6 - convert the\nlesson into a control that fires at the moment of the mistake).\n\n### `run(root)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **16** · documented: **11** (**69%**)\n- Undocumented (recorded, not invented): `check_installed`, `check_surface`, `check_block`, `check_graph`, `run`\n\n"

  "markdown": "\n# `prompt-compile.py`\n\n*Generated from `pack/scripts/prompt-compile.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nprompt-compile.py - the compile stage: a logged raw prompt -> a gated, harness-rendered prompt.\n\nTHE SHAPE (design docs/design/compile-stage.md): a deterministic SKELETON (references resolved\nunder the repo root and hashed, pass-through detected by a fixed grammar, the harness template\nloaded from the registry) -> the running agent FILLS the model-only fields in the JSON ->\nFINISH runs the gate (verify-compiled-prompt.py, imported by path), renders the harness idiom,\nappends ONE `kind: compilation` audit entry and copies the text to the clipboard. Nothing is\nlogged on a refusal; `finish` is the only writer and writes last.\n\nVERBS\n  skeleton  --text \"<raw>\" | --text-file <path> | --from-audit <al-id>  --harness <name> --out <path.json>\n            [--no-model] [--audit-root <docs dir>] [--templates-dir <dir>]\n  finish    <compiled.json> [--harness <name>] --session <id> [--compiler-model <name>]\n            [--compile-tokens <n>] [--no-clipboard] [--audit-root <docs dir>] [--templates-dir <dir>]\n  render    <compiled.json> --harness <name> [--templates-dir <dir>]  |  render --self-test\n  distance  --compiled <al-id> --received-file <path> [--audit-root <docs dir>]\n\nREFUSALS (stderr, `<code>: <target> - fix: <text>`, exit 1): empty prompt · raw not found ·\ntemplate missing · template ambiguous · forbidden construct · and every gate code. Exit 2 is usage\n(a malformed compiled JSON names the offending key). Stdlib only; UTF-8 on every seam.\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `distance` | _(no help text — coverage gap)_ |\n| `finish` | _(no help text — coverage gap)_ |\n| `render` | _(no help text — coverage gap)_ |\n| `skeleton` | _(no help text — coverage gap)_ |\n\n## CLI — options\n\n| Option | Help |\n|-   "markdown": "\n# `prompt-log.py`\n\n*Generated from `pack/scripts/prompt-log.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nprompt-log.py — the fast prompt-reuse lens over the project's audit log.\n\nA tiny, stdlib-only front-end for browsing, searching, and **reusing** the prompts already\nrecorded in the committed **audit log** (docs/audit/audit-log.jsonl). Unified with the Audit &\nChange Log Standard (audit-and-change-log.md): there is **one store of prompts** — the audit\nlog — and this is the reuse lens over it (its arrow-navigable stack + clipboard reuse), the\ncompanion to the broader /auditlog timeline/search/change-log/viewer.\n\n  add      log a prompt (writes a kind:prompt entry to the audit log)  -> via audit-log.py\n  list     show the stack, newest first (label · time)\n  search   freeform search; matches contain ALL terms\n  show     print one entry in full (label, time, text)\n  get      print one entry's RAW text only (for piping/copying)\n  browse   interactive stack: Up/Down move, Right expand, Left collapse, Enter reuse\n  pick     like browse, pre-filtered by a search query (powers /searchprompts)\n\nREUSE MODEL (honest about the medium). A script cannot type into the Copilot CLI's input\nline, so \"reuse\" copies the chosen prompt to the clipboard (pbcopy, when present) and prints\nit — you paste it into your next prompt (Cmd+V) and edit before sending.\n\nONE STORE. The default store is the committed audit log (docs/audit/audit-log.jsonl), so every\nprompt the audit mandate records — skill runs, scripts, and prompts you `add` — is reusable\nhere, and there is no second parallel prompt store. `add` writes through audit-log.py (the\nsingle writer of record, AL0.1) as a kind:prompt entry. Override the store with --store or\n$AIFORWARD_PROMPT_LOG (e.g. a legacy <repo>/.aiforward/prompts.jsonl); the reader adapts to\neither schema. Stdlib only; no third-party import.\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `add` | log a prompt (to the audit log by default) |\n| `browse` | interactive stack (↑/↓ move, → expand, ← collapse, Enter reuse) |\n| `get` | print one entry's RAW text (for piping/copying) |\n| `list` | show the stack, newest first |\n| `pick` | interactive stack pre-filtered by a query (powers /searchprompts) |\n| `search` | freeform search (matches contain ALL terms) |\n| `self-test` | exercise the data layer (no TTY needed) |\n| `show` | print one entry in full |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--copy` | also copy to the clipboard |\n| `--file` | read the prompt text from a UTF-8 file (the safe path for non-ASCII under a Windows console) |\n| `--json` | emit JSON |\n| `--label` | a short label / shortname (default: derived from the first line) |\n| `--limit` | max entries to show (0 = all) |\n| `--no-copy` | don't copy the chosen prompt to the clipboard |\n| `--quiet` | don't echo the logged line |\n| `--raw` | show one raw prompt and its compilations only (P7) |\n| `--session` | the session id to record on the audit entry (default: prompt-log) |\n| `--store` | _(no help text — coverage gap)_ |\n| `--summary` | the audit summary (default: 'prompt logged for reuse') |\n| `--tag` | a tag (repeatable) |\n| `--text` | the prompt text |\n\n## Functions\n\n### `resolve_store(explicit=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `display_label(e)`\n\nThe stack row's label. A `kind:compilation` row (P7) is the rendered compiled twin of a\nlogged prompt, so it is suffixed with the raw prompt it was compiled from - the operator\nsees both and can reuse either (spec-compile-stage US-6).\n\n### `filter_raw(entries, raw_id)`\n\n--raw <al-id>: the raw prompt and its compilations only (any kind whose id is the raw id,\nplus every compilation naming it); preserves order.\n\n### `load_entries(store)`\n\nReturn entries oldest-first in the stack shape; callers reverse for newest-first views.\n\nReads the unified audit log (or a legacy store) and adapts each row; rows with no prompt\ntext are skipped (you cannot reuse an empty prompt).\n\n### `append_entry(store, entry)`\n\n**Coverage gap** — no docstring in the source.\n\n### `newest_first(entries)`\n\n**Coverage gap** — no docstring in the source.\n\n### `filter_entries(entries, query)`\n\nCase-insensitive AND match over label+text; preserves order.\n\n### `resolve_one(entries_newest, ref)`\n\nResolve a 1-based newest-first index OR an id (full/unique-prefix) to an entry.\n\n### `copy_to_clipboard(text)`\n\npbcopy (macOS) / xclip / wl-copy (Wayland) / clip.exe; returns the tool name or None.\n\nTwo cross-platform rules (DC-211). (1) `clip.exe` decodes its stdin with the console\ncode page, so UTF-8 bytes land as mojibake - it is fed UTF-16LE with a BOM, the one\nencoding it reads unambiguously whatever the code page is. (2) The ladder falls\nTHROUGH: a tool that is on PATH but fails to launch (an xclip with no DISPLAY, a WSL\nshim) hands its turn to the next rung instead of ending the ladder at the first\nfailure, which previously returned None with Wayland/clip.exe still untried.\n\n### `cmd_add(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_list(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_search(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_show(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_get(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_browse(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_pick(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_selftest(args)`\n\nExercise the data layer end-to-end in a temp store (no TTY needed).\n\n### `build_parser()`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **18** · documented: **7** (**39%**)\n- Undocumented (recorded, not invented): `resolve_store`, `append_entry`, `newest_first`, `cmd_add`, `cmd_list`, `cmd_search`, `cmd_show`, `cmd_get`, `cmd_browse`, `cmd_pick`, `build_parser`\n\n"

  "id": "api-repo_identity",
  "title": "API — repo_identity.py",
  "markdown": "\n# `repo_identity.py`\n\n*Generated from `pack/scripts/repo_identity.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nrepo_identity.py - the canonical project name, in ONE place (class PACK-P).\n\nWHY THIS EXISTS. The pack's own worktree discipline (WT1) requires every writing session to\nwork in its own linked worktree, and `coord worktree new` names that directory\n`<repo>-<branch-slug>`. Any generator that names the project `basename(cwd)` therefore stamps\nthe WORKTREE folder into a committed artifact the moment the discipline is followed:\n`docs/audit/audit-data.js` (\"project\"), `docs/audit/index.html` (<title>), the Docs Explorer\nsurface titles. Following one rule guaranteed corrupting the other -- a tool that infers\nidentity from the filesystem, inside a system whose own discipline moves work around the\nfilesystem. Observed in this repo (a commit stamped `ai-forward-feature-audit-signals-writer`)\nand repeatedly in a consuming repo, always caught by eye or by a bundle gate, never by a test.\n\nRESOLUTION ORDER, and why each rung is where it is:\n  1. an explicit name the caller was given (`--project`)  -- configuration beats inference,\n     always, and this is the rung that makes the others a fallback rather than a guess;\n  2. `remote.origin.url` -- explicit git configuration, shared by every worktree of the repo,\n     and the only rung that is stable across a clone whose directory was renamed;\n  3. the PRIMARY checkout's directory name, via `git rev-parse --git-common-dir` -- one call\n     that resolves to the primary repo's `.git` even from a linked worktree;\n  4. the directory name -- last resort, for a tree that is not a git repository at all.\n\nVERIFIED, not assumed (Windows, git 2.x, 2026-09-10):\n  * from a linked worktree, `--git-common-dir` -> `C:/Projects/ai-forward/.git` (absolute);\n  * from the PRIMARY checkout it returns the RELATIVE string `.git`, whose dirname is ''.\n    So rung 3 MUST resolve it against the repo path before taking a basename; a naive\n    `dirname(common_dir)` yields an empty name in the most common case of all.\n  * outside a git repository, `git rev-parse` exits 128 with empty stdout, and\n    `git config --get remote.origin.url` exits 1 -- so both rungs must tolerate failure\n    rather than raise.\n\nStdlib only, Python 3.8+. The underscore in the filename is deliberate: a hyphen is not\nimportable, which is why `coord_ids.py` and `bounded_process.py` are named the way they are.\n```\n\n## Functions\n\n### `canonical_project(root, explicit=…)`\n\nThe project's canonical name -- never the worktree folder it happened to run in.\n\n`root` is any path inside the repository (a worktree root, or a directory under it).\n`explicit` is a caller-supplied override (`--project`) and always wins when non-empty.\nReturns a non-empty string; falls back to \"repo\" only when there is no name to be had.\n\n## Coverage\n\n- Public functions: **1** · documented: **1** (**100%**)\n\n"
 },

  "id": "api-run-verify-gates",
  "title": "API — run-verify-gates.py",
  "markdown": "\n# `run-verify-gates.py`\n\n*Generated from `pack/scripts/run-verify-gates.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nrun-verify-gates.py - every verify-*.py gate, one exit status, no pipe.\n\nThe control for defect class DC-113 (a gate made advisory by the SHAPE of the shell line)\nin its loop form. Measured in a consuming repo over three days: 168 main-line shell lines\npiped a gate run into `tail`/`head`/`grep` with no pipefail, 102 of them also committing,\nmerging or pushing on the same line; four hid a red. A `for ... done` loop's exit status is\nits LAST command's, not its worst one's, so \"chain with &&\" is defeated by construction -\nthere is no single status to chain on. This runner IS that status.\n\nWhat it runs. Every `verify-*.py` in the repository's gate directories - by default\n`tools/` (the repo's own gates) and `docs/ai-forward-pack/scripts/` (the pack's) - each in\nits argument-free form, which every gate is expected to support as \"check the repository\".\nA gate that needs arguments gets them with `--args NAME=ARG ...`. A gate that is missing,\ncannot be started, or runs past its budget counts as a FAILURE, never as a skip; a skip is\nprinted by name (`--skip`), never silently.\n\nWhy not bounded_process.run_bounded: it blanks stdout on a non-zero exit (its callers read\nstderr diagnostics only), and the one thing this runner must relay is a failing gate's last\nprinted line - the finding. The budget is enforced here with a process-tree kill instead.\n\nUsage\n  python3 run-verify-gates.py                        run every gate found\n  python3 run-verify-gates.py --dir tools            only this directory (repeatable)\n  python3 run-verify-gates.py --skip verify-slow.py  skip by basename (printed as skipped)\n  python3 run-verify-gates.py --args verify-test-run.py=--no-run\n  python3 run-verify-gates.py --budget 300           seconds per gate (default 300)\n  python3 run-verify-gates.py --self-test            prove a red gate is reported red\n\nExit 0 when every gate passed, 1 when any failed, 2 on a usage error (no gate found).\nStdlib only. Use it as the ONLY line before a commit at a join:\n  python3 run-verify-gates.py && git commit ...\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--args` | arguments for one gate, e.g. verify-test-run.py=--no-run (repeatable) |\n| `--budget` | per-gate wall budget; past it the gate is killed and counted red |\n| `--dir` | gate directory relative to the repo root (repeatable; default: tools/ and docs/ai-forward-pack/scripts/) |\n| `--root` | repository root (default: git's answer from the cwd) |\n| `--self-test` | prove the runner reports a failing gate as a failure |\n| `--skip` | gate basenames to skip - each is printed as skipped, never silently |\n\n## Functions\n\n### `repo_root(start=…)`\n\nThe repository root: git's answer, else the nearest ancestor carrying `tools/` or\n`docs/ai-forward-pack/`, else the cwd. Printed, never assumed silently.\n\n### `gates(root, dirs)`\n\n**Coverage gap** — no docstring in the source.\n\n### `run_one(gate, root, extra_args=…, budget=…)`\n\n(ok, seconds, last_line). A gate past its budget is killed with its children and is\na failure - a hung gate that is waited on forever is the same silence as a skipped one.\n\n### `parse_args_map(specs)`\n\n**Coverage gap** — no docstring in the source.\n\n### `self_test()`\n\nA gate that exits 1 must be red; one that exits 0 green; one that hangs past its\nbudget red - and the runner's own exit status must carry each verdict (DC-104: a control\nthat cannot fail is not a control).\n\n## Coverage\n\n- Public functions: **5** · documented: **3** (**60%**)\n- Undocumented (recorded, not invented): `gates`, `parse_args_map`\n\n"
 },

  "markdown": "\n# `scrub.py`\n\n*Generated from `pack/scripts/scrub.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nscrub.py — first-pass PII/secret redaction for Markdown (deployable).\n\nRedacts OBVIOUS personal data (emails) and common secret shapes (token prefixes, private keys)\nfrom Markdown, with --check (report; nonzero on hit) and --write (redact in place). It is the\non-brand, dependency-free analogue of Squad's `scrub-emails`.\n\n  ⚠ THIS IS A FIRST-PASS, NOT CI-GRADE. Regex recall is limited — it will miss PII/secrets that\n  NLP (Microsoft Presidio) or entropy/rule engines (gitleaks, detect-secrets, TruffleHog) catch.\n  Use those in CI for real enforcement, and git-filter-repo / BFG to PURGE anything already\n  committed (scrub redacts going forward; it does not rewrite history).\n\nDesign: docs/design/rai-and-scrub.md. Stdlib only. Never prints a raw secret (preview is redacted).\n\nUsage\n  scrub.py [paths...] [--check | --write] [--aggressive] [--json]\n  (default paths: docs/ and pack/ ; default mode: --check)\nExit: --check -> 1 if any finding else 0 ; --write -> 0.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--aggressive` | also flag any 32+ char token (more false positives) |\n| `--check` | report findings, nonzero exit on any (default) |\n| `--json` | _(no help text — coverage gap)_ |\n| `--write` | redact findings in place |\n\n## Functions\n\n### `scan_text(text, aggressive=…)`\n\nYield (lineno, category, raw_match) for each finding (skips already-redacted spans).\n\n### `redact_text(text, aggressive=…)`\n\nReturn text with every match replaced by [REDACTED:<category>] (idempotent).\n\n## Coverage\n\n- Public functions: **2** · documented: **2** (**100%**)\n\n"

  "id": "api-session-profile",
  "title": "API — session-profile.py",
  "markdown": "\n# `session-profile.py`\n\n*Generated from `pack/scripts/session-profile.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nsession-profile.py — measure how agent sessions actually ran, across harnesses and models.\n\nInstrumentation over inference (IO1) pointed at the agent's own work: instead of reasoning\nabout why a session felt slow, expensive or drifty, READ the telemetry every harness already\nwrites to disk and turn it into a findings table (what happened, with evidence) and a fixes\ntable (which pack surface owns the control). This is the \"asleep half\" of continuous\nimprovement (`/dream`) specialised to performance, efficiency, task adherence, fan-out and\ncross-harness coordination — the /session-profiler skill drives it.\n\nSources (all local, all read-only):\n\n  GitHub Copilot CLI   ~/.copilot/session-store.db        sessions, turns, assistant_usage_events\n                       ~/.copilot/session-state/<id>/events.jsonl   the full event stream\n                       ~/.copilot/settings.json           model / contextTier / effortLevel\n  Claude Code          ~/.claude/projects/<slug>/<session>.jsonl    the transcript\n                       ~/.claude/projects/<slug>/<session>/subagents/agent-*.jsonl (+ .meta.json)\n                                                          every sub-agent: model, requests, tokens,\n                                                          tool calls and waits, context, span, resumes\n\nCost is reported in TOKENS and REQUESTS (the units a subscription-bound operator can act on),\n`_meta.quota` where the harness carries it, and dollars ONLY as an \"if API-billed\" estimate at\nfirst-party list rates that are printed beside every figure (LIST_RATES, with the date they\nwere cached) - never as a bill.\n\nA repo is selected by path (`--repo <path>`, repeatable). Copilot sessions match on cwd or the\n`owner/name` remote; Claude Code sessions match on the project slug of the repo path and of each\nof its git worktrees. Every number is either read from the store or labelled as an estimate;\na measurement path that does not exist reports \"not recorded\", never a plausible number (IO8).\n\nSubcommands\n  discover   list the sessions found for the repo(s) in the window\n  profile    per-turn metrics + findings + fixes for the selected sessions; writes\n             docs/profiles/<sp-id>/{profile.json,profile.md} in the FIRST --repo (or --out-root)\n  compare    aggregate the same metrics by model family x harness (the tuning view)\n  fixes      print the fix catalog (finding id -> pack surface -> control)\n\nPython 3.8+, stdlib only. Windows-safe (utf-8 stdout, read-only SQLite URI).\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `compare` | aggregate by model family x harness |\n| `compile` | the compile-stage measurements from docs/audit/audit-log.jsonl (no harness store needed) |\n| `discover` | list matching sessions |\n| `fixes` | print the fix and finding catalogs |\n| `profile` | profile sessions and write docs/profiles/<sp-id>/ |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--chars-per-token` | _(no help text — coverage gap)_ |\n| `--claude-home` | override ~/.claude |\n| `--copilot-home` | override ~/.copilot |\n| `--days` | window in days (0 = all) |\n| `--harness` | _(no help text — coverage gap)_ |\n| `--json-only` | print JSON, write nothing |\n| `--limit` | newest N sessions |\n| `--out-root` | repo root that receives docs/profiles/ (default: first --repo) |\n| `--print-markdown` | _(no help text — coverage gap)_ |\n| `--repo` | repo path (repeatable); the first one receives docs/profiles/ |\n| `--session-id` | audit session id to record |\n| `--session` | restrict to session id(s) or prefixes |\n\n## Functions\n\n### `est_usd(model, uncached_in, cache_read, cache_write, output)`\n\nUSD at list rates for one usage row, or None when the model has no rate row.\n\n### `est_usd_rows(rows)`\n\n(usd, unpriced_requests) over usage rows that carry model/in/cr/cw/out.\n\n### `gate_behind_pipe(cmd)`\n\nTrue when a gate INVOCATION is piped straight into a formatter with no pipefail on the\nline. The invocation is the last command of the segment before the pipe (after any\n`&&`, `;` or `(`).\n\n### `shell_shape_counts(commands, results_by_id)`\n\nSP-24 / SP-25 over [(tool_use_id, command)] and {tool_use_id: result_text}. Returns\n(piped_gate_lines, also_commit, failed_heredocs, evidence_lines).\n\n### `late_addition_findings(turns)`\n\n`/also` turns that acquired no bound (F-15, class CTX-N).\n\n`/also` guards DIRECTION - \"an extension is absorbed; a reversal is raised\" - and had no\nguard on SIZE. Measured in sp-0004: both `/also` turns were the only substantive turns on\nthat model carrying neither a goal state nor a tier, and one became 81 main requests, 6\nsub-agents, 83 minutes and 13,411 AIU - the most expensive turn in the session.\n\nDeliberately narrower than SP-09, which already owns the generic missing-goal-state case.\nThis one is about the *late addition* specifically, because the mechanism is different: an\naddition to an unbounded turn INHERITS unboundedness rather than acquiring a bound, and\nthe skill's own flow assumed a goal state was there to re-read.\n\n### `mechanical_cost_findings(turns, min_aiu=…)`\n\nClosing work billed as though it needed novelty (F-17).\n\nMeasured: `/updatepack` ran twice in one session - 1,179 AIU on claude-opus-4.8 and\n8,890 on gpt-6-astra. Same skill, same repo, 7.5x. \"yes commit and push/merge all\" cost\n5,173 AIU across 21 requests. None of that is novel work; all of it is a script with a\nreviewer, and GO19's per-phase tier does not reach it because the phase boundary is\ninside the turn.\n\nThe finding is the PRICE, not the mechanics - closing work is legitimate and has to\nhappen. A cheap mechanical turn is exactly right and is not reported. A turn with no\nrecorded cost is not guessed at (IO8).\n\n### `effective_model(models)`\n\nThe model a session actually WAS, by cost. `models` is {model: {requests, cost}}.\n\nBy cost rather than request count on purpose: in the measured session `gpt-6-astra` and\nthe delegate models had comparable request counts and wildly different prices, and it is\nthe expensive one that determines what the session cost and how it behaved.\n\nReturns None for a corpus it cannot read - an unknown model is not a guess (IO8).\n\n### `model_attribution(settings, models)`\n\nReconcile the RECORDED model against the EFFECTIVE one (class CTX-O).\n\nThe setting is a true statement about what was configured and is simply not a statement\nabout what executed: measured, one session recorded `claude-opus-4.8` while `gpt-6-astra`\nran 1,022 requests for 95% of the spend, across eleven model/effort combinations. Both\nvalues are plausible, which is why the error is invisible.\n\nNote what counts as a mismatch: the recorded model having RUN is not enough. In that\nsession it ran - on 5% of the requests. Presence is not attribution.\n\nAn absent setting is not a mismatch. Claude Code records no model setting, and absent\nmust not read as wrong.\n\n### `main_line_share(buckets)`\n\nSplit a session's requests and cost between the main line and its delegates.\n\n`buckets` is {initiator: {\"requests\": n, \"cost\": aiu}}. The main line is `agent`, `user`\nand `compaction` - a compaction request and the request that opens a user turn are both\npaid on the main conversation, and both were substantial: in sp-0003 the 24 bare\nuser-initiated requests alone cost 12,853 AIU, MORE THAN THE ENTIRE DELEGATE FLEET.\n\nThis is the measured half of CT19's `Main-line budget:`, which is only a declaration - an\nagent cannot count its own model requests, and this can. Reconciled, never conflated.\n\nReturns None for a share or a ratio it cannot establish: a percentage over an empty\ncorpus is not a measurement (R4), and no delegates means there is no ratio to report\nrather than a ratio of infinity.\n\n### `parse_ts(s)`\n\n**Coverage gap** — no docstring in the source.\n\n### `iso(d)`\n\n**Coverage gap** — no docstring in the source.\n\n### `pct(values, q)`\n\n**Coverage gap** — no docstring in the source.\n\n### `est_tokens(chars)`\n\n**Coverage gap** — no docstring in the source.\n\n### `model_family(model)`\n\n**Coverage gap** — no docstring in the source.\n\n### `norm_path(p)`\n\n**Coverage gap** — no docstring in the source.\n\n### `git(args, cwd)`\n\n**Coverage gap** — no docstring in the source.\n\n### `repo_identity(path)`\n\nEverything a session could have recorded to say 'I ran in this repo'.\n\n### `repo_label(path)`\n\nA canonical, worktree-independent name for a repo (class PACK-P: a generated artifact\nmust never stamp the worktree folder name).\n\nDelegates to `repo_identity.canonical_project` -- this was the third correct copy of one\nresolution ladder, and copies only diverge later (DM7/ONE-A).\n\n### `claude_slug(path)`\n\nClaude Code names a project directory by replacing every non-alphanumeric character in\nthe absolute path with '-'. Observed: C:\\projects\\ai-forward -> C--projects-ai-forward.\n\n### `in_repo(identity, cwd, repository=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `copilot_home()`\n\n**Coverage gap** — no docstring in the source.\n\n### `copilot_settings(home)`\n\n**Coverage gap** — no docstring in the source.\n\n### `copilot_sessions(identity, since, home)`\n\n**Coverage gap** — no docstring in the source.\n\n### `profile_copilot(sess, settings)`\n\nOne Copilot session -> normalized turns + session-level facts.\n\n### `claude_home()`\n\n**Coverage gap** — no docstring in the source.\n\n### `claude_sessions(identity, since, home)`\n\n**Coverage gap** — no docstring in the source.\n\n### `read_subagents(session_dir)`\n\nEvery `subagents/agent-*.jsonl` (+ `.meta.json`) under the session's directory, one\nnode row each. This is where 86% of a measure   "title": "API — ui-craft-gate.py",
  "markdown": "\n# `ui-craft-gate.py`\n\n*Generated from `pack/scripts/ui-craft-gate.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nui-craft-gate.py - the UI craft gate for AI-Forward.\n\nRuns the Impeccable deterministic detector (`impeccable detect --json`) over a UI\nsurface and translates its findings into the pack's own review shape, per\n`ui-craft-detection.md` CD11: every finding gains a **dimension** (one of the\nDX22 rubric dimensions), a pack **severity** (Nit/Minor/Major/Blocker) with the\nCD12 accessibility and token-discipline floors applied, and the owning pack\ndirective. Stdlib only; lives in the script bundle (deployed to\ndocs/ai-forward-pack/scripts/).\n\nWhy this exists: the detector is the rung-2 automated control under the pack's UI\ncraft doctrine (`continuous-improvement.md` CI6), but its raw output is not a\nreview finding. This performs the translation once, in a script, rather than by\nhand in every session - and it applies the severity floors that U16 (accessibility\nhard veto) and U3/U20 (token discipline) require and a linter's own defaults do not.\n\nModes\n  (default)   report  - print the measurement + the rubric table; exit 0\n  --gate      gate    - exit 1 if any Blocker-mapped finding is present\n  --a11y-obligation   accessibility findings become Blockers (CD12)\n  --markdown          emit a paste-ready markdown section for docs/reviews/ui-<surface>.md\n  --json              emit the translated findings as JSON\n\nExit codes: 0 clean/report, 1 blockers present (with --gate), 2 detector unavailable\nor it scanned nothing (CD9 - an empty corpus is a success-shaped failure).\n\nUsage:\n  ui-craft-gate.py <file-or-dir-or-url> [...] [--gate] [--a11y-obligation]\n                   [--markdown] [--json] [--impeccable <cmd>]\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--a11y-obligation` | the product is under an accessibility obligation; accessibility findings become Blockers (CD12) |\n| `--gate` | exit 1 if any Blocker-mapped finding is present |\n| `--impeccable` | explicit detector command (default: auto-resolve) |\n| `--json` | emit the translated findings as JSON |\n| `--markdown` | emit a paste-ready markdown review section |\n\n## Functions\n\n### `resolve_detector(explicit=…)`\n\nReturn an argv prefix that runs the detector, or None.\n\nOrder: explicit --impeccable > `impeccable` on PATH > local node_modules >\n`npx impeccable`. Establishing the tool rather than assuming it is NG1.\n\n### `run_detector(prefix, targets)`\n\nRun `detect --json` and return the parsed finding list.\n\nThe detector exits non-zero when it finds anti-patterns, which is a *result*,\nnot a failure - so the exit code is deliberately not treated as an error\n(`end-to-end-integrity.md` E14: read the state, do not read the exit code).\n\n### `translate(findings, a11y_obligation)`\n\nCD11 - give each finding the pack's shape; CD12 - apply the severity floors.\n\n### `measurement(rows)`\n\nDX23 - measure before you diagnose. Counts are the diagnosis.\n\n### `render_markdown(rows, targets)`\n\n**Coverage gap** — no docstring in the source.\n\n### `render_text(rows, targets)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **6** · documented: **4** (**67%**)\n- Undocumented (recorded, not invented): `render_markdown`, `render_text`\n\n"

  "markdown": "\n# `verify-compiled-prompt.py`\n\n*Generated from `pack/scripts/verify-compiled-prompt.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nverify-compiled-prompt.py - the compile-stage gate: a compiled prompt never adds scope.\n\nTHE CLASS (spec US-4, design docs/design/compile-stage.md). A model step turns the operator's\nprose into a goal state. The measured failure is that it ADDS scope: a *Done when* clause the\noperator never asked for, a phrase \"quoted\" from the prompt that is not in it, or a belief\nlaundered into a clause through an assumption nobody was asked about. This gate refuses each of\nthose shapes deterministically, against the raw text the audit log holds, before anything is\nlogged or rendered.\n\nWHAT IT CHECKS, IN ORDER (each refusal `<code>: <target> - fix: <text>` on stderr, exit 1)\n  field missing: <name>          the seven goal_state fields are non-empty (\"NOT COMPILED\" counts)\n  raw mismatch: <raw_id>         sha256(raw text) != raw_sha256\n  assumption incomplete: #<n>    belief / confirm / breaks all non-empty\n  added scope: <clause>          a done_when / not_in_scope clause with no trace\n  invalid trace: <clause>        a phrase trace that is not a verbatim substring of the raw text\n                                 (whitespace runs collapsed, line endings normalised, CASE-SENSITIVE),\n                                 or an assume trace naming an id that is not in assumptions\n  decision request missing: #<n> a clause whose only trace is an assumption needs that assumption\n                                 consequential: true AND a decision request referencing it\n  pass-through refused: <x>      pass-through mode: the same minus the trace checks\n  raw not found: <raw_id>        (CLI) the raw id is not a kind:prompt entry in the audit log\nIn \"not-compiled\" mode the trace checks are skipped; field and hash checks still run.\n\nUSAGE\n  python3 verify-compiled-prompt.py verify <compiled.json> [--audit-root <docs dir>]\n  python3 verify-compiled-prompt.py --self-test      the nine directions in a temp dir\n  python3 verify-compiled-prompt.py                  the same (run-verify-gates.py's argument-free form)\n\nEXIT  0 pass  ·  1 refused  ·  2 usage.  Stdlib only.\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `verify` | gate one compiled prompt JSON |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--audit-root` | the docs dir holding audit/audit-log.jsonl (default <repo>/docs) |\n| `--self-test` | _(no help text — coverage gap)_ |\n\n## Functions\n\n### `refusal(code, target, fix)`\n\nThe one refusal grammar: `<code>: <target> — fix: <text>` on a single line.\n\n### `collapse(text)`\n\nLine endings normalised, every whitespace run one space; case untouched.\n\n### `sha256_text(text)`\n\n**Coverage gap** — no docstring in the source.\n\n### `load_raw(audit_root, raw_id)`\n\nThe kind:prompt entry with this id from <audit_root>/audit/audit-log.jsonl, else None.\n\n### `verify_document(doc, raw_text)`\n\nEvery refusal for this compiled document against the raw text, in the fixed order.\n\n### `trace_table(doc)`\n\n**Coverage gap** — no docstring in the source.\n\n### `verify_file(path, audit_root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `self_test_refusals()`\n\nEvery refusal the nine directions produce (for the grammar assertion).\n\n### `self_test()`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **9** · documented: **5** (**56%**)\n- Undocumented (recorded, not invented): `sha256_text`, `trace_table`, `verify_file`, `self_test`\n\n"

  "markdown": "\n# `verify-documented-commands.py`\n\n*Generated from `pack/scripts/verify-documented-commands.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nverify-documented-commands.py - every documented command under pack/ runs in any shell.\n\nTHE CLASS (PLAT-A, the shell half; cross-platform readiness P4, XS-01..25, 2026-09-19).\nThe pack targets bash, zsh, PowerShell 5.1/7 and cmd, and an agent types a documented\ncommand as written. Three shapes were written once for bash and left in their siblings:\n\n  1. A trailing ` \\` continuation - bash/zsh only. cmd runs the next line as a SEPARATE\n     command; PowerShell continues with a backtick. 10 multi-line commands (16 lines)\n     carried it at a01ed77, among them the AL5 audit step, the WT1 worktree step and the\n     only join line.\n  2. ` && ` between two commands - not a statement separator in Windows PowerShell 5.1\n     (it parses as a token error, so `git add -A && git commit ... && git push` runs\n     nothing). 2 fenced and 4 inline documented commands carried it.\n  3. A line-initial bare `python` - stock macOS and Linux ship `python3` only; the pack's\n     own convention is `python3` (the Windows substitution is `pack-doctor`'s job to name).\n     7 fenced skill/INSTALL commands and 6 inline ones carried it; INSTALL's labelled\n     Windows twin is the one allowlisted line.\n\nSCAN CONTRACT (GO14a - root, recursion, token set, allowlist).\n  root       <repo>/pack (absent in a consuming repo: nothing to scan, exit 0 and say so)\n  recursion  commands/**/*.md, knowledge/*.md, adapters/INSTALL.md, templates/*.md\n  blocks     fenced code blocks (``` or ~~~) whose info string is empty or one of\n             bash, sh, shell, zsh. A block whose FIRST line starts with `#!` is a file\n             (DC-207: a multi-line program is a file, then a run), not a typed command,\n             and is skipped whole. Blank lines and `#` comment lines are skipped.\n  tokens     continuation  - the line ends in whitespace + `\\`\n             and-chain     - the line contains ` && `\n             bare-python   - the first token is `python` (optionally after a `$ ` prompt)\n  allowlist  the inline marker `portable-ok: <reason>` anywhere on the line, like\n             `machine-path-ok` in verify-no-machine-paths.py. A marker with no reason is\n             a finding of its own (`marker-without-reason`).\n\nUSAGE\n  python3 verify-documented-commands.py               scan this repository\n  python3 verify-documented-commands.py --root <repo>  scan that repository\n  python3 verify-documented-commands.py --self-test    prove the gate can fail (DC-104)\n\nEXIT  0 clean  ·  1 findings  ·  2 usage\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--root` | repository root (default: this repo) |\n| `--self-test` | prove the gate can fail |\n\n## Types\n\n### `Finding`\n\n_(no docstring — coverage gap)_\n\n## Functions\n\n### `documented_files(pack)`\n\nThe files the contract names, in a stable order.\n\n### `command_lines(text)`\n\nYield (lineno, line) for every command line inside a command fence.\n\nA fence opens on ``` or ~~~ with a command info string and closes on the same\nmarker; a block whose first line is a shebang is a file and is skipped whole.\n\n### `tokens_in(line)`\n\nThe portability tokens one command line carries (empty when allowlisted).\n\n### `scan(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `report(findings, root, pack_present)`\n\n**Coverage gap** — no docstring in the source.\n\n### `self_test()`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **6** · documented: **3** (**50%**)\n- Undocumented (recorded, not invented): `scan`, `report`, `self_test`\n\n"

  "title": "API — verify-no-conflict-markers.py",
  "markdown": "\n# `verify-no-conflict-markers.py`\n\n*Generated from `pack/scripts/verify-no-conflict-markers.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nverify-no-conflict-markers.py - a conflict marker must never reach a commit.\n\nThe control for defect class DC-136 (a merge resolved as \"regenerate, then stage\neverything\" leaves markers in a file that is patched in place, not regenerated), measured\nin a consuming repo: two PUBLISHED pages carried `<<<<<<< HEAD` / `=======` / `>>>>>>>`\non main. Every existing gate passed - a figure check verified four copies of a right\nanswer, and a derived-views check did not own the file because it was only PARTIALLY\nderived. A content check cannot see structural damage by construction. Then a join\nresolved a register conflict, piped this gate's output through `| tail -1`, read the\nremedy text as a pass, and sealed a merge carrying markers (DC-113's fourth recurrence).\n\nThat is why this gate is FIRST in a join's step list and runs on its own line: a marker is\nsyntactically legal in almost every text format we commit, survives a skimmed diff of a\nlarge generated file, and is unambiguous evidence that a file which should have been\nregenerated was resolved by hand instead. There is no legitimate reason for one in a\ntracked file, which makes this the rare check with no judgement in it.\n\nWhat is checked. Every tracked text file, for `<<<<<<<`, `>>>>>>>` and `|||||||` at the\nstart of a line. `=======` alone is deliberately NOT flagged: it is a Markdown setext\nheading underline and a reStructuredText rule, and a gate that fires on valid prose is a\ngate someone switches off.\n\nUsage\n  python3 verify-no-conflict-markers.py               scan every tracked file\n  python3 verify-no-conflict-markers.py --root <repo>  scan that repository\n  python3 verify-no-conflict-markers.py --self-test    prove all three directions\n\nExit 0 when clean, 1 on any finding (or when nothing could be read - a verdict over an\nempty corpus is not a verdict, PACK-P). Stdlib only.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--root` | repository to scan (default: git's answer from the cwd) |\n| `--self-test` | prove the gate fires, does not fire on valid Markdown, and refuses an empty corpus |\n\n## Functions\n\n### `repo_root(start=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `tracked_files(root)`\n\nReturns (files, error). A failed `git ls-files` yields an EMPTY list, and an empty\ncorpus read as \"no markers found\" is a fail-open gate (PACK-P): the return code is\nread and handed back, so the caller reports NOT-CHECKED instead of OK.\n\n### `scan(root, files)`\n\nReturns (findings, files actually read). This file describes the markers it hunts,\nso it necessarily contains them in prose and is skipped by identity, not by name.\n\n### `self_test()`\n\nAll three directions: it fires; it does NOT fire on valid prose; an empty corpus is\nrefused rather than reported clean.\n\n## Coverage\n\n- Public functions: **4** · documented: **3** (**75%**)\n- Undocumented (recorded, not invented): `repo_root`\n\n"

  "markdown": "\n# `verify-no-machine-paths.py`\n\n*Generated from `pack/scripts/verify-no-machine-paths.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nverify-no-machine-paths.py - a tracked, machine-readable file never carries one machine's paths.\n\nWHY THIS EXISTS (PLAT-B, docs/lessons/defect-classes.md). `coord classify init` wrote\n`sys.executable` - `C:\\Users\\<user>\\...\\python.exe` - into the TRACKED registry\n`.agents/artifacts.yml`. The file was correct on the machine that wrote it and the tool\nreported success; `coord regen` then failed on macOS days later with \"command not found\",\nwhile `pack-doctor` passed because it checked that the registry parsed, never that its\ncommands resolve here. A home directory, a drive letter or an interpreter path inside a file\ngit carries is state about ONE machine masquerading as configuration for all of them.\n\nWHAT IT SCANS. Tracked files (`git ls-files`) under the machine-readable surfaces: pack/,\ntools/, tests/, web/, .claude/, .github/, .grok/, .agents/ and the repo-root dotfiles and\nmanifests. Prose under docs/ is out of scope on purpose - investigations and defect classes\ncite offending paths as evidence, and a lint that forbids naming the defect is a lint that\nforbids fixing it.\n\nWHAT IT REFUSES. Any line matching a machine-path shape (each line below carries the\nopt-out marker because it names the shapes; the marker is `machine-path-ok`):\n  <drive>:\\Users\\   <drive>:/Users/   /Users/<name>   /home/<name>   /opt/homebrew/   machine-path-ok\n  \\.pyenv/           AppData\\Local     AppData/Local                                machine-path-ok\nA line may opt out with the marker `machine-path-ok` when the path is a fixture and the\ntest says why (the exemption is visible in the diff; the pattern is not silently widened).\n\nUSAGE\n  python3 verify-no-machine-paths.py               scan the tracked surfaces of this repo\n  python3 verify-no-machine-paths.py --root <repo>  scan that repository\n  python3 verify-no-machine-paths.py --self-test    prove the gate can fail (DC-104)\n\nEXIT  0 clean  ·  1 a machine path was found  ·  2 usage / git unavailable\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--root` | _(no help text — coverage gap)_ |\n| `--self-test` | _(no help text — coverage gap)_ |\n\n## Functions\n\n### `tracked_files(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `in_scope(rel)`\n\n**Coverage gap** — no docstring in the source.\n\n### `scan(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `self_test()`\n\nThe gate must be able to fail: a fixture with a Windows home path is refused, a clean\nfixture is accepted, and an opted-out line is skipped. Exit 0 only if all three hold.\n\n## Coverage\n\n- Public functions: **4** · documented: **1** (**25%**)\n- Undocumented (recorded, not invented): `tracked_files`, `in_scope`, `scan`\n\n"

 {
  "id": "api-verify-no-new-console-launches",
  "title": "API — verify-no-new-console-launches.py",
  "markdown": "\n# `verify-no-new-console-launches.py`\n\n*Generated from `pack/scripts/verify-no-new-console-launches.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nverify-no-new-console-launches.py - no code launches a child with CREATE_NEW_CONSOLE.\n\nThe control for defect class DC-170, measured in a consuming repo (2026-09-12): on a\nmachine whose default terminal application is Windows Terminal, a child started with\n`CREATE_NEW_CONSOLE` is handed to Windows Terminal as a TAB, and Windows Terminal's agent\nhost attaches an agent session (an assistant child and its MCP servers, one node.exe each)\nto that tab and keeps it for Windows Terminal's lifetime after the tab closes. Nine test\nclasses launched a helper that way: two tests, two node.exe born; 25 during one whole-suite\nrun; 257 accumulated over two days. The launcher now uses `CREATE_NO_WINDOW` (a headless\nconsole, never a tab): the same tests, zero born. The mechanism is the platform's, not the\nproject's, so the gate ships with the pack.\n\nWhat it reads. Every source file under the scan roots (default `src/` and `tests/`,\nexcluding `bin/` and `obj/`), in the languages where the flag is spelled by name (C#, C,\nC++, Rust, Go, Python, PowerShell, JavaScript/TypeScript); the token `CREATE_NEW_CONSOLE`\non a line that is CODE - one whose first non-blank characters are not a comment leader\n(`//`, `///`, `#`, `*`, `--`), because a doc comment may name the flag while explaining why\nit is not used. Allowlist: none. A `const` declaration counts: it exists to be used.\n\nUsage\n  python3 verify-no-new-console-launches.py                 scan src/ and tests/\n  python3 verify-no-new-console-launches.py --root-dir app   scan these roots (repeatable)\n  python3 verify-no-new-console-launches.py --self-test      prove the gate can fail (DC-104)\n\nExit 0 when clean, 1 on a finding, 2 on a usage error. Stdlib only.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--root-dir` | a directory to scan, relative to the root (repeatable; default: src, tests) |\n| `--root` | repository root (default: git's answer from the cwd) |\n| `--self-test` | _(no help text — coverage gap)_ |\n\n## Functions\n\n### `repo_root(start=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `findings(root, roots=…)`\n\n(findings, files read). Reads code lines only; a comment naming the flag is prose.\n\n### `self_test()`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **3** · documented: **1** (**33%**)\n- Undocumented (recorded, not invented): `repo_root`, `self_test`\n\n"

  "markdown": "\n# `verify-portable-text-io.py`\n\n*Generated from `pack/scripts/verify-portable-text-io.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nverify-portable-text-io.py - text the pack writes is LF and UTF-8 on every OS, and every CLI survives a legacy console.\n\nTHE CLASS (PLAT-A, the newline and console halves; cross-platform readiness P2/P3, 2026-09-19).\nThree shapes, each fixed once somewhere in the pack and left in its siblings:\n\n  1. A text-mode WRITE without `newline=\"\\n\"` emits CRLF on Windows. `audit-log.py` writes its\n     JSONL with `newline=\"\\n\"`; 26 sibling writers used the platform default, so a ledger line\n     appended on Windows and its LF twin from macOS are two distinct strings that a union merge\n     conserves both of.\n  2. A script with a `__main__` entry that prints has no stdio guard: `--help` raises\n     UnicodeEncodeError on a cp1252 console the moment a help string carries an em-dash.\n     `pack-doctor.py` carries the guard (reconfigure stdout/stderr to utf-8, errors=replace);\n     nine siblings did not.\n  3. `tempfile.mkstemp(..., text=True)` opens the descriptor with `_O_TEXT` on Windows - a flag\n     that says CRLF while the wrapper says LF. Measured harmless on windows-latest, kept out of\n     the source so the file says one thing.\n\nWHAT IT CHECKS. Every `.py` under pack/scripts, pack/adapters/hooks and tools (sources only).\nWith the `ast` module: (1) `open(..., mode)` where the mode contains w, a or + and no `newline`\nkeyword, and `Path.write_text(...)` with no `newline` keyword, in TEXT mode (a `b` in the mode\nexempts the call); (2) a module containing `if __name__ == \"__main__\"` and a `print(` must\ncontain `.reconfigure(` on a stream (the guard) - modules that never print are exempt;\n(3) `mkstemp(... text=True)`.\n\nUSAGE\n  python3 verify-portable-text-io.py               scan this repository\n  python3 verify-portable-text-io.py --root <repo>  scan that repository\n  python3 verify-portable-text-io.py --self-test    prove the gate can fail (DC-104)\n\nEXIT  0 clean  ·  1 findings  ·  2 usage\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--root` | _(no help text — coverage gap)_ |\n| `--self-test` | _(no help text — coverage gap)_ |\n\n## Functions\n\n### `scan_source(source)`\n\n**Coverage gap** — no docstring in the source.\n\n### `scan(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `self_test()`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **3** · documented: **0** (**0%**)\n- Undocumented (recorded, not invented): `scan_source`, `scan`, `self_test`\n\n"

  "title": "API — verify-ruling-citations.py",
  "markdown": "\n# `verify-ruling-citations.py`\n\n*Generated from `pack/scripts/verify-ruling-citations.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nverify-ruling-citations.py - every ruling cited as authority resolves to exactly one heading that says what it decided.\n\nTHE CLASS (absorbed from ai-de's tools/verify-ruling-citations.py, measured 2026-09-11; class ID-A).\nProgramme decisions were cited by number across that repository and enforced as binding. Eight of\nthem defined nothing: numbers cited with no note anywhere recording what they said, one of them\ncited six times as governing a dependency decision. Two ends of that met on the same day: a number\nwas cited by a mockup, a review and a mid-task correction BEFORE any ruling of that number had been\nmade, and the Owner, unable to see it because nothing recorded it, allocated the same number again\nfor a different decision. THE ABSENCE OF THE REGISTER IS WHAT CAUSED THE COLLISION IN THE REGISTER.\nA decision that cannot be read is not a decision; it is a number with a reputation.\n\nWHAT COUNTS. A DEFINITION is a heading `### Ruling NN — …` (or `## Ruling NN — …`) in\ndocs/notes/rulings.md - the only definition site; `coord decide rule` writes it. A CITATION is\n`Ruling NN` (or `Rulings NN`) in PROSE - `.md`, `.html`, `.txt` - anywhere under docs/, pack/,\n.agents/log/, .github/, .claude/. A mention inside prose is a citation, never a definition: that\ndistinction is the whole point, and collapsing it would make the gate agree with any file that talks\nabout a ruling often enough. Records (`.json`, `.jsonl`) are not scanned: the audit log and the\ndreams quote other repositories' prose verbatim, and a quote is not a citation (decision note\nnote-20260919-owner-review-register-and-scan-scope). docs/ai-forward-pack/ is skipped as the\ngenerated copy of pack/.\n\nTHE TWO DEFECTS. (1) A number cited with no heading. (2) A number defined by two headings. There is\nno frozen list: nothing predates this control, so the list that \"may only shrink\" starts empty and\ntherefore does not exist.\n\nUSAGE\n  python3 verify-ruling-citations.py                 scan the repository at the cwd\n  python3 verify-ruling-citations.py --root <repo>   scan that repository\n  python3 verify-ruling-citations.py --self-test     prove both defects fire and a clean tree is quiet (DC-104)\n\nEXIT  0 ok  ·  1 refused (defects listed, one per line)  ·  2 usage (--root is not a directory)\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--root` | the repository to scan (default: cwd) |\n| `--self-test` | prove this gate can fail, against a synthetic tree |\n\n## Functions\n\n### `definitions(root)`\n\nnumber -> the register line numbers that define it (two lines = the collision).\n\n### `citations(root)`\n\nnumber -> the prose files (repo-relative, posix) that cite it. The register is scanned\ntoo: prose in it that names a number is a citation (a heading is the only definition).\n\n### `check(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `self_test()`\n\nBreak a synthetic tree in each direction and require the gate to notice (DC-104): a\ncontrol's first green is evidence about the control, and the control is the part nobody\nre-examines because it is what they just reasoned about.\n\n## Coverage\n\n- Public functions: **4** · documented: **3** (**75%**)\n- Undocumented (recorded, not invented): `check`\n\n"

  "markdown": "\n# `verify-skill-contracts.py`\n\n*Generated from `pack/scripts/verify-skill-contracts.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nverify-skill-contracts.py - every skill declares its seat and cites the shared stage its shape needs.\n\nTHE CLASS (coordination proposal §7b.5, D15; spec-compile-readers US-4..US-8). The pack has a\ndoctrine of delegation - three shared stages in knowledge/agent-coordination.md (CO-S0 compile,\nCO-S1 seat, CO-S2 stop = message) - and, measured on 2026-09-19, 25 of 28 skills declared no\nseat, 11 of 14 prose-input skills did not cite CO-S0, and none of the four hard stops cited\nCO-S2. Doctrine no skill cites is prose, and prose is a memoir (CI6). This lint is the control.\n\nWHAT IT CHECKS. Every `<skills-root>/<name>/SKILL.md` (plus that skill's `reference/*.md`):\n  1. seat            frontmatter carries `runs_as: Coordinator|Sub-Agent|either` (CO-S1)\n  2. fan-out         a skill naming a fan-out cap above zero (`fan-out cap 2`, `: 3`, `of 4`,\n                     `<= 4`) cites CO-S0 and the five-part contract with a termination condition\n  3. hard stop       a hard-stop stage (`**STOP`, `stop for human`, `never merges`) cites CO-S2\n  4. dispatch order  a dispatcher (a Dispatch heading or stage label, `coord dispatch`, or a\n                     sentence-initial `spawn`) cites CO-S0 in SKILL.md before that instruction\n  5. compile         every skill cites CO-S0 in SKILL.md - inline, or the one-line pointer to\n                     `reference/co-s0.md` (spec-skill-evolution US-1; measured 10 of 28 without)\n  6. pointer         a SKILL.md that names `reference/co-s0.md` has a reference text carrying CO-S0\n  7. deadline        a dispatcher, or a skill naming a fan-out cap above zero, names a deadline\n                     and a fallback for the dispatch (CO8, CO9; measured: execute-with-coordination\n                     said \"fallback\" once and \"deadline\" nowhere)\n\nRefusals, one per line on stdout, in the pack's grammar:  <code>: <skill> — fix: <text>\nCodes are stable (O7): seat missing · seat invalid · fan-out without compile · fan-out without\ncontract · hard stop without message · dispatch before compile · compile missing · pointer without\nreference · dispatch without deadline · skills root missing.\n\nUSAGE\n  python3 verify-skill-contracts.py                 check pack/commands (or .claude/skills)\n  python3 verify-skill-contracts.py --root <repo>   check that repository's skills\n  python3 verify-skill-contracts.py --self-test     prove every direction can fail (DC-104)\n\nEXIT  0 clean  ·  1 refusals  ·  2 usage (no skills root)\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--root` | repository root (default: found by walking up from this script or the cwd) |\n| `--self-test` | prove the gate can fail |\n\n## Functions\n\n### `check_skill(name, skill_md, reference_texts)`\n\nReturns the refusal lines for one skill. Pure over the texts (the self-test and the tests\ncall it through the CLI; the CLI is the only place that touches the filesystem).\n\n### `find_skills_root(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `default_root()`\n\n**Coverage gap** — no docstring in the source.\n\n### `scan(skills_root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `self_test()`\n\nEvery direction must FAIL on its fixture and the good skill must pass (DC-104).\n\n## Coverage\n\n- Public functions: **5** · documented: **2** (**40%**)\n- Undocumented (recorded, not invented): `find_skills_root`, `default_root`, `scan`\n\n"

ne, head) per undecoded text-mode call.\n\n### `scan(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `self_test()`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **3** · documented: **1** (**33%**)\n- Undocumented (recorded, not invented): `scan`, `self_test`\n\n"

  "markdown": "\n# `visual-assets-setup.py`\n\n*Generated from `pack/scripts/visual-assets-setup.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nvisual-assets-setup.py - wire up a generation backend for UI visual assets (AI-Forward).\n\n`ui-visual-assets.md` (VA1-VA18) governs *whether and how* imagery, personas and motion\nmay be generated for a UI. This script is the *mechanism*: it reports which generation\nbackends a repo can actually reach, scaffolds the asset directory and manifest, and keeps\nthe credential and hygiene rules that VA9/VA11 depend on. Stdlib only; lives in the script\nbundle (deployed to docs/ai-forward-pack/scripts/).\n\nIt deliberately does NOT generate anything and NEVER writes a credential. Generation runs\nthrough the `/visualize` skill against whichever backend is configured; secrets live in the\nenvironment or the agent host's own MCP configuration, never in the repository.\n\nModes\n  --check      what is configured, what is missing, and exactly how to fix it\n  --init       scaffold docs/assets/, the DESIGN.md assets manifest, and .gitignore hygiene\n  --init-mcp   write a GIT-IGNORED project-level .mcp.json for an MCP backend, plus a\n               committed .mcp.json.example. Credentials come from the environment, or are\n               reused from an agent-host config that already has them. Never committed.\n  --backends   print the backend capability matrix and exit\n  --dry-run    with --init/--init-mcp: print what would change, write nothing\n  --json       machine-readable output for --check\n\nExit codes: 0 fine, 1 nothing usable is configured (with --check), 2 a hygiene problem was\nfound that needs a human (a credential appears to be committed).\n\nUsage:\n  visual-assets-setup.py --check [--json]\n  visual-assets-setup.py --init [--dry-run]\n  visual-assets-setup.py --backends\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--backends` | print the capability matrix |\n| `--check` | report what is configured |\n| `--dry-run` | with --init/--init-mcp, write nothing |\n| `--init-mcp` | write a git-ignored project .mcp.json (+ committed .example) for an MCP backend (default: higgsfield) |\n| `--init` | scaffold assets dir, manifest and hygiene |\n| `--json` | machine-readable --check |\n| `--root` | repository root (default: .) |\n\n## Functions\n\n### `repo_paths(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `find_design_md(root)`\n\nVA12's manifest lives in the design language. Resolve it the way the craft\ndetector does (repo root, then docs/) so both tools agree on one file (CD4).\n\n### `backend_status(name, spec)`\n\n**Coverage gap** — no docstring in the source.\n\n### `scan_for_committed_secrets(root)`\n\nA generation credential in the tree is a hygiene failure, not a style issue.\nDeliberately shallow and cheap: a first-pass tripwire, not a scanner (see the\nResponsible-AI policy - real enforcement belongs in CI secret scanning).\n\n### `resolve_mcp_entry(spec)`\n\nFind the installed server entry point. Established by looking, not assumed:\nthe global npm root differs per platform and per install method.\n\n### `read_user_mcp_credentials(spec)`\n\nReuse credentials already configured in the agent host, so `--init-mcp` works for\nsomeone who set the server up interactively and never exported the variables.\nReturns (creds, source) and NEVER logs a value.\n\n### `cmd_init_mcp(root, backend, dry_run)`\n\nWrite a GIT-IGNORED project-level .mcp.json plus a committed .example.\n\nCopilot CLI reads project config from `.mcp.json` (cwd up to the repo root) and\n`.github/mcp.json`, and project definitions take precedence over the user config.\nVerified from the official docs. What is NOT established is `${VAR}` expansion inside\nthe `env` block - the docs say environment variables \"must be configured here\" and the\nchangelog only documents auto-inclusion for vars referenced in command/args/cwd. So a\ncommitted config cannot carry the credentials, and this writes a git-ignored one\ninstead of relying on expansion that was never verified (NG1/NG6).\n\n### `cmd_backends()`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_check(root, as_json)`\n\n**Coverage gap** — no docstring in the source.\n\n### `ensure_gitignore(root, dry_run)`\n\n**Coverage gap** — no docstring in the source.\n\n### `ensure_manifest(root, dry_run)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_init(root, dry_run)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **12** · documented: **5** (**42%**)\n- Undocumented (recorded, not invented): `repo_paths`, `backend_status`, `cmd_backends`, `cmd_check`, `ensure_gitignore`, `ensure_manifest`, `cmd_init`\n\n"

<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
const markedUrl = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";

function loadMarked(){
  return new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src=markedUrl; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}
const isDark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad:false, theme: isDark ? "dark" : "default", securityLevel:"loose" });

const docs = window.DOCS || [];
const byId = Object.fromEntries(docs.map(d=>[d.id,d]));

function buildNav(){
  const nav = document.getElementById("nav");
  const groups = {};
  docs.forEach(d=>{ (groups[d.group||"Pages"] ||= []).push(d); });
  for(const g of Object.keys(groups)){
    const h=document.createElement("div"); h.className="group"; h.textContent=g; nav.appendChild(h);
    groups[g].forEach(d=>{ const a=document.createElement("a"); a.textContent=d.title;
      a.href="#"+d.id; a.dataset.id=d.id; nav.appendChild(a); });
  }
}
async function render(id){
  const d = byId[id] || docs[0]; if(!d) return;
  document.getElementById("crumb").textContent = (d.group? d.group+" / ":"")+d.title;
  document.getElementById("content").innerHTML = window.marked.parse(d.markdown||"");
  // convert ```mermaid code blocks into rendered diagrams
  document.querySelectorAll("code.language-mermaid").forEach((c,i)=>{
    const div=document.createElement("div"); div.className="mermaid"; div.textContent=c.textContent;
    c.closest("pre").replaceWith(div);
  });
  try{ await mermaid.run({ querySelector:".mermaid" }); }catch(e){ console.warn("mermaid:",e); }
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active", a.dataset.id===d.id));
  const m=window.DOC_META||{}; document.getElementById("footer").textContent =
    `Generated ${m.generated||"—"} · documented commit ${(m.documented_sha||"—").slice(0,7)}`;
}
addEventListener("hashchange",()=>render(location.hash.slice(1)));
(async()=>{ await loadMarked(); buildNav(); render(location.hash.slice(1) || (docs[0]&&docs[0].id)); })();
</script>
