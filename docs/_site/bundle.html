  "markdown": "\n# AI-Forward — Documentation\n\nA **Map of Content** (a curated link layer over the graph, not a folder mirror) for this\nrepository — the development home of the **AI-Forward Pack** and a live install of it.\n\n> New here? Start with the **[Interactive Explainer](../web/ai-forward-pack-explainer.html)** —\n> it walks the knowledge, the skills, the Rigor Protocol, and the UI-template grammar, and lets\n> you preview every interface archetype before choosing one.\n\n## The documentation surfaces\n\n| Surface | What it is | Open |\n|---|---|---|\n| **Pack Index** | The **whole repo** — knowledge, skills, templates, scripts, personas, examples, and the knowledge graph — navigable and **searchable** in one page. Loads `web/pack-index.js` (regenerated by `tools/build-web-index.py`, wired into `sync-pack.ps1`). | [`web/index.html`](../web/index.html) |\n| **Interactive Explainer** | Self-contained React/HTML page explaining the pack's reasoning, personas, skills, and the UI archetype grammar — with a table of all template types and linkable, rendered **mockups** of each. | [`web/ai-forward-pack-explainer.html`](../web/ai-forward-pack-explainer.html) |\n| **Docs Explorer** | The knowledge graph, browsable as hierarchy · graph · mind map · health. Loads `docs/docs-index.js`. | [`docs/index.html`](index.html) |\n| **Documentation Portal** | The **published front door** — what GitHub Pages serves. Getting started, capabilities, every skill, multi-agent collaboration, the prompt loop, foundations, UI, architecture, systems, graph, reference. Loads `docs/portal/portal-data.js`. | [`docs/portal/index.html`](portal/index.html) |\n| **API reference** | JavaDoc-style reference for the **deployed script bundle** — generated from each module's own docstrings and argparse definitions, with undocumented members listed as recorded gaps. | [`docs/api/index.md`](api/index.md) |\n| **Close-up bundle view** | The markdown bundle rendered with navigation and Mermaid, self-contained and openable over `file://`. | [`docs/_site/index.html`](_site/index.html) |\n\n## Architecture of record\n\n- **[Architecture Overview](architecture.md)** — the source→build→install→consumer structure, the four diagram families (component · sequence · layered · class), and the tool/CLI reference.\n- **[API reference](api/index.md)** — the public surface, module by module, with computed coverage.\n- **[Forensic Review](reviews/forensic-review.md)** · **[Proposed Remediation Backlog](backlog/forensic-review.md)** — evidence-based review of the repository, focused on commit `5d7b952` and model/task orchestration.\n\n## The pack itself (payload docs)\n\n- **[Pack README](ai-forward-pack/README.md)** · **[Pack OVERVIEW](ai-forward-pack/OVERVIEW.md)** · **[Research synthesis](ai-forward-pack/research-synthesis.md)** · **[INSTALL](ai-forward-pack/INSTALL.md)**\n- **The reasoning spine:** the Rigor Protocol, the Body of Knowledge, the Rules of the Road (`.claude/knowledge/`).\n- **The skills** — deliberately *not* listed here. Any hand-kept roster of them rots: this file\n  claimed \"17 skills\" and named a `/design` that had been renamed, months after both facts\n  changed. Read them from a surface that is derived and therefore cannot drift — the\n  **[Portal's Skills section](portal/index.html)** or the **[Pack Index](../web/index.html)**,\n  both generated from `pack/commands/*/SKILL.md` and held by\n  `tests/docs_explorer/test_portal_inventory.py`.\n- **The persona council** and the **UI archetype grammar + catalog** (`.claude/knowledge/`) —\n  the roster and its veto strengths are likewise derived, in the Portal's\n  *Multi-Agent Collaboration* section.\n\n## How this documentation stays current\n\nTwo gates, because staleness has two shapes.\n\n**Change-based** — `tools/check-consistency.py` re-runs every generator in `--check` mode and\nfails when a derived artifact disagrees with its source: `docs/api/`, `docs/portal/portal-data.js`\nand `web/pack-index.js`. `docs-graph.py validate` fails on invalid frontmatter, dangling typed\nlinks, entries whose files are gone, and index-versus-frontmatter disagreement. Both run in\n`tools/verify-bundle.ps1` and in CI on every push.\n\n**Time-based** — `.github/workflows/docs.yml` runs weekly, because an artifact's `review-by`\nlapses on a *date*, not on a commit: on a quiet week nothing pushes and nothing notices. It fails\non a push or PR and warns on the schedule, so a review-by that lapsed overnight raises a signal\nfor that artifact's owner without reddening `main` for everyone. `docs-graph.py snapshot` records\nthe graph-health trend that makes governance drift visible as a series.\n\nCoverage, confidence labels, and the known gaps are recorded in\n[`_meta.json`](_meta.json) — including the largest open debt, that 60% of the deployed bundle's\npublic functions still carry no docstring.\n\n---\n*Map of Content per Knowledge-Visualization Standard V3. Frontmatter is the record; this index\nis a curated projection, not a generated folder listing.*\n"

  "id": "architecture",
  "title": "AI-Forward — Architecture Overview",
  "markdown": "\n<!--\nProduced by /document (Rigor Protocol run on the codebase as the subject of documentation).\nGround truth is the repository itself. Confidence labels: [Verified] traced to a file/run;\n[Inferred] reasoned, not executed; [Flagged] carried as a risk. The documented commit and\ncoverage are in docs/_meta.json. This bundle is companion to the self-contained interactive explainer\nweb/ai-forward-pack-explainer.html (generated by this run).\n-->\n\n# Architecture: AI-Forward (pack source + live dogfood install)\n\n- **Status:** Accepted\n- **Tier:** N/A — this repository is a knowledge/tooling package with no inference client.\n  The short-lived model-orchestration experiment was reverted after forensic review; model\n  selection remains the host/user's responsibility. `[Verified]`\n- **Driving context:** `README.md`, `CLAUDE.md`, `pack/OVERVIEW.md`\n- **Documented commit:** see `docs/_meta.json`\n\n## Context & constraints\n\nThis repository is **two things at once** (`README.md` §\"This repo is two things at once\"):\n\n1. **The canonical source** of the AI-Forward Pack — everything you edit to expand the pack lives under `pack/`. `[Verified: README.md, pack/]`\n2. **A live install of the pack** — the pack is installed into this same repo (`.claude/`, `docs/`) so the skills, agents, and knowledge are active in Claude Code *while you work on the pack itself*. Dogfooding: the pack is built using the pack. `[Verified: .claude/, CLAUDE.md]`\n\nThe load-bearing constraint that shapes the whole structure:\n\n> **`.claude/` and `docs/` are GENERATED from `pack/`** by `tools/sync-pack.ps1` and committed so a fresh clone has a working install with no setup. `pack/` is the single source of truth — never edit the generated copies directly; they are overwritten on the next sync. `[Verified: CLAUDE.md, tools/sync-pack.ps1]`\n\nGenerated knowledge documents under `.claude/knowledge/` and `docs/ai-forward-pack/` carry **no YAML frontmatter** (they are vendored prose, not graph nodes). Project documentation under `docs/` is the graph authority; it contains **128 valid artifacts with no stale, flagged, orphan, dangling, or index-drift findings**. `[Verified: docs-graph.py inventory/validate, pack revision 53, 2026-08-30]`\n\n## Archetype & rationale\n\nNo LOA system archetype (A–I) applies — those classify AI-integrated *runtime* systems. The applicable shape here is a classic **source → build → install → consumer** pipeline with a **dogfood loopback**: the install layer feeds back into the authoring experience (Claude Code reads `.claude/` while you edit `pack/`). `[Inferred from repo structure]`\n\n## Component map & boundaries\n\nThe major components and the real dependency edges between them (read from `tools/sync-pack.ps1`, `tools/package-pack.ps1`, and the directory layout):\n\n```mermaid\nflowchart TB\n  subgraph SRC[\"pack/ — canonical source (edit here)\"]\n    K[\"knowledge/*.md<br/>(reasoning spine + roster + foundation)\"]\n    C[\"commands/&lt;name&gt;/SKILL.md<br/>(the 24 skills)\"]\n    T[\"templates/*<br/>(artifacts each skill emits)\"]\n    A[\"adapters/<br/>(Claude Code + Copilot agents, INSTALL.md)\"]\n    SC[\"scripts/ (20) · evals/ · ci/ · examples/\"]\n    CB[\"context-budget.json<br/>(always-on budget baseline)\"]\n    PD[\"README · OVERVIEW · research-synthesis\"]\n  end\n\n  subgraph TOOLS[\"tools/ — build\"]\n    SYNC[\"sync-pack.ps1\"]\n    PKG[\"package-pack.ps1\"]\n    GEN[\"build-docs-portal.py<br/>build-web-index.py<br/>build-api-docs.py\"]\n  end\n\n  subgraph INSTALL[\"generated install (do not hand-edit)\"]\n    CK[\".claude/knowledge/*.md<br/>(all 39, verbatim)\"]\n    CS[\".claude/skills/*\"]\n    CA[\".claude/agents/*.md\"]\n    GI[\".github/instructions/<br/>always + glob-scoped\"]\n    GK[\".github/knowledge/<br/>skill + reference, on demand\"]\n    GP[\".github/prompts/ · .github/agents/\"]\n    DP[\"docs/ai-forward-pack/<br/>templates + scripts + pack docs\"]\n    EXP[\"docs/index.html<br/>(Docs Explorer)\"]\n    IDX[\"docs/docs-index.js<br/>(derived graph index)\"]\n    PORT[\"docs/portal/portal-data.js<br/>(Documentation Portal data)\"]\n    WIX[\"web/pack-index.js\"]\n    ARCH[\"docs/architecture.md · index.md · api/ · _meta.json<br/>(this bundle)\"]\n  end\n\n  subgraph CONSUMERS[\"consumers\"]\n    CC[\"Claude Code / Copilot<br/>(read .claude/ + .github/)\"]\n    WEBE[\"web/ai-forward-pack-explainer.html<br/>(interactive explainer)\"]\n    PAGES[\"GitHub Pages<br/>(portal is the front door)\"]\n    ZIP[\"dist/ai-forward-pack.zip\"]\n  end\n\n  K --> SYNC\n  C --> SYNC\n  T --> SYNC\n  A --> SYNC\n  CB --> SYNC\n  SYNC --> CK & CS & CA & DP & EXP\n  SYNC -- \"routes on each doc's load: scope\" --> GI & GK\n  SYNC --> GP\n  C -. \"skills reference\" .-> CK\n  CA -. \"agents reference\" .-> CK\n  ARCH --> GRAPH[\"docs-graph.py derive\"]\n  GRAPH --> IDX\n  SYNC --> GRAPH\n  SYNC --> GEN\n  GEN --> PORT & WIX\n  ARCH --> GEN\n  IDX --> EXP & PORT\n  CK --> CC\n  CS --> CC\n  CA --> CC\n  GI --> CC\n  PORT --> PAGES\n  WEBE --> PAGES\n  SRC --> PKG --> ZIP\n  CK -. \"derived content\" .-> WEBE\n```\n\nBoundaries that matter:\n- **Source ↔ install boundary** — crossed *only* by `tools/sync-pack.ps1`. Editing the install side directly is a contract violation (the next sync overwrites it). `[Verified: CLAUDE.md, sync-pack.ps1]`\n- **`sync-pack.ps1` write scope** — `.claude/{knowledge,skills,agents}`, all four `.github/` surfaces, `docs/ai-forward-pack/**`, `docs/index.html`, and the CLAUDE.md / AGENTS.md managed blocks. It then **invokes the derivation tools**: `docs-graph.py derive`, `build-web-index.py`, `build-docs-portal.py`. `[Verified: tools/sync-pack.ps1]`\n- **It does not write** `.claude/settings.local.json`, `.github/copilot-instructions.md`, or this bundle's hand-authored files (`docs/architecture.md`, `docs/index.md`), so they have a stable home. `[Verified: tools/sync-pack.ps1 header + body]`\n- **Correction (2026-09-03).** This section previously stated that sync \"intentionally does not touch `docs/docs-index.js`\". That has been false since FR-060/FR-068 moved derivation *into* sync so the index could never lag a run that added an artifact. The index is still never hand-edited — it is derived from frontmatter — but sync is now one of the things that derives it.\n- **Load-scope routing** — a knowledge doc reaches `.github/instructions/` only if its frontmatter says `load: always` or `load: glob`; `skill` and `reference` docs go to `.github/knowledge/` and are read on demand. This is what keeps the always-on prefix at ~43.7K rather than ~184K estimated tokens. `[Verified: sync-pack.ps1 Get-LoadScope; pack/context-budget.json]`\n\n## Key flow — the sandbox / dogfood loop (sequence)\n\nThe authoring loop from `README.md` §\"Expanding the pack\", with the graph-refresh step `/document` adds:\n\n```mermaid\nsequenceDiagram\n  actor Dev as Author\n  participant Pack as pack/ (source)\n  participant Sync as tools/sync-pack.ps1\n  participant Install as .claude/ + docs/\n  participant CC as Claude Code (this repo)\n  participant Graph as docs-graph.py\n  participant Verify as tools/verify-bundle.ps1\n  participant Explorer as docs/index.html\n\n  Dev->>Pack: edit a knowledge doc / SKILL.md / persona / template\n  Dev->>Sync: pwsh tools/sync-pack.ps1\n  Sync->>Install: mirror knowledge, skills, agents, templates, scripts\n  Sync->>Install: route each knowledge doc by its load: scope<br/>(instructions vs .github/knowledge)\n  Sync->>Install: re-paste the CLAUDE.md / AGENTS.md managed blocks\n  Sync->>Graph: docs-graph.py derive\n  Graph->>Install: write docs/docs-index.js from frontmatter\n  Sync->>Install: build-web-index.py, build-docs-portal.py\n  Note over Sync,Install: derivation runs INSIDE sync (FR-068), so the<br/>index can never lag a run that added an artifact\n  Dev->>CC: try the change (regenerated skills/agents are now live)\n  CC-->>Dev: run a skill; dogfood the edit\n  Dev->>Verify: pwsh tools/verify-bundle.ps1\n  Verify->>Verify: 10 gates — counts · drift · tests · explorer ·<br/>graph · foundation · audit · evals · context budget\n  Verify-->>Dev: CONSISTENT, or the first thing that is wrong\n  Graph->>Explorer: index loaded; hierarchy · graph · mind map · health render\n  Dev->>Pack: commit pack/ + .claude/ + .github/ + docs/ together (lockstep)\n```\n\nThe gate is part of the loop, not an afterthought: `main` enforces linear history and has **no\nrequired status check**, so `verify-bundle.ps1` before the push is the only thing standing between\nan author and a red `main`. `[Verified: README.md §\"Expanding the pack (the sandbox loop)\", tools/sync-pack.ps1, tools/verify-bundle.ps1, docs/notes/required-status-checks.md]`\n\n## Reverted model-orchestration experiment (historical)\n\nCommit `5d7b952` added a global model-orchestration standard and static routing lookup. The\nforensic review found that the capability was not wired into skills/personas, contradicted its\nhard adversary-independence rule, could reduce T2 rigor, lacked behavioral proof/audit support,\nand had no provider/data-governance boundary. The user chose removal rather than remediation.\n\nThe active architecture therefore has **no model-per-task control plane**. The existing\nOrchestrator remains a process/persona facilitator only. The historical evidence and closed\nfindings remain in `docs/reviews/forensic-review.md`,\n`docs/backlog/forensic-review.md`, and the superseded/accepted decision-note pair.\n\n## Layered view (source → consumer)\n\nThe repo's own layering (distinct from the LOA *capability* tiers it ships as payload):\n\n```mermaid\nflowchart TB\n  subgraph L4[\"Consumer layer\"]\n    direction LR\n    cc[Claude Code / Copilot]:::c\n    ex[Docs Explorer + web explainer]:::c\n    z[dist/ zip for other repos]:::c\n  end\n  subgraph L3[\"Install layer (generated, committed)\"]\n    direction LR\n    claude[.claude/ knowledge·skills·agents]:::i\n    gh[.github/ instructions·knowledge·prompts·agents]:::i\n    docs[docs/ pack-docs·scripts·templates·index·api·portal]:::i\n  end\n  subgraph L2[\"Build layer\"]\n    direction LR\n    sync[sync-pack.ps1]:::b\n    pkg[package-pack.ps1]:::b\n    gen[derivation: docs-graph · portal · web-index · api-docs]:::b\n  end\n  subgraph L1[\"Source layer (single source of truth)\"]\n    pack[pack/ knowledge·commands·templates·adapters·scripts]:::s\n  end\n  L1 --> L2 --> L3 --> L4\n  classDef s fill:#1d2b4d,stroke:#5a7cff,color:#dde6ff\n  classDef b fill:#13324a,stroke:#5ad1c7,color:#dffaf6\n  classDef i fill:#2a2440,stroke:#a98bff,color:#efeaff\n  classDef c fill:#163024,stroke:#56d364,color:#dcffe4\n```\n\nDependency direction points **up only** (source → build → install → consumer); no consumer writes back into source except through the human author editing `pack/`. `[Verified: tools/*.ps1]`\n\n## Domain model (class) — the UI Archetype Grammar\n\nThe most code-like structure in the repo is the **Archetype Grammar** (`ui-archetype-grammar.md` EBNF, G1–G16) and its catalog (`ui-archetype-catalog.md`). Documented here as a class model because it is the conceptual schema the experience and the codegen contract are built on:\n\n```mermaid\nclassDiagram\n  class Signature {\n    +Name name\n    +FacetList facets\n    +StyleHints? hints\n    +validate() conflicts\n    +roundTrip() bool  %% G10: identify AND generate\n  }\n  class Facet {\n    <<abstract>>\n    +String key\n  }\n  class SingleValuedFacet {\n    +Value value  %% Type, Arch, Layout, Density, Pacing, ...\n  }\n  class MultiValuedFacet {\n    +Value[] values  %% Nav, Input, Feedback, Motion, A11y (joined with +)\n  }\n  class StyleHints {\n    +String[] hints  %% bounded NL decoration, applied last\n  }\n  class Archetype {\n    +String id          %% A1..F2\n    +String name\n    +Exemplar[] exemplars\n    +Signature canonical\n    +String codegenDescriptor\n  }\n  Signature \"1\" o-- \"4..*\" Facet : composes\n  Facet <|-- SingleValuedFacet\n  Facet <|-- MultiValuedFacet\n  Signature \"0..1\" *-- \"1\" StyleHints : decorated by\n  Archetype \"1\" *-- \"1\" Signature : canonical\n  Archetype \"1\" o-- \"1..*\" Exemplar\n  note for Signature \"G4: MUST carry Type, Arch, Layout, Pacing.\\nG1: always composed with a concrete U1–U20 / S1–S10 spec.\"\n```\n\n`[Verified: ui-archetype-grammar.md §2 EBNF, G1/G4/G5/G10; ui-archetype-catalog.md]`\n\n## Tool & CLI reference (the repo's public surface)\n\nThe **public surface is the deployed script bundle** — `pack/scripts/*.py`, which lands in every consuming repo as `docs/ai-forward-pack/scripts/`. That surface now has a generated JavaDoc-style reference at **[`docs/api/`](api/index.md)**, extracted from the modules' own docstrings and argparse definitions. Everything under `tools/` is repo-local build tooling and is deliberately *not* deployed. `[Verified: tools/, pack/scripts/, docs/ai-forward-pack/scripts/, tools/build-api-docs.py]`\n\n| Command | Purpose | Notes |\n|---|---|---|\n| `pwsh tools/sync-pack.ps1` | Regenerate `.claude/`, `.github/`, and `docs/` from `pack/`. | Run after every `pack/` edit. Also runs `docs-graph.py derive`, `build-web-index.py`, and `build-docs-portal.py`. |\n| `pwsh tools/package-pack.ps1` | Build `dist/ai-forward-pack.zip` for sharing. | Carries full Claude Code + Copilot wiring. |\n| `pwsh tools/verify-bundle.ps1` | Run the complete **ten-gate** local proof, matching CI's gate set. | Gate 2 synchronizes and compares generated surfaces; gate 8 is the always-on context budget. CRLF-only working-copy noise may need normalization on Windows. |\n| `python tools/build-api-docs.py [--check]` | Generate `docs/api/` from `pack/scripts/`. | `--check` is the drift gate; prose comes only from source docstrings, gaps are recorded not invented. |\n| `python pack/scripts/context-budget.py <cmd>` | The always-on context budget: `report`, `gate`, `agents`, `preflight`. | Ratchets against the baseline in `pack/context-budget.json`. |\n| `python tools/new-capability.py ...` | Scaffold a skill or knowledge extension across source surfaces. | Used by `/extendaibundle`. |\n| `python tools/check-consistency.py` | Check counts, skill/prompt parity, prose drift, deployed-agent parity, proof coverage, workflow pinning, review currency, and derived-artifact drift. | Reads `pack/` as the source of truth and fails closed on mismatches. |\n| `python docs/ai-forward-pack/scripts/docs-graph.py <cmd>` | The knowledge-graph mechanics (V18). | Stdlib-only Python 3.8+. |\n\n`docs-graph.py` subcommands (`[Verified: --help]`): `inventory` (scan the graph → JSON), `derive` (frontmatter → `docs/docs-index.js`), `validate` (inventory + nonzero exit on findings, CI-able), `freshness` (stale + flagged + orphans gate), `flag` / `clear-flag` (V16 review propagation), `stub` (scaffold a schema-correct artifact), `snapshot` (append a graph-health record), `rollup` (aggregate per-design STRIDE / privacy tables into a register).\n\n## Cross-cutting concerns\n\n- **Identity & trust boundaries:** none — this is a static content/tooling repo with no runtime auth surface. `[Verified]`\n- **Failure & resilience:** the only \"runtime\" is the build tools; `sync-pack.ps1` is idempotent (it mirrors source over install each run). `[Inferred]`\n- **Observability:** N/A at repo runtime; the *Observability Standard* (O1–O13) is shipped as pack payload, not applied to this repo's tools. `[Verified]`\n- **Data governance / privacy:** no personal data is stored or processed. `[Verified]`\n\n## Flagged risks & residual unknowns\n\n- **`[Resolved 2026-06-22; reverified 2026-07-12]` Knowledge graph populated; vendored foundation docs deliberately excluded (decision).** The graph holds the project's dogfood artifacts while vendored foundation/standards docs deliberately stay out: they deploy as *always-applied reference instructions*, not parallel graph authorities. `[Decision recorded per BoK Part IX / V17; pre-review inventory = 22 artifacts, 0 problems/stale/flagged/orphans/drift]`\n- **`[Resolved]` Archetype count corrected (16, not 18).** `CLAUDE.md`, the managed blocks (`CLAUDE.block.md`, `AGENTS.block.md`), `pack/OVERVIEW.md`, `pack/README.md`, and `pack/adapters/INSTALL.md` previously said **\"18-archetype catalog\"**, but `ui-archetype-catalog.md` enumerates **16** (A1–A4, B1–B4, C1, D1–D3, E1–E2, F1–F2). All source occurrences were corrected to 16 and the install re-synced from `pack/` (the grammar doc itself never stated a count). `[Verified: ui-archetype-catalog.md count = 16; grep shows no remaining \"18-archetype\" in source]`\n- **`[Verified-headless 2026-06-22]` Explainer statically verified; live visual pass still advisable.** `web/ai-forward-pack-explainer.html` passed a thorough headless check: its single inline app (~67 KB) **parses cleanly under `node --check`**, mounts to a `#root`, renders via `ReactDOM` (`createRoot`/`render`), and carries a CDN **offline-fallback guard**; it mirrors the proven `docs/index.html` (React 18 UMD + htm, no JSX/babel) pattern. The parse/structure failure risk is retired; a quick **visual** pass in a real browser remains nice-to-have before any public share (cosmetic only — cannot be done headless). `[Verified: node --check OK; mount + ReactDOM + offline guard present]`\n\n## Status & next action\n\n| | |\n|---|---|\n| **Completed** | Architecture overview + 4 diagram families; tool/CLI reference; interactive explainer; MoC index; `_meta.json`; `docs-index.js` regenerated; findings recorded. **2026-06-22 audit:** design-doc status tables refreshed (rev-8 Doc Drift), `project-memory` ledger instantiated, explainer headless-verified, knowledge-docs-in-graph decision recorded. |\n| **Remaining** | No active model-orchestration work. The revision-48 forensic backlog is closed through FR-068. The accepted branch-protection risk and the differing immutable `actions/checkout` pins remain deliberate positions, not open defects. |\n| **Best next action** | Keep `docs/arch   "markdown": "\n# `apply-learnings.py`\n\n*Generated from `pack/scripts/apply-learnings.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\napply-learnings.py - the AI-Forward federation / push mechanism.\n\nDistributes approved, generalised fleet learnings (from learnings/fleet-classes.jsonl in the\nai-forward repo) into one or more target repos, RECONCILING each against that repo's existing\ndefect-class register so nothing is duplicated or silently contradicted. It produces a REVIEWABLE\nplan + a diff/patch per target repo - it NEVER merges and NEVER executes anything in a target\n(spec-dreaming US-5, ADR-0002/0005). The second, pull-based federation path is /updatepack, which\ninherits general classes shipped into the pack itself.\n\nReconciliation (ADR-0004, slug-exact + human-flagged; no fuzzy index):\n  * add     - the class has no equivalent in the target -> append to the target's register.\n  * merge   - the target already has the class (slug/id or signature match) -> append the instance\n              / upgrade the control note, never a duplicate entry.\n  * conflict- the incoming class contradicts an existing directive -> SURFACE in the plan for the\n              human to resolve; never overridden.\n\nPython 3.8+, stdlib only. Safety: strip+scrub runs again before anything is written to a plan\n(defence in depth); a target without the pack is skipped with a note.\n\nTargeting/record layer (ADR-0006, the Dream Manifest):\n  * manifest-init --repos a,b,c [--dream id]  -> scaffold learnings/manifests/<id>.json (every fleet\n    class assigned to every repo, scope=all, status=pending) + a self-contained compose HTML matrix.\n  * push --manifest <file>  -> reconcile PER ASSIGNMENT (a learning only into its `targets`), write a\n    reviewable plan per repo, record the outcome back into the manifest's status map, re-render the\n    rollout HTML. Manifests name repos -> LOCAL-ONLY (excluded from the published bundle).\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `manifest-init` | scaffold a learnings×repos manifest + compose HTML from the fleet store |\n| `push` | reconcile fleet learnings into target repos -> plans |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--dream` | optional dream id this manifest derives from |\n| `--id` | manifest id (default: manifest-<timestamp>) |\n| `--manifest` | a learnings×repos manifest (learnings/manifests/<id>.json) — targets per assignment, records status back |\n| `--repos` | comma-separated repo paths, or 'all' (sibling repos with the pack) |\n| `--root` | the ai-forward repo root (holds learnings/) |\n| `--session` | session id for the audit trail |\n\n## Functions\n\n### `now_iso()`\n\n**Coverage gap** — no docstring in the source.\n\n### `find_root(start)`\n\n**Coverage gap** — no docstring in the source.\n\n### `read_jsonl(path)`\n\n**Coverage gap** — no docstring in the source.\n\n### `scrub(text)`\n\n**Coverage gap** — no docstring in the source.\n\n### `slug(sig)`\n\n**Coverage gap** — no docstring in the source.\n\n### `target_has_pack(repo)`\n\n**Coverage gap** — no docstring in the source.\n\n### `target_register(repo)`\n\nReturn {token-set, ids, raw} of the target's existing defect-class register for reconciliation.\n\n### `reconcile(learning, reg)`\n\nClassify one incoming learning against a target register: add | merge | conflict.\n\n### `load_fleet(root)`\n\nDeduped list of promoted fleet learnings (latest wins by slug).\n\n### `control_text(record)`\n\nThe control on a learning may be a {rung, text} object (what a dream writes) or a bare\nstring (a hand-edited store, or an older record — this JSONL is a plain committed file\nanyone can edit). Chaining `.get(\"control\", {}).get(\"text\")` crashed with an unhandled\nAttributeError on the string form, in the script that writes into other people's\nrepositories, AFTER it may already have written plans for earlier targets. Neither shape\nis malformed enough to justify that; a genuinely absent control still returns \"\" and is\nskipped by the caller. Swept as a class: the identical line existed in dream.py.\n\n### `plan_repo(repo, learnings)`\n\nReconcile a set of learnings into one target repo -> a plan list (add|merge|conflict|skip).\nShared by `push --repos` and `push --manifest`; never merges, only plans (ADR-0005).\n\n### `find_template(root, name)`\n\nResolve a pack template whether running from the ai-forward repo or an installed target.\n\n### `render_manifest_html(root, manifest, learnings, mode)`\n\nRender the self-contained learnings×repos matrix (compose|rollout) with the data inlined.\n\n### `render_patch(repo, plan)`\n\nA human-readable reconciliation plan + the exact register additions (never auto-applied).\n\n### `cmd_push(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_manifest_init(args)`\n\nScaffold a learnings×repos manifest from the fleet store + render the compose HTML.\n\n## Coverage\n\n- Public functions: **16** · documented: **9** (**56%**)\n- Undocumented (recorded, not invented): `now_iso`, `find_root`, `read_jsonl`, `scrub`, `slug`, `target_has_pack`, `cmd_push`\n\n"

  "id": "api-audit-log",
  "title": "API — audit-log.py",
  "markdown": "\n# `audit-log.py`\n\n*Generated from `pack/scripts/audit-log.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\naudit-log.py — the AI-Forward Pack audit & change log bundle (audit-and-change-log.md).\n\nDurable, committed, history-as-knowledge for a repo: an append-only record of every\nmeaningful prompt / skill / script / decision, so any future Copilot or Claude Code\nsession reads the project's own history instead of starting blind. The canonical logs\nare append-only JSONL (clean git diffs, like docs/health-history.jsonl); the viewer\nreads a derived window.AUDIT_DATA JS (loadable over file://, like docs/docs-index.js).\nPython 3.8+, stdlib only — no dependencies.\n\nTwo logs, one bundle:\n  docs/audit/audit-log.jsonl    every action (shortname, datetime, session, prompt, summary, …)\n  docs/audit/change-log.jsonl   the meaningful design changes / decisions (+ git before/after)\n  docs/audit/audit-data.js      derived window.AUDIT_DATA = {audit:[…], changes:[…]} (the viewer's data)\n  docs/audit/index.html         the interactive viewer (self-bootstrapped from the template)\n\nSubcommands\n  append      Add an audit entry.            (Audit Mandate — every skill's last action)\n  change      Add a change-log entry.        (Change Mandate — collectknowledge/define-architecture/design-slice/migrate)\n  list        Show the last N entries (audit|change). For the CLI skill.\n  search      Filter by --session / --since / --until / --keyword. For the CLI skill.\n  get         Print one entry by --id (use --field prompt to extract the prompt to re-run).\n  render      Regenerate audit-data.js from the JSONL and ensure the viewer exists (repair).\n  git-context Print the current git {sha, short, branch, pushed} as JSON (a helper).\n  verify      Fail when any log line is unreadable — the system of record must never lose\n              an entry silently (FR-052). CI-able.\n  suggest     Discern unlogged meaningful changes (recent commits + new ADRs/notes not in the change log).\n  import      Ingest a session-export JSON array of turns into the audit log (build on session history).\n\nConventions\n  --root defaults to docs/. The audit dir is <root>/audit. The viewer template is resolved\n  relative to this script (pack/templates or docs/ai-forward-pack/templates). git is optional —\n  every git call degrades gracefully when git or a repo is absent. This tool never invents a\n  prompt or a summary; required fields must be supplied (flags, --*-file, or --from-json -).\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `append` | add an audit entry |\n| `change` | add a change-log entry |\n| `get` | print one entry by id |\n| `git-context` | print current git context as JSON |\n| `import` | ingest a session-export JSON array into the audit log |\n| `list` | show the last N entries |\n| `render` | regenerate audit-data.js and ensure the viewer exists |\n| `search` | filter by session/datetime/keyword |\n| `selfcheck` | bounded inline session self-assessment (FC-1): goal-state presence gaps + scope review for a session |\n| `start` | record this run's start stamp (call at grounding) so the closing `append` records duration automatically (IO1) |\n| `suggest` | surface meaningful changes not yet in the change log |\n| `verify` | fail if any log line is unreadable (FR-052; CI-able) |\n| `yield` | persona yield: findings raised vs accepted (P6) |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--actor` | _(no help text — coverage gap)_ |\n| `--agent-run` | one sub-agent run as '<agent>|<start-iso>|<end-iso>', optionally '|<calls>/<budget>' - the branch's tool calls against the budget it was dispatched with (GO7). `selfcheck` reports a run with no budget as a gap and an over-run as a finding; the firing is a DEFECT SIGNAL, never a reason to raise the number (GO9). Repeatable. Records agent_runs + a parallelism block (agent_seconds, span_seconds, speedup, peak_concurrency) so fan-out is MEASURED, not asserted (P8). Summed duration cannot tell serial from parallel; the union of the intervals can. |\n| `--artifact` | _(no help text — coverage gap)_ |\n| `--audit-ref` | _(no help text — coverage gap)_ |\n| `--change` | link to a change-log id (cl-NNNN) |\n| `--compiled-from` | the kind:compilation entry this workflow run started from (P7, spec US-6); a kind:skill entry without it records compiled: false |\n| `--datetime` | _(no help text — coverage gap)_ |\n| `--done-when-file` | read --done-when from a UTF-8 file |\n| `--done-when` | the terminal condition (front matter CT19); the PACK-O presence signal /dream mines (AL5b) |\n| `--edit-distance` | 1 - SequenceMatcher ratio between the compiled prompt and the text the workflow received, in [0, 1] (prompt-compile.py distance); requires --compiled-from |\n| `--fan-out` | the declared fan-out cap: most sub-agents the turn may convene (CT19; 0 at T0, 2 at T1) |\n| `--field` | print just this field (e.g. prompt) |\n| `--file` | JSON file (or - for stdin) |\n| `--from-json` | read fields from a JSON object (path or - for stdin) |\n| `--gate` | exit non-zero when a substantive turn in scope recorded no goal-state/tier or exceeded its declared fan-out cap |\n| `--git-before` | HEAD sha captured before the work began |\n| `--git` | capture current git context |\n| `--goal-file` | read --goal from a UTF-8 file (or - for stdin); argv through a Windows console is not UTF-8 (pack finding #1) |\n| `--goal` | the turn's goal (front matter CT19) |\n| `--harness` | the session-start hook's form: a harness-session (and agent) marker that an append uses only when it has no marker of its own, recorded as duration_source=session-start-hook |\n| `--id` | _(no help text — coverage gap)_ |\n| `--json` | _(no help text — coverage gap)_ |\n| `--keyword` | _(no help text — coverage gap)_ |\n| `--kind` | _(no help text — coverage gap)_ |\n| `--main-budget` | the MAIN line's own tool calls against the budget declared in the goal state (CT19), same spelling as --agent-run's. Measured: the main line was 91%% of a session's cost at 10x the per-request cost of its own delegates (CTX-M), and every other budget bounds delegates. A declaration, not an enforcement - the agent cannot count its own model requests; `session-profile.py` SP-19 measures the real split from the store. |\n| `--n` | _(no help text — coverage gap)_ |\n| `--outcome` | _(no help text — coverage gap)_ |\n| `--persona-yield` | one persona's findings raised vs accepted; repeatable. Makes the roster tunable on measured yield rather than belief (P6) — an advisory lens re-convenes only on an accepted finding. |\n| `--project` | project name for the viewer (default: repo dir name) |\n| `--prompt-file` | _(no help text — coverage gap)_ |\n| `--prompt` | _(no help text — coverage gap)_ |\n| `--rationale` | _(no help text — coverage gap)_ |\n| `--root` | docs root (default: docs); audit dir is <root>/audit |\n| `--session` | _(no help text — coverage gap)_ |\n| `--shortname` | _(no help text — coverage gap)_ |\n| `--signal-acceptance-met` | signal: the done_when acceptance criterion was met |\n| `--signal-regression` | signal: a known regression was introduced (a claim, so emit only when checked) |\n| `--signal-verification-executed` | signal: the verification (red-observed) was actually executed |\n| `--signal-verification-path` | signal: a committed Proof Pack / verification path exists (watcher AL2a) |\n| `--since` | _(no help text — coverage gap)_ |\n| `--skill` | _(no help text — coverage gap)_ |\n| `--started` | ISO-8601 UTC start stamp captured at grounding; records started_at + duration_seconds so elapsed time is MEASURED, not modeled (instrumentation over inference, IO1) |\n| `--summary-file` | _(no help text — coverage gap)_ |\n| `--summary` | _(no help text — coverage gap)_ |\n| `--supersedes` | _(no help text — coverage gap)_ |\n| `--tag` | _(no help text — coverage gap)_ |\n| `--tier` | the turn's declared ceremony tier (front matter CT19) |\n| `--title` | _(no help text — coverage gap)_ |\n| `--tool` | _(no help text — coverage gap)_ |\n| `--until` | _(no help text — coverage gap)_ |\n\n## Functions\n\n### `now_iso()`\n\n**Coverage gap** — no docstring in the source.\n\n### `parse_iso(s)`\n\nParse an ISO-8601 UTC stamp. Returns None on anything unparseable -- an unusable\n--started value must degrade to 'no duration recorded', never to a wrong duration.\n\n### `duration_fields(started, ended_iso)`\n\nInstrumentation over inference: when a start stamp is supplied, RECORD the elapsed\nseconds rather than leaving a future reader to model it. Returns {} when the start is\nabsent or unparseable, and refuses a negative duration (clock skew) rather than\nemitting a number that is precise and wrong.\n\n### `parse_agent_run(spec)`\n\n'<agent>|<start-iso>|<end-iso>[|<calls>/<budget>]' -> a span dict, or None.\n\nDegrades to None on anything unparseable or time-reversed, never to a plausible wrong\nspan (IO8) -- a fabricated interval would corrupt the very measurement it exists for.\n\nP6 / class CTX-F: the fourth field is the branch's tool calls against the budget it was\ndispatched with. GO7 has required recording \"each branch's actual calls against its\nbudget\" since the shape was measured -- a domain-researcher at 123 calls and 3.0M tokens\nthat stopped only when the parent said \"converge now\" twice -- and the span could not\nexpress it, so nothing could check it. That is PACK-A, and CI6's memoir.\n\nIt is optional, and the three-field form still parses: every entry already in the log\nuses it, and breaking those to add a field is not a fix. A malformed budget leaves the\nSPAN usable and records no budget -- the interval is still good evidence, and losing the\nparallelism measurement over a typo would cost more than it saves.\n\nThis is a RECORD, not an enforcement. No harness mediates a sub-agent's tool count, and\na control that cannot stop the call must not be labelled as though it can.\n\n### `budget_findings(entries)`\n\nPer-branch budget gaps and over-runs across audit entries.\n\nTwo separate signals, and the first is the one that rots: a delegation recorded with no\nbudget is a fan-out nobody bounded, and it looks identical to a well-behaved one. An\nover-run is the louder finding but the rarer one.\n\n### `parallelism_fields(runs)`\n\nUnion-of-intervals wall clock vs summed run time, from a list of parse_agent_run spans.\n\nReturns {} when no usable span is present -- \"not recorded\" rather than a speedup of 1.0\nthat a reader would mistake for a measurement of serial execution.\n\n### `parse_persona_yield(spec)`\n\n'<persona>|<raised>|<accepted>' -> a yield record, or None when unusable.\n\nRefuses accepted > raised and negative counts: a row that cannot be true would corrupt\nevery ratio derived from it, and a corrupt ratio is worse than a missing one (IO8).\n\n### `aggregate_persona_yield(entries)`\n\nRoll persona_yield records up across audit entries.\n\n`acceptance` is None when nothing was raised: 0/0 is an absence of evidence, not a\nmeasured 0% -- reporting 0.0 would read as a verdict on a persona never actually asked.\n\n### `should_reconvene(stats, advisory=…)`\n\nShould this persona be convened AGAIN on the same work? (P6)\n\nAdvisory lenses re-convene on evidence: a repeat run has to be earned by a finding that\nwas actually accepted. Hard-veto lenses are never yield-gated -- a veto exists to be\nable to say no, and gating it on past productivity would silence precisely the review\nthat has been quiet because the work was clean.\n\nA persona with no history always gets its first run; the rule gates repeats, not entry.\n\n### `record_start(root, session, stamp=…, skill=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `record_harness_start(root, harness_id, stamp=…)`\n\nThe session-start hook's marker (DC-190): keyed to the harness session (and agent),\nbecause the hook cannot know the session id a skill will close under.\n\n### `consume_start(root, session, skill=…)`\n\nReturn (stamp, source) for this session and clear the marker, so one marker\nmeasures one run. The skill-keyed marker first, then the bare session marker, then -\nonly when neither exists - the newest harness marker the session-start hook wrote,\nreported as `session-start-hook` so a reader knows the instant was the session's\nstart rather than grounding. Returns (None, None) when there is none, which degrades\nto no duration (IO8).\n\n### `audit_dir(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `log_path(root, which)`\n\n**Coverage gap** — no docstring in the source.\n\n### `ids_at_ref(root, which, ref)`\n\nThe set of entry ids in `ref`'s committed version of the log, or None if it cannot be read.\nA forward ratchet fails open on a missing base (returns None), never on a bad current entry.\n\n### `read_log(root, which, warn=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `append_log(root, which, entry)`\n\n**Coverage gap** — no docstring in the source.\n\n### `next_id(entries, prefix, allocator=…)`\n\nMint the next identifier. EXPAND step of expand-migrate-contract (ADR-0008).\n\nThis function was literally the KG-B shape: max(existing) + 1 over the LOCAL file only.\nTwo branches minting before either has pushed cannot see each other, so the collision is\nstructural -- nine recorded occurrences, twice reaching main, once destroying an entry\nwhen the conflict was resolved by deduping on the id.\n\nThe sequential path is RETAINED, not deleted: every existing al-NNNN keeps its value,\nthere is no backfill (so nothing is guessed), and COORD_LEGACY_IDS=1 restores the old\nscheme entirely. Removing it is the CONTRACT step and is a later decision.\n\n### `git(args, root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `git_context(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `commits_between(before, after, root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `ensure_hub(adir)`\n\nAL7 requires the bundle be registered in the knowledge graph through a hub artifact.\nNothing created it: a fresh install produced audit-data.js, audit-log.jsonl and\nindex.html but no .md, so the bundle was invisible to the graph. Bootstrapped here\nalongside the viewer (AL11) because the same trigger applies - if it is missing, make it.\n\nLinks are deliberately EMPTY: a fresh install has no other artifact to point at, and a\ndangling link fails `docs-graph.py validate` outright. An INBOUND link (from the UI guide\nhub, or the first skill-authored artifact) clears the orphan check - verified by execution.\n\n### `find_template()`\n\n**Coverage gap** — no docstring in the source.\n\n### `project_name(root)`\n\nThe repo's canonical name -- never the worktree folder it ran in (class PACK-P).\n\nA SOFT import, for the same reason as the allocator: this script ships to repositories\nwhose installed pack may predate repo_identity.py, and an audit render must not crash\nthere. The legacy basename survives only on that path, and `test_repo_identity.py` pins\nthe supported path so the fallback cannot quietly become the normal one.\n\n### `read_ledger_mail(root)`\n\nThe board's page-side source (spec-board US-7): the coord ledger's `type: mail` twins.\n\nReads <root>/../.agents/log/*.jsonl and keeps ONLY the twin's identifying fields — never a\nbody, even when a record carries one by mistake (the page is committed; the ledger's\ncontract carries no body). An unreadable line is reported in the read_log idiom and\nskipped; a missing ledger directory yields [] (an older repo renders unchanged).\n\n### `render(root, project=…)`\n\nRegenerate audit-data.js and the managed viewer from canonical sources.\n\n### `cmd_start(args)`\n\nInstrumentation over inference (IO1): called as a skill's FIRST action (grounding). It\npersists the run's start stamp keyed by session, so the closing `append` records\nduration_seconds automatically -- no flag to remember, no variable to thread through.\nThat is what makes the measurement default-on rather than opt-in.\n\n### `cmd_append(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_change(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_list(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_search(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_get(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_render(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_git_context(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_yield(args)`\n\nPersona yield across the log: what each lens raised, and what actually landed (P6).\n\nThis is the report the roster is tuned from. It never issues a verdict on a persona --\nit reports the ratio and marks the ones with no evidence either way, because \"never\nraised anything\" and \"raised things nobody took\" are different facts with different\nresponses.\n\n### `cmd_verify(args)`\n\nFR-052. Assert the system of record is fully readable.\n\n`read_log` deliberately survives a malformed line so the tooling keeps working — but a\nline that is silently dropped is a line /dream will never see, and the consolidation\nwould report success over an incomplete corpus. This makes the skip COUNTABLE and\ntherefore gateable: exit 1 while any line is unreadable, naming file and line number.\n\n### `cmd_suggest(args)`\n\nAdvisory: surface meaningful changes that may not be in the change log yet.\n\n### `main_line_findings(entries)`\n\nMain-line budget gaps and over-runs across audit entries (F-14, class CTX-M).\n\nMeasured in sp-0003: the main line ran 714 requests for 89,429 AIU while its delegates ran\n701 for 8,491 - near-identical counts, TEN TIMES the cost per request, 91% of the session.\nEvery budget the pack had bounded delegates, because a fan-out is a visible countable\nevent and a main line is one more reasonable step, repeated several hundred times.\n\nTHE HONEST LIMIT: a branch can count its own tool calls; the main agent cannot count its\nown model REQUESTS - only the harness store knows those. So `main_calls` is what the agent\ncan actually observe about itself (its own tool calls) against the budget it committed to\nin the goal state, and the authoritative cost split is the profiler's SP-19, read from the\nstore. Declaration and measurement are reconciled, never conflated, and neither is\nenforcement.\n\nOnly substantive turns are asked for a budget: a commit or a script run declares no\nceremony budget because it has none to declare.\n\n### `cmd_selfcheck(args)`\n\nBounded inline session self-assessment (FC-1, spec-agent-focus-controls). One deterministic\npass over a session's substantive turns -> goal-state presence gaps + done_when->summary review\npairs. Advisory and never a scope verdict (the agent/human judges drift); no network, no model,\nno second pass. This is the rung-2 mechanical aid to the CT25 closing self-assessment.\n\n### `cmd_import(args)`\n\nIngest a session-export JSON array of turns into the audit log (build on session history).\n\n## Coverage\n\n- Public functions: **40** · documented: **23** (**58%**)\n- Undocumented (recorded, not invented): `now_iso`, `record_start`, `audit_dir`, `log_path`, `read_log`, `append_log`, `git`, `git_context`, `commits_between`, `find_template`, `cmd_append`, `cmd_change`, `cmd_list`, `cmd_search`, `cmd_get`, `cmd_render`, `cmd_git_context`\n\n"

  "title": "API — conductor-join.py",
  "markdown": "\n# `conductor-join.py`\n\n*Generated from `pack/scripts/conductor-join.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\nconductor-join.py - the join, as a script: every step gated by its exit code, none by a\nshell line.\n\nThe control for defect class DC-113's fourth recurrence (measured 2026-09-13, a consuming\nrepo's join): the conductor resolved a register conflict, piped the conflict-marker gate\nthrough `| tail -1`, read the gate's remedy text as a pass, and committed a merge carrying\n`<<<<<<<` (DC-136's shape) - caught only because the gate runner was re-run bare before the\npush. Three earlier recurrences had the same cause: a hand-typed line at the join whose\nstatus was the formatter's, not the gate's. This script IS the join line. It has no pipes;\neach step is a subprocess whose return code decides whether the next runs. The\n`execute-with-coordination` skill names it as the only join line.\n\nSteps, in order, stop on the first red (the exit status is the failing step's number):\n  0. leader fence                     `coord-core.py leader who --json` BEFORE the merge (and\n                                      before --continue): refused with exit 11 (EXIT_FENCE - 0\n                                      is success) when the epoch this join carries (--epoch,\n                                      default: the ref's epoch at the join's start) is lower\n                                      than the ref's, or when the ref cannot be read; an absent\n                                      ref is \"not applicable\" (S2 has no leader)\n  1. git merge --no-ff <branch>       a conflict stops here with the file list; resolve by hand,\n                                      `git add`, `git commit --no-edit`, re-run with --continue\n  2. audit marker                     `audit-log.py start --session <s> --skill execute-with-coordination`\n                                      so the join's own duration is MEASURED (a resumed or\n                                      hand-typed join set none: 14 of 14 join entries carried\n                                      no duration, no tier, no fan-out)\n  3. verify-no-conflict-markers       ALWAYS, before anything else reads the tree\n  4. checks, then the recount         from join.json (`checks`, `recount`); the recount is timed\n                                      as recount_seconds - the largest cost centre of a measured\n                                      programme (44.8% of the conductor's active main line) and\n                                      the one no entry recorded. --docs-only skips the recount.\n  5. audit-log append                 tier T1, fan-out 0, the marker's duration, recount_seconds\n  6. regenerate                       `regenerate` from join.json, default `coord-core.py regen`\n  7. git add -A && git commit         the join commit (the pre-commit boundary runs)\n  8. gates                            `gates` from join.json, default `run-verify-gates.py`\n  9. git push <remote> <branch>       only if 8 passed; --no-push skips\n 10. build                            `build` from join.json, optional; --no-build skips\n\njoin.json (default docs/coordination/join.json; --join <path> overrides; absent = defaults):\n  { \"checks\":     [[\"python3\", \"tools/verify-register.py\", \"--fix-counts\"]],\n    \"recount\":    [[\"python3\", \"tools/verify-test-run.py\", \"--update\"]],\n    \"regenerate\": [[\"python3\", \"docs/ai-forward-pack/scripts/coord-core.py\", \"regen\"]],\n    \"gates\":      [[\"python3\", \"docs/ai-forward-pack/scripts/run-verify-gates.py\"]],\n    \"build\":      [[\"dotnet\", \"build\", \"src/App/App.csproj\", \"-c\", \"Release\"]],\n    \"push_remote\": \"origin\",\n    \"trailer_file\": \"docs/coordination/commit-trailer.txt\" }\n  A command whose first word is `python3` or `python` runs under THIS interpreter.\n\nUsage (from the checkout the join lands on):\n  python3 conductor-join.py <branch> --title \"<merge title>\" --audit-shortname <name>\n      --audit-summary \"<text>\" --audit-goal \"<text>\" --audit-done-when \"<text>\"\n      [--artifact <path> ...] [--docs-only] [--no-push] [--no-build] [--continue]\n      [--join <join.json>] [--session <id>] [--self-test]\n\nExit 0 on a complete join; the failing step's number otherwise; 11 when the leader fence (step\n0) refuses; 2 on a usage error. Stdlib only.\n```\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--artifact` | proof paths for the audit entry |\n| `--audit-done-when` | _(no help text — coverage gap)_ |\n| `--audit-goal` | _(no help text — coverage gap)_ |\n| `--audit-shortname` | the join's audit shortname |\n| `--audit-summary` | _(no help text — coverage gap)_ |\n| `--continue` | the merge was resolved by hand; start at step 2 |\n| `--docs-only` | skip the recount (no test or product change) |\n| `--epoch` | _(no help text — coverage gap)_ |\n| `--join` | the join contract (default docs/coordination/join.json) |\n| `--no-build` | _(no help text — coverage gap)_ |\n| `--no-push` | _(no help text — coverage gap)_ |\n| `--self-test` | prove a red step stops the join |\n| `--session` | audit session id (default $AGENT_SESSION, then join.json, then 'conductor') |\n| `--title` | the merge commit's title (the trailer is appended) |\n| `--trailer-file` | text appended to every commit message |\n\n## Types\n\n### `Join`\n\n_(no docstring — coverage gap)_\n\n## Functions\n\n### `repo_root(start=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `load_join(root, path)`\n\nThe join contract for this repository, or the defaults. A malformed file is a usage\nerror, never a silent fallback to defaults (a join that skipped the recount because its\nconfig had a typo would report as complete).\n\n### `leader_fence(j, given, log)`\n\nStep 0 - the join carries an epoch and the ref decides (spec-leader-designation US-7).\n\nNot a `Join.run` step: `run` knows exit codes only and the fence must read the JSON\n(absent is not-applicable; expired/released still carry the epoch). Refuses with\nEXIT_FENCE; never proceeds on an unread fence (R4: NOT CHECKED is not \"no leader\").\n\n### `join(args, root, contract, log=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `self_test()`\n\nTwo joins in a throwaway repository, both with --no-push --docs-only and no gates:\n(a) a clean branch completes, and the audit entry carries tier T1, fan_out 0 and a\nmeasured duration; (b) a branch that commits a file with a conflict marker - DC-136's\nshape, a hand-resolved file - stops at step 3 with NO join commit.\n\n## Coverage\n\n- Public functions: **5** · documented: **3** (**60%**)\n- Undocumented (recorded, not invented): `repo_root`, `join`\n\n"

  "markdown": "\n# `context-budget.py`\n\n*Generated from `pack/scripts/context-budget.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\ncontext-budget.py — the always-on context budget, measured (AI-Forward Pack).\n\nAn instruction set that is attached to every request IS the static prefix of every call.\nIt is re-read on every turn, it is billed on every turn (cached or not), and it subtracts\nfrom the window before the user has said anything. Left undeclared, it grows silently:\neach new knowledge doc looks free at the moment it is written, because nothing reports\nwhat it costs.\n\nThis makes that cost a NUMBER, emitted on the normal path (instrumentation-over-inference\nIO2/IO4: a feature is not done until its behaviour is measurable by default), and gates it\nso the set cannot re-grow UNNOTICED (continuous-improvement CI6: a lesson recorded as\nprose is a memoir). The control is a ratchet, not a ceiling: growing the set is fine,\ngrowing it without recording that you did is what fails.\n\nEvery knowledge doc declares its own load scope in frontmatter:\n\n    load: always                # attached to every request  -> Tier A, counts against the budget\n    load: glob                  # attached to matching files -> Tier B, costs nothing elsewhere\n    applyTo: \"**/*.cs,**/*.csx\"\n    load: skill                 # read on demand by a skill  -> Tier C\n    skills: [specify, implement]\n    load: reference             # consulted, never attached  -> Tier D\n\nFOUNDATION.md is the vendored provenance manifest: always-loaded by definition, kept\nverbatim, and carries no frontmatter of its own.\n\nSubcommands\n  report      Tier table + the always-on total.\n  gate        Fail on unacknowledged growth past the recorded baseline (ratchet),\n              and on a derived backstop. CI-able. See pack/context-budget.json.\n  agents      Per-agent declared knowledge prefix (the sub-agent lens, P3).\n  preflight   Fail when an assembled prefix would not fit a model's window (P5).\n  prefix      The WHOLE static prefix as the host assembles it - managed blocks (AGENTS.md /\n              CLAUDE.md, counted twice where the host loads both), the always-on docs, plus\n              stated tool/host allowances - with its own ratchet (CTX-B).\n  skills      Per-skill SKILL.md size with a per-skill ratchet and a ceiling: a skill is\n              re-injected whole on every invocation, so its size is a per-invocation tax (CTX-E).\n\nToken figures are ESTIMATES (chars / 4.83) and are labelled as such everywhere. The ratio\nis calibrated against a measured system prompt of 184,364 tokens over 890,204 characters of\nthis doc set. It is accurate enough to gate on and is never presented as a measurement:\nwhere an exact count matters, count with the target model's tokenizer.\n\nPython 3.8+, stdlib only.\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `agents` | per-agent declared knowledge prefix |\n| `gate` | fail on unacknowledged always-on growth (CI-able) |\n| `prefix` | the whole static prefix per host, with its ratchet |\n| `preflight` | fail before a fan-out that cannot fit |\n| `report` | tier table + always-on total |\n| `skills` | per-skill SKILL.md size with a per-skill ratchet |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--agent` | preflight one agent's lens instead of the main thread |\n| `--agents-dir` | override agent definition discovery |\n| `--ceiling` | override the derived backstop from context-budget.json |\n| `--config` | override context-budget.json discovery |\n| `--gate` | fail on unacknowledged prefix growth or a double-loaded CLAUDE.md |\n| `--host` | _(no help text — coverage gap)_ |\n| `--knowledge-dir` | override knowledge doc discovery |\n| `--min-headroom` | working headroom the task itself needs (default 32000) |\n| `--overhead` | any further fixed prefix |\n| `--root` | override repo-root discovery (AGENTS.md / CLAUDE.md) |\n| `--skills-dir` | override skills discovery (pack/commands or .claude/skills) |\n| `--tools` | tool-definition tokens (default 24070, the profiled figure) |\n| `--update-baseline` | record the current total as the new baseline; commit the diff alongside the change that caused the growth |\n| `--window` | target model context window |\n| `-v`, `--verbose` | list every doc |\n\n## Types\n\n### `EmptyCorpus`\n\nThe scanned directory held no knowledge docs.\n\n## Functions\n\n### `est_tokens(chars)`\n\nEstimated tokens for a character count. Always reported as an estimate.\n\n### `find_dir(*candidates, predicate=…)`\n\nResolve a pack directory from either the pack layout or an installed repo.\n\n`predicate` guards against a same-named directory that is not the one meant: walking up\nfrom docs/ai-forward-pack/scripts, a bare \"knowledge\" candidate matches docs/knowledge/\n(the evidence dirs), which contains no knowledge docs at all. Matching it produced an\nempty scan that the gate then reported as clean -- defect class PACK-P.\n\n### `knowledge_dir(explicit=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `repo_root(explicit=…)`\n\nThe repo root the managed blocks live in: the nearest ancestor holding AGENTS.md,\nCLAUDE.md or .git.\n\n### `config_path(explicit=…)`\n\nLocate the committed budget config (pack/ in the source repo, docs/ai-forward-pack/ once\ninstalled). Returns None when absent -- the gate then runs ceiling-only and says so.\n\n### `load_config(explicit=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `write_baseline(path, total, key=…, stamp=…)`\n\nRewrite only the named baseline + its stamp, preserving comments, key order and formatting.\n\n### `write_json_key(path, key, value)`\n\nRewrite one JSON object-valued key (the per-skill baseline map). Comments and the other\nkeys are preserved; the map is re-serialised one entry per line.\n\n### `agents_dirs(explicit=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `read_frontmatter(path)`\n\nReturn (meta_dict, body). meta values are raw strings; lists are parsed for [a, b].\n\n### `scan(kdir)`\n\nEvery knowledge doc with its declared scope and estimated size. Sorted, deterministic.\n\n### `always_on(docs)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_report(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_gate(args)`\n\nFail on UNACKNOWLEDGED GROWTH first, and on the derived backstop second.\n\nThe ratchet is the real control. PACK-R is silent accumulation, so the question that\nmatters is \"did this change grow the always-on set without saying so?\", not \"is the\nnumber above X\". An absolute ceiling answers the second question, stays quiet through\nthe whole accumulation, and then red-lights an ordinary paragraph -- which trains people\nto raise the ceiling reflexively, the exact habit the gate exists to break.\n\n### `cmd_agents(args)`\n\nPer-agent declared knowledge prefix (P3). An agent inherits its LENS, not the world.\n\n### `cmd_preflight(args)`\n\nFail BEFORE a fan-out when the assembled prefix cannot fit the target window (P5).\n\nOne failure at the context ceiling predicts every sibling in the wave: the prefix is\nthe same for all of them. Probing it once costs a subsecond; discovering it per-run\ncost 27 of 39 delegated runs in the profiled session.\n\n### `prefix_components(root, kdir, cfg, host)`\n\nEvery component of the static prefix this tool can see, per host, with a label each.\n'measured' = a file on disk; 'allowance' = a stated figure from config (Inferred).\n\n### `cmd_prefix(args)`\n\n**Coverage gap** — no docstring in the source.\n\n### `skills_dir(explicit=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `scan_skills(sdir)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_skills(args)`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **21** · documented: **12** (**57%**)\n- Undocumented (recorded, not invented): `knowledge_dir`, `load_config`, `agents_dirs`, `always_on`, `cmd_report`, `cmd_prefix`, `skills_dir`, `scan_skills`, `cmd_skills`\n\n"

  "markdown": "\n# `coord-board.py`\n\n*Generated from `pack/scripts/coord-board.py` by `tools/build-api-docs.py`. Do not edit by hand — edit the source docstrings and regenerate.*\n\n## Summary\n\n```text\ncoord-board.py — the board: human transparency over agent messages (spec-board, D12).\n\nA READ MODEL over the message store, never a store. It folds every session inbox\n(`.agents/mail/<session>.jsonl`) and every ledger twin (`type: mail` records in\n`.agents/log/<session>.jsonl`) into one timeline, one row per mail id:\n\n    ts · from → to · kind · ref · age · acked?\n\nReading writes nothing (the read-rate is measured from the shell history / the session\nprofiler, not by the board). An empty corpus prints NOT CHECKED, never \"all quiet\" (R4).\nA human speaks into the same inboxes with `board post`, which goes ONLY through the message\nlayer's single writer — P4's `append_mail(root, session, entry)` in coord-mail.py, imported by\npath — so a post that bypasses the inbox writer is impossible by construction. Until that file\nlands, `--writer <path>` names a module with the same signature (the tests ship a fixture).\n\nSubcommands\n  board            print the rows (or NOT CHECKED); --json for the same rows as data\n    --follow       poll every --interval seconds (5.0) until --max-polls reads (720 = 1 h at\n                   5 s) have happened, printing only rows not yet printed; says why it stopped\n    --since <id>   rows ordered after that mail id (by ts, then id)\n    --session <s>  rows where from == s, to == s, or to == \"*\"\n  board post --to <session|*> \"<text>\" [--kind note|ruling] [--ref <ref>] [--from <session>]\n             [--writer <path>]\n\nConventions\n  --root is the `.agents` directory (default: <repo root>/.agents, the repo root found by\n  walking up from cwd to a .git file or directory — the layout coord-core.repo_root reads).\n  A root outside the repository is refused (COORD-NOT-CHECKED-ROOT, as coord-core does).\n  Python 3.8+, stdlib only. Exit 0 for every read, 2 for a refused argument or post.\n```\n\n## CLI — subcommands\n\n| Subcommand | Help |\n|---|---|\n| `board` | print the board (a read model; reading writes nothing) |\n| `post` | write a human note or ruling through the single writer |\n\n## CLI — options\n\n| Option | Help |\n|---|---|\n| `--follow` | poll until --max-polls reads |\n| `--from` | sender (default: $AGENT_SESSION or 'human') |\n| `--interval` | seconds between polls |\n| `--json` | the rows as JSON |\n| `--kind` | note (default) or ruling |\n| `--max-polls` | stop after this many reads (default 720 = 1 h at 5 s) |\n| `--ref` | the decision request a ruling answers (DR-n), or a path/id |\n| `--root` | the .agents directory (default: <repo root>/.agents) |\n| `--session` | rows from or to this session (or to '*') |\n| `--since` | rows ordered after this mail id |\n| `--to` | recipient session, or '*' |\n| `--writer` | path to the module exposing append_mail (default: sibling coord-mail.py) |\n\n## Functions\n\n### `repo_root(cwd)`\n\nThe PRIMARY checkout, from any worktree - the `.agents` stores are per repository.\n\nWalk up from cwd to the first `.git` entry. A directory is the primary itself. A FILE is a\nlinked worktree's pointer (`gitdir: <primary>/.git/worktrees/<name>`), so the primary is\nthat path's third parent. Filesystem only, no subprocess (coord-core's reasoning). Before\nthis the board resolved the NEAREST checkout and, from a worktree, read the committed ledger\ncopies and no inbox at all (class WT-A).\n\n### `resolve_root(cwd, raw)`\n\nThe .agents root, refused when it resolves outside the repository (coord-core's rule).\n\n### `read_sources(root)`\n\nReturn (inbox_lines, twins, errors, files_scanned) — every line of every source, once.\n\n### `fold(inbox, twins, now=…)`\n\nPure fold: store lines -> rows keyed by mail id. Rendering twice yields equal rows.\n\n### `apply_filters(rows, session=…, since=…, errors=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `format_row(row)`\n\nOne row, plain text, no colour-only meaning: the ack state is a WORD beside its glyph.\n\n### `not_checked_line(root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `read_board(root, session=…, since=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_board(args, root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `new_ulid(now=…)`\n\nA 26-char Crockford-base32 ULID: 48-bit ms timestamp + 80 random bits (stdlib only).\n\n### `load_writer(path)`\n\nImport the message layer's writer module BY PATH (the file lands with P4 at the join).\n\n### `build_entry(to, body, kind, ref, sender, now=…)`\n\n**Coverage gap** — no docstring in the source.\n\n### `cmd_post(args, root)`\n\n**Coverage gap** — no docstring in the source.\n\n### `build_parser()`\n\n**Coverage gap** — no docstring in the source.\n\n## Coverage\n\n- Public functions: **14** · documented: **7** (**50%**)\n- Undocumented (recorded, not invented): `apply_filters`, `not_checked_line`, `read_board`, `cmd_board`, `build_entry`, `cmd_post`, `build_parser`\n\n"
