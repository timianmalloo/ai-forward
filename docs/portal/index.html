<!doctype html>
<html lang="en" data-theme="dark" data-motion="full">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI-Forward — Documentation</title>
<!--
  The Documentation Portal shell (spec-documentation-portal). Committed + stable.
  It loads ./portal-data.js (window.PORTAL_DATA), which is GENERATED by tools/build-docs-portal.py
  from committed pack sources and re-run by sync-pack.ps1, so the content cannot drift.
  Self-contained, dependency-free, opens over file://. Tokens: docs/DESIGN.md (AA-audited).
-->
<style>
  :root{
    --canvas:#3d3b3a; --surface:#343231; --surface-2:#2c2a29;
    --ink:#dedede; --ink-mute:#a8a8a8; --reduced:#b0b0b0; --hairline:#888684;
    --primary:#fd8ea1; --on-primary:#1a1a1a; --focus:#62b0ff;
    --success:#4ade80; --warning:#fbbf24; --danger:#ff9191;
    --sp-2:4px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:24px; --sp-7:32px; --sp-8:48px;
    --r-sm:5px; --r-md:8px; --r-lg:12px; --r-pill:9999px;
    --fast:120ms; --ease:cubic-bezier(0.2,0,0,1); --ring:3px; --ring-off:2px; --target:44px;
    --font:"Segoe UI",Aptos,Calibri,system-ui,sans-serif; --serif:"Iowan Old Style",Palatino,Georgia,serif;
    --mono:Consolas,"Courier New",monospace;
    --el-panel:0 8px 28px rgba(0,0,0,0.28);
    --nav-w:264px; --measure:74ch;
  }
  html[data-theme="light"]{--canvas:#f7f4ef;--surface:#fcfbf8;--surface-2:#efece6;--ink:#242424;--ink-mute:#5c5c5c;--reduced:#6f6f6f;--hairline:#8a8886;--primary:#b11f4b;--on-primary:#fff;--focus:#006cbe;--success:#146c2e;--warning:#8a4b08;--danger:#b3261e;--el-panel:0 8px 28px rgba(0,0,0,0.06)}
  html[data-theme="hc"]{--canvas:#000;--surface:#000;--surface-2:#000;--ink:#fff;--ink-mute:#fff;--reduced:#fff;--hairline:#fff;--primary:#ff0;--on-primary:#000;--focus:#ff0;--success:#0f0;--warning:#ff0;--danger:#ff8080;--el-panel:none}
  html[data-motion="reduced"] *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;display:flex;flex-direction:column}
  :focus-visible{outline:var(--ring) solid var(--focus);outline-offset:var(--ring-off)}
  a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
  .mono{font-family:var(--mono);font-size:max(0.85em,11px)}
  .skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--primary);color:var(--on-primary);padding:8px 14px;border-radius:var(--r-sm)}
  .skip:focus{left:8px}
  .topbar{position:sticky;top:0;z-index:20;display:flex;gap:var(--sp-5);align-items:center;padding:var(--sp-4) var(--sp-6);background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--hairline);flex-wrap:wrap}
  .topbar .logo{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
  .topbar .tag{color:var(--ink-mute);font-size:13px;border-left:1px solid var(--hairline);padding-left:var(--sp-5)}
  .topbar .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:6px 14px;min-width:200px}
  .topbar .search input{background:transparent;border:0;color:var(--ink);font-size:13px;width:100%;outline:none}
  .topbar .search .k{font-family:var(--mono);font-size:11px;color:var(--ink-mute);border:1px solid var(--hairline);border-radius:4px;padding:0 5px}
  .seg{display:inline-flex;border:1px solid var(--hairline);border-radius:var(--r-sm);overflow:hidden}
  .seg button{background:var(--surface);color:var(--ink);border:0;border-right:1px solid var(--hairline);padding:6px 10px;font-size:12px;min-height:32px;cursor:pointer}
  .seg button:last-child{border-right:0}.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);font-weight:600}
  .shell{flex:1 1 auto;display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:0}
  nav.rail{border-right:1px solid var(--hairline);background:var(--surface);padding:var(--sp-5) var(--sp-4);overflow:auto}
  .navselect{display:none;padding:var(--sp-4) var(--sp-6) 0}
  .navselect select{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--hairline);border-radius:var(--r-md);padding:10px;font-size:14px;min-height:var(--target)}
  .rail .sec{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:var(--r-md);padding:10px 12px;color:var(--ink);font-size:14px;cursor:pointer;min-height:var(--target)}
  .rail .sec:hover{background:var(--surface-2)}
  .rail .sec[aria-current="true"]{background:var(--surface-2);color:var(--primary);font-weight:700;box-shadow:inset 3px 0 0 var(--primary)}
  .rail .sec .n{font-family:var(--mono);font-size:11px;color:var(--ink-mute);width:16px}
  main{overflow:auto;padding:var(--sp-7) var(--sp-8) var(--sp-8)}
  .content{max-width:960px}
  .lede-h{font-family:var(--serif);font-size:clamp(26px,4vw,36px);line-height:1.12;letter-spacing:-.4px;margin:0 0 var(--sp-4)}
  .lede{font-size:18px;color:var(--ink-mute);max-width:var(--measure);margin:0 0 var(--sp-7)}
  h2.band{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--primary);margin:var(--sp-8) 0 var(--sp-4);font-weight:700}
  h2.band:first-child{margin-top:0}
  h3{font-size:21px;margin:var(--sp-6) 0 var(--sp-3);letter-spacing:-.2px}
  p{max-width:var(--measure)}
  .counts{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin:0 0 var(--sp-6)}
  .stat{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);min-width:96px}
  .stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;font-family:var(--serif)}
  .stat span{font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--sp-4)}
  .cap{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:var(--sp-5)}
  .cap h4{margin:0 0 6px;font-size:15px}.cap p{margin:0;font-size:13.5px;color:var(--ink-mute)}
  .group-band{display:flex;align-items:center;gap:12px;margin:var(--sp-7) 0 var(--sp-4)}
  .group-band .gt{font-size:15px;font-weight:700}.group-band .gl{flex:1 1 auto;height:1px;background:var(--hairline)}.group-band .gc{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
  .skill{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:var(--sp-5) var(--sp-6);margin-bottom:var(--sp-4);box-shadow:var(--el-panel)}
  .skill .cmd{font-family:var(--mono);font-size:15px;color:var(--primary);font-weight:700}
  .skill .desc{margin:6px 0 var(--sp-4);color:var(--ink)}
  .skill .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-4) var(--sp-6);font-size:13px}
  .skill .meta .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-mute);display:block;margin-bottom:2px}
  .skill .meta .v{color:var(--reduced)}
  .skill .src{margin-top:var(--sp-4);font-size:12px}.skill .src a{font-family:var(--mono);font-size:11.5px}
  .stack .std{display:grid;grid-template-columns:170px 1fr;gap:var(--sp-5);padding:var(--sp-4) 0;border-top:1px solid var(--hairline)}
  .stack .std:first-child{border-top:0}.stack .std .sn{font-family:var(--mono);font-size:12px;color:var(--primary)}.stack .std .sd{font-size:13.5px;color:var(--ink-mute);margin:0}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:var(--sp-3)}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--hairline);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-mute)}td .mono{color:var(--primary)}
  /* Veto strength is the one thing in the persona table that must read at a glance, so it is
     encoded in form as well as in the word — a hard veto blocks, the others advise. */
  .vb{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.4px;
      text-transform:uppercase;padding:2px 7px;border-radius:var(--r-pill);border:1px solid currentColor;white-space:nowrap}
  .vb.hard{color:var(--danger)}.vb.soft{color:var(--warning)}.vb.advisory{color:var(--ink-mute);font-weight:600}
  .reflink{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);display:block;margin-top:6px}
  .lensrow{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-top:4px}
  .callout-note{background:var(--surface);border-left:3px solid var(--primary);border-radius:0 var(--r-md) var(--r-md) 0;
    padding:12px 16px;margin:14px 0;max-width:var(--measure)}
  .callout-note p{margin:0;font-size:13.5px;color:var(--ink-mute)}
  .tells{max-width:var(--measure);margin:var(--sp-3) 0 0;padding-left:1.1em}
  .tells li{font-size:13.5px;color:var(--ink-mute);margin:.3em 0}
  ol.steps{counter-reset:s;list-style:none;padding:0;margin:0;max-width:var(--measure)}
  ol.steps li{counter-increment:s;position:relative;padding:0 0 var(--sp-6) var(--sp-8);border-left:1px solid var(--hairline);margin-left:16px}
  ol.steps li:last-child{border-left-color:transparent}
  ol.steps li::before{content:counter(s);position:absolute;left:-16px;top:-2px;width:32px;height:32px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--primary);color:var(--primary);font-family:var(--serif);font-weight:700;display:flex;align-items:center;justify-content:center}
  ol.steps li h4{margin:0 0 4px;font-size:15px}ol.steps li p{margin:0 0 8px;color:var(--ink-mute);font-size:14px}
  code.cmd{font-family:var(--mono);font-size:13px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:2px 8px;color:var(--ink);display:inline-block}
  .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--sp-8);color:var(--ink-mute);gap:var(--sp-3);min-height:340px}
  .ph .big{font-size:17px;color:var(--ink);font-weight:600}.ph.err .big{color:var(--danger)}
  .ph code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:2px 7px;border-radius:var(--r-sm);color:var(--ink)}
  .comingsoon{background:var(--surface);border:1px dashed var(--hairline);border-radius:var(--r-lg);padding:var(--sp-6);color:var(--ink-mute);font-size:14px}
  .linkout{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);display:flex;gap:var(--sp-4);align-items:baseline;margin-bottom:var(--sp-3);flex-wrap:wrap}
  .linkout .lname{font-weight:700;min-width:140px}
  .graphwrap{display:grid;grid-template-columns:1fr 300px;gap:var(--sp-5);align-items:start}
  @media(max-width:1000px){.graphwrap{grid-template-columns:1fr}}
  .graphbox{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:auto;max-height:68vh}
  .graphbox svg{display:block}
  .gnode{cursor:pointer}.gnode rect{stroke:var(--hairline);stroke-width:1}.gnode text{font-size:10px;fill:var(--ink);pointer-events:none}
  .gnode.dim{opacity:.22}.gnode.sel rect{stroke:var(--focus);stroke-width:2.5}
  .gedge{stroke:var(--hairline);stroke-width:1;fill:none;opacity:.3}.gedge.hot{stroke:var(--primary);opacity:.95;stroke-width:1.6}.gedge.dim{opacity:.05}
  .glegend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--sp-4)}
  .glegend button{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:4px 10px;font-size:11px;color:var(--ink-mute);cursor:pointer;min-height:30px}
  .glegend button[aria-pressed="true"]{color:var(--ink);border-color:var(--primary)}
  .glegend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
  .ginspect{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:var(--sp-5)}
  .ginspect .gt{font-family:var(--mono);font-size:11px;color:var(--primary)}
  .ginspect h4{margin:6px 0 8px;font-size:16px}.ginspect .gs{font-size:13px;color:var(--ink-mute);margin:0 0 12px}
  .ginspect .nb{font-size:12px;margin:3px 0}.ginspect .nb a{cursor:pointer}.ginspect .rel{font-family:var(--mono);color:var(--ink-mute);font-size:10px;text-transform:uppercase}
  .glist details{margin:6px 0}.glist summary{cursor:pointer;font-size:13px;font-weight:600;min-height:30px}
  .glist a{display:block;font-size:12.5px;padding:3px 0 3px 16px;color:var(--ink-mute);cursor:pointer;min-height:24px}
  .glist a:hover{color:var(--ink)}
  @media (max-width:860px){
    .shell{grid-template-columns:1fr} nav.rail{display:none} .navselect{display:block}
    .topbar .tag{display:none} main{padding:var(--sp-6)}
  }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div class="topbar">
  <span class="logo">AI-Forward</span>
  <span class="tag" id="tagline">Documentation</span>
  <span class="search"><input id="q" type="search" placeholder="Search skills &amp; sections…" aria-label="Search" /><span class="k">/</span></span>
  <span class="seg" id="h-theme" role="group" aria-label="Theme"><button data-theme="dark" aria-pressed="true">Dark</button><button data-theme="light" aria-pressed="false">Light</button><button data-theme="hc" aria-pressed="false">HC</button></span>
  <span class="seg" id="h-motion" role="group" aria-label="Motion"><button data-motion="full" aria-pressed="true">Motion</button><button data-motion="reduced" aria-pressed="false">Reduced</button></span>
</div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <div class="navselect"><select id="navsel" aria-label="Section"></select></div>
  <main id="content" tabindex="-1"><div class="content" id="pane"></div></main>
</div>
<script src="./portal-data.js" onerror="window.__PORTAL_ERR=true"></script>
<script>
const D=window.PORTAL_DATA||null;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let state={section:"start",q:""};
const rail=document.getElementById("rail"),navsel=document.getElementById("navsel"),pane=document.getElementById("pane");
if(D&&D.meta){document.getElementById("tagline").textContent="a methodology pack for directing coding agents — "+D.meta.counts.personas+" persona lenses · "+D.meta.counts.skills+" skills";}

function renderNav(){
  if(!D||!D.sections)return;
  rail.innerHTML=D.sections.map(s=>`<button class="sec" data-sec="${s.id}" aria-current="${state.section===s.id}"><span class="n">${s.n}</span>${esc(s.title)}</button>`).join("");
  navsel.innerHTML=D.sections.map(s=>`<option value="${s.id}" ${state.section===s.id?"selected":""}>${s.n}. ${esc(s.title)}</option>`).join("");
  rail.querySelectorAll(".sec").forEach(b=>b.addEventListener("click",()=>{state.section=b.dataset.sec;render();}));
  navsel.onchange=e=>{state.section=e.target.value;render();};
}
function render(){
  if(window.__PORTAL_ERR||!D){pane.innerHTML=errorBody();return;}
  renderNav();
  pane.innerHTML=({start:secStart,caps:secCaps,skills:secSkills,agents:secAgents,coord:secCoord,loop:secLoop,budget:secBudget,foundations:secFoundations,ui:secUi,architecture:secArchitecture,systems:secSystems,graph:secGraph,ref:secRef}[state.section]||secStart)();
  if(state.section==="graph"){drawGraph();}
  const c=document.getElementById("content");c.focus({preventScroll:true});c.scrollTop=0;
}
function errorBody(){return `<div class="ph err"><span class="big">Documentation data is missing</span><p><code>portal-data.js</code> did not load.</p><p>Regenerate with <code>python tools/build-docs-portal.py</code>, then reopen this page.</p></div>`;}
function secStart(){
  return `<h1 class="lede-h">Get started in ${D.gettingStarted.length} steps</h1><p class="lede">${esc(D.meta.whatIs)}</p>
    <ol class="steps">${D.gettingStarted.map(s=>`<li><h4>${esc(s.h)}</h4><p>${esc(s.p)}</p>${s.cmd?`<code class="cmd">${esc(s.cmd)}</code>`:""}</li>`).join("")}</ol>`;
}
function secCaps(){
  const c=D.meta.counts;
  return `<h1 class="lede-h">What it can do</h1><p class="lede">${esc(D.meta.whatIs)}</p>
    <div class="counts">${[["skills","skills"],["personas","personas"],["knowledge","knowledge docs"],["templates","templates"],["scripts","scripts"]].map(([k,l])=>`<div class="stat"><b>${c[k]}</b><span>${l}</span></div>`).join("")}</div>
    <div class="grid">${D.capabilities.map(x=>`<div class="cap"><h4>${esc(x.h)}</h4><p>${esc(x.p)}</p></div>`).join("")}</div>`;
}
function secSkills(){
  const q=state.q.toLowerCase();
  let groups=D.skills.map(g=>({group:g.group,items:g.items.filter(it=>!q||(it.cmd+" "+it.desc+" "+it.when).toLowerCase().includes(q))})).filter(g=>g.items.length);
  const total=D.skills.reduce((n,g)=>n+g.items.length,0);
  let body=`<h1 class="lede-h">The ${total} skills</h1><p class="lede">Every skill, grouped by the natural loop. Each is derived from its <span class="mono">SKILL.md</span> — this list is complete by construction and cannot drift.</p>`;
  if(!groups.length){body+=`<div class="comingsoon">No skills match "<b>${esc(state.q)}</b>". <a href="#" id="clr">Clear search</a>.</div>`;setTimeout(()=>{const c=document.getElementById("clr");if(c)c.onclick=e=>{e.preventDefault();state.q="";document.getElementById("q").value="";render();};},0);return body;}
  body+=groups.map(g=>`<div class="group-band"><span class="gt">${esc(g.group)}</span><span class="gl"></span><span class="gc">${g.items.length}</span></div>`+
    g.items.map(it=>{const nm=it.cmd.replace('/','');return `<article class="skill"><div class="cmd">${esc(it.cmd)}</div><p class="desc">${esc(it.desc)}</p>
      <div class="meta"><div><span class="k">When to use</span><span class="v">${esc(it.when)}</span></div><div><span class="k">Produces</span><span class="v">${esc(it.produces)}</span></div><div><span class="k">Hands off to</span><span class="v">${esc(it.handoff)}</span></div></div>
      <div class="src"><a href="../../pack/commands/${esc(nm)}/SKILL.md">pack/commands/${esc(nm)}/SKILL.md →</a></div></article>`;}).join("")).join("");
  return body;
}
function secUi(){
  const ex=(D.ui.examples||[]);
  return `<h1 class="lede-h">UI &amp; Design capabilities</h1><p class="lede">${esc(D.ui.intro)}</p>
    <h2 class="band">The standards stack</h2><div class="stack">${(D.ui.standards||[]).map(s=>`<div class="std"><div class="sn">${esc(s.n)}</div><p class="sd">${esc(s.d)}</p></div>`).join("")}</div>
    <h2 class="band">The /ui-design workflow</h2><p>${esc(D.ui.stages)}</p>
    ${ex.length?`<h2 class="band">UX &amp; UI examples</h2><p class="lede" style="font-size:15px">${esc(D.ui.examplesIntro||"")}</p>
      ${ex.map(e=>`<article class="skill"><div class="cmd" style="font-size:14px">${esc(e.title)}</div><p class="desc" style="margin:6px 0 10px">${esc(e.summary)}</p><div class="src"><a href="${esc(e.path)}">${esc(e.path)} →</a></div></article>`).join("")}`:""}
    <p style="margin-top:16px"><a href="${esc(D.ui.guideLink||"../ui-guide.html")}">Open the full UI Guide →</a> · <a href="../DESIGN.md">docs/DESIGN.md (the design language)</a></p>`;
}
function secFoundations(){
  const f=D.foundations||{groups:[]};
  return `<h1 class="lede-h">Foundations</h1><p class="lede">${esc(f.intro||"")}</p>
    ${f.groups.map(g=>`<div class="group-band"><span class="gt">${esc(g.group)}</span><span class="gl"></span><span class="gc">${g.items.length}</span></div>
      ${g.items.map(it=>`<article class="skill"><div class="cmd" style="font-size:14px">${esc(it.title)}</div><p class="desc" style="margin:6px 0 10px">${esc(it.summary)}</p><div class="src"><a href="${esc(it.path)}">pack/knowledge/${esc(it.name)}.md →</a></div></article>`).join("")}`).join("")}`;
}
function secArchitecture(){
  const a=D.architecture||{groups:[]};
  return `<h1 class="lede-h">Architecture</h1><p class="lede">${esc(a.intro||"")}</p>
    ${a.groups.map(g=>`<div class="group-band"><span class="gt">${esc(g.group)}</span><span class="gl"></span><span class="gc">${g.items.length}</span></div>
      ${g.items.map(it=>`<article class="skill"><div class="cmd" style="font-size:14px">${esc(it.title)}</div><p class="desc" style="margin:6px 0 10px">${esc(it.summary)}</p><div class="src"><a href="${esc(it.path)}">${esc(it.path.replace("../../",""))} →</a></div></article>`).join("")}`).join("")}`;
}
function secSystems(){

const GTYPE_COLORS={knowledge:"#7ee0c0",spec:"#6ea8fe",architecture:"#f0a65a",adr:"#fbbf24",design:"#c79bf2","design-language":"#d4a5c9",doc:"#9aa3b2",glossary:"#5ec5d4","decision-note":"#a8e06e","proof-pack":"#f2836b","threat-model":"#ff9191","privacy-review":"#ffb37a",index:"#b0b0b0"};
function gcolor(t){return GTYPE_COLORS[t]||"#9aa3b2";}
let gState={sel:null,typeFilter:null};
function secGraph(){
  const g=D.graph||{nodes:[],edges:[],types:[]};
  if(!g.nodes.length){return `<h1 class="lede-h">Knowledge graph</h1><div class="comingsoon">The graph is empty or <code>docs-index.js</code> was unavailable at generation. Run <code>python docs/ai-forward-pack/scripts/docs-graph.py derive</code> then regenerate the portal.</div>`;}
  const legend=g.types.map(t=>`<button class="glegend-b" data-gt="${esc(t)}" aria-pressed="false"><span class="sw" style="background:${gcolor(t)}"></span>${esc(t)} (${g.nodes.filter(n=>n.type===t).length})</button>`).join("");
  const list=g.types.map(t=>`<details class="gd"><summary>${esc(t)} (${g.nodes.filter(n=>n.type===t).length})</summary>${g.nodes.filter(n=>n.type===t).map(n=>`<a data-gsel="${esc(n.id)}">${esc(n.title)}</a>`).join("")}</details>`).join("");
  return `<h1 class="lede-h">Knowledge graph</h1>
    <p class="lede">Every artifact in the repo is a node; typed links are the edges. This is the same graph the skills traverse at grounding — ${g.nodes.length} artifacts, ${g.edges.length} links. Click a node to inspect it and its neighbours.</p>
    <div class="glegend" role="group" aria-label="Filter by type">${legend}</div>
    <div class="graphwrap">
      <div class="graphbox" id="graphbox" role="img" aria-label="Knowledge graph of ${g.nodes.length} artifacts"></div>
      <div>
        <div class="ginspect" id="ginspect"><p class="gs">Select a node to see its type, summary, and links. A screen-reader-navigable list of every node is below.</p></div>
        <div class="glist" style="margin-top:16px" aria-label="All artifacts (accessible list)">${list}</div>
      </div>
    </div>
    <p style="margin-top:16px"><a href="../index.html">Open the full Docs Explorer →</a> — the richer hierarchy / graph / mind-map / health views. Because <code>docs/</code> is a valid Obsidian vault, you can also open it in Obsidian for the native graph (see <a href="../../pack/knowledge/obsidian-lens.md">obsidian-lens</a>).</p>`;
}
function drawGraph(){
  const box=document.getElementById("graphbox"); if(!box)return;
  const g=D.graph, nodes=g.nodes, edges=g.edges, types=g.types;
  const colW=170,rowH=34,padX=20,padY=28,nW=140,nH=22;
  const pos={};
  types.forEach((t,ci)=>{let ns=nodes.filter(n=>n.type===t);ns.forEach((n,ri)=>{pos[n.id]={x:padX+ci*colW,y:padY+ri*rowH,cx:padX+ci*colW+nW/2,cy:padY+ri*rowH+nH/2};});});
  const maxRows=Math.max(...types.map(t=>nodes.filter(n=>n.type===t).length));
  const W=padX*2+types.length*colW, H=padY*2+maxRows*rowH;
  const idT=id=>(nodes.find(n=>n.id===id)||{}).title||id;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  edges.forEach((e,i)=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;const mx=(a.cx+b.cx)/2;svg+=`<path class="gedge" data-ef="${esc(e.from)}" data-et="${esc(e.to)}" d="M${a.cx},${a.cy} C${mx},${a.cy} ${mx},${b.cy} ${b.cx},${b.cy}"></path>`;});
  nodes.forEach(n=>{const p=pos[n.id];const label=n.title.length>20?n.title.slice(0,19)+"…":n.title;svg+=`<g class="gnode" data-gn="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.title)} (${esc(n.type)})"><rect x="${p.x}" y="${p.y}" width="${nW}" height="${nH}" rx="4" fill="${gcolor(n.type)}" fill-opacity="0.85"></rect><text x="${p.x+8}" y="${p.y+15}" fill="#1a1a1a">${esc(label)}</text></g>`;});
  svg+=`</svg>`;
  box.innerHTML=svg;
  const select=id=>{
    gState.sel=id;
    const nb=edges.filter(e=>e.from===id||e.to===id);
    const hot=new Set([id]); nb.forEach(e=>{hot.add(e.from);hot.add(e.to);});
    box.querySelectorAll(".gnode").forEach(el=>{const nid=el.dataset.gn;el.classList.toggle("dim",!hot.has(nid));el.classList.toggle("sel",nid===id);});
    box.querySelectorAll(".gedge").forEach(el=>{const on=(el.dataset.ef===id||el.dataset.et===id);el.classList.toggle("hot",on);el.classList.toggle("dim",!on);});
    const n=nodes.find(x=>x.id===id)||{};
    const outs=edges.filter(e=>e.from===id).map(e=>`<div class="nb"><span class="rel">${esc(e.rel)} →</span> <a data-gsel="${esc(e.to)}">${esc(idT(e.to))}</a></div>`).join("");
    const ins=edges.filter(e=>e.to===id).map(e=>`<div class="nb"><a data-gsel="${esc(e.from)}">${esc(idT(e.from))}</a> <span class="rel">→ ${esc(e.rel)}</span></div>`).join("");
    document.getElementById("ginspect").innerHTML=`<div class="gt">${esc(n.type)}</div><h4>${esc(n.title)}</h4><p class="gs">${esc(n.summary||"")}</p>${outs?`<div class="rel" style="margin:8px 0 2px">Links to</div>${outs}`:""}${ins?`<div class="rel" style="margin:8px 0 2px">Linked from</div>${ins}`:""}`;
    wireSel();
  };
  const wireSel=()=>{document.querySelectorAll("[data-gsel]").forEach(a=>a.onclick=()=>select(a.dataset.gsel));};
  box.querySelectorAll(".gnode").forEach(el=>{el.addEventListener("click",()=>select(el.dataset.gn));el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(el.dataset.gn);}});});
  document.querySelectorAll(".glegend-b").forEach(b=>b.addEventListener("click",()=>{
    const t=b.dataset.gt, on=b.getAttribute("aria-pressed")==="true";
    document.querySelectorAll(".glegend-b").forEach(x=>x.setAttribute("aria-pressed","false"));
    if(on){gState.typeFilter=null;box.querySelectorAll(".gnode").forEach(el=>el.classList.remove("dim"));box.querySelectorAll(".gedge").forEach(el=>el.classList.remove("dim"));}
    else{b.setAttribute("aria-pressed","true");gState.typeFilter=t;box.querySelectorAll(".gnode").forEach(el=>{const n=nodes.find(x=>x.id===el.dataset.gn);el.classList.toggle("dim",n.type!==t);});box.querySelectorAll(".gedge").forEach(el=>el.classList.add("dim"));}
  }));
  wireSel();
  if(gState.sel&&nodes.find(n=>n.id===gState.sel))select(gState.sel);
}

    <div class="comingsoon" style="margin-bottom:24px"><b>How this portal relates to the core knowledge.</b> ${esc(D.meta.precisionNote||"")}</div>
