  - { type: changed, area: scripts, paths: ['scripts/session-profile.py', 'scripts/pack-doctor.py', 'knowledge/communication-and-task-discipline.md', 'knowledge/instrumentation-over-inference.md', 'adapters/managed-blocks/AGENTS.block.md', 'adapters/hooks/claude-code.settings.hooks.json', 'adapters/INSTALL.md'], deploy: 'copy both scripts to docs/ai-forward-pack/scripts/ ; copy the two knowledge docs to .claude/knowledge/ and re-wrap into .github/instructions/ ; RE-PASTE the AGENTS block (one CT26 clause) ; add "showThinkingSummaries": true to .claude/settings.json ; run context-budget.py gate --update-baseline (~+700 always-on tokens for CT26 + IO14).', summary: 'REASONING VISIBILITY. Measured: readable reasoning text was 3% of billed reasoning on a GPT Copilot session, a third on a Claude session through Copilot, 0-4% in Claude Code transcripts; both providers document that no setting returns the raw chain of thought. So the profiler gains SP-17 (visible-reasoning share per family, informational - below 10% every text-derived drift judgement is Inferred) and SP-18 (intent-trace coverage: shell calls carrying a one-line description, the one reasoning trace every host records; below 90% is a finding), plus reasoning-share, effort and intent-trace columns in the compare view. CT26 makes the intent line a rule and IO14 names the proxies. pack-doctor gains `claude settings` (showThinkingSummaries). Two spikes recorded in INSTALL 1.6: Claude Code showThinkingSummaries no change: with the setting on and off, the transcript thinking block on Fable 5.1 was empty (signature only) while 102 and 129 thinking tokens were billed - the setting changes the display only where the API returns summarized thinking; Copilot OTel export carries effort + reasoning token counts, no text.' }
  - { type: added, area: skills, paths: ['commands/session-profiler/SKILL.md', 'adapters/copilot/prompts/session-profiler.prompt.md', 'scripts/session-profile.py', 'evals/cases/session-profiler-01.json', 'adapters/managed-blocks/AGENTS.block.md'], deploy: 'copy commands/session-profiler/ to .claude/skills/session-profiler/ ; copy the prompt to .github/prompts/ ; copy scripts/session-profile.py to docs/ai-forward-pack/scripts/ ; RE-PASTE the AGENTS block (Workflows 24->25, list gains session-profiler). Output lands in docs/profiles/<sp-id>/ (data, indexed by docs/profiles/PROFILES.md) and /dream mines it.', summary: 'NEW SKILL /session-profiler + session-profile.py. Instrumentation over inference pointed at the agent itself: the script reads the telemetry Claude Code (~/.claude/projects/<slug>/*.jsonl) and Copilot CLI (~/.copilot/session-store.db + session-state/<id>/events.jsonl) already write, for one or more pack-consuming repos, and emits a FINDINGS table (SP-01..SP-16 - context accretion, instruction double-load, oversized prefix, re-reads, skill re-injection, council above tier, sub-agent runaway, persona orientation reads, missing goal state, tail latency, cap firings, images/errors, hook overhead, model-family gap, concurrent sessions in one checkout, knowledge re-fetched - each with per-turn evidence and a Verified/Inferred label), a FIXES table (F-01..F-11, each naming the pack surface and the control that fails on recurrence) and a model-family x harness COMPARE view with drift indicators per turn. The skill confirms every Inferred finding against the transcript, strikes non-load-bearing ones, and hands off to /dream, /apply-learnings and /extendaibundle. Every missing measurement reads not recorded, never a plausible number. Motivating measurement: a 23-hour Copilot session in a consuming repo whose GPT turns ran a 460k-629k-token context on ~50 sequential steps each, a nine-agent council on a proposal iteration, and 70-85% of cost in cache reads of the same context. scripts 20->21, skills 24->25.' }
  - { type: changed, area: adapters, paths: ['adapters/managed-blocks/CLAUDE.block.md', 'adapters/managed-blocks/AGENTS.block.md', 'adapters/INSTALL.md', 'scripts/pack-doctor.py'], deploy: 'CLAUDE.md becomes `@AGENTS.md` (one line) + the NEW short CLAUDE.block.md addendum; delete the old copy of the full block from CLAUDE.md; keep the full block in AGENTS.md (RE-PASTE it - it gained the path legend, Tier / Fan-out cap in the goal-state bullet, two tells, and session-profiler). If the repo enforces STANDING-METHOD parity between CLAUDE.md and AGENTS.md, retire that test: the block now lives once. Copy pack-doctor.py (new `claude-md import`, `re-read guard hook`, `copilot settings` checks; the CLAUDE.md block check accepts the import form).', summary: 'CLASS CTX-B, measured: Copilot CLI loads BOTH AGENTS.md and CLAUDE.md as custom instructions (two ~58 KB <custom_instruction> blocks in one captured prefix), while Claude Code reads only CLAUDE.md and expands an `@AGENTS.md` import in place (documented). The byte-identical parity therefore paid the managed block twice on every Copilot request. Now the block lives once, in AGENTS.md, for every harness; CLAUDE.md is the import plus a four-bullet Claude Code addendum (the .github/instructions -> .claude/knowledge path map, skills + reference/ files, hooks, WT1a). pack-doctor reports a copy-beside-copy as WARN with the fix.' }
  - { type: changed, area: scripts, paths: ['scripts/context-budget.py', 'context-budget.json'], deploy: 'copy both ; run `context-budget.py prefix --update-baseline` and `context-budget.py skills --update-baseline` ONCE in the consuming repo to start the two new ratchets, and add `prefix --gate` and `skills --gate` beside `gate` in CI.', summary: 'CLASS CTX-B (the PACK-P shape again): the budget gate measured the knowledge docs (~44k est. tokens) while the assembled prefix was ~105k+, and run with default discovery from an installed repo it found the VENDORED copy (no load: frontmatter) and reported 461 tokens, green. Three fixes: (1) `prefix` measures the whole static prefix per host - AGENTS.md, CLAUDE.md (flagged as a double-load unless it is the import stub), the always-on docs, and stated tool/host allowances labelled Inferred - with its own ratchet (`prefix --gate`); (2) discovery prefers a corpus that DECLARES scope and never settles on a scope-less copy; (3) `skills` measures every SKILL.md with a per-skill ratchet and a 5,000-token ceiling for new skills (CTX-E - a skill is re-injected whole on every invocation).' }
  - { type: changed, area: knowledge, paths: ['knowledge/communication-and-task-discipline.md', 'knowledge/execution-graph-optimization.md', 'knowledge/session-worktree-discipline.md', 'knowledge/instrumentation-over-inference.md', 'knowledge/continuous-improvement.md', 'knowledge/ui-design-craft.md', 'knowledge/ui-archetype-grammar.md', 'knowledge/ui-archetype-catalog.md', 'knowledge/ui-craft-detection.md', 'knowledge/ui-visual-assets.md', 'knowledge/ui-interaction-design.md', 'knowledge/technical-ui-design.md'], deploy: 'copy all to .claude/knowledge/ verbatim ; re-wrap the always/glob docs into .github/instructions/ ; the FIVE re-scoped UI docs (ui-design-craft, ui-archetype-grammar, ui-archetype-catalog, ui-craft-detection, ui-visual-assets) MOVE from .github/instructions/ to .github/knowledge/ - delete their stale wrapped copies ; run `context-budget.py gate --update-baseline` (the always-on set grew ~900 tokens for the CT19/GO7/WT1a/IO13 text).', summary: 'CT19 now requires Tier: and Fan-out cap: in the goal state (0 at T0, 2 at T1, the GO7 cap at T2 - CLASS CTX-C, a nine-agent council on a turn that declared no tier); CT23 gains two tells and the checklist follows. GO7 gains PER-BRANCH BUDGET and CONVERGENCE CONDITION rows (CLASS CTX-F - a research sub-agent ran 123 tool calls / 3.0M tokens until the parent said converge now, twice). WT1a: a new task starts a new session and a long session compacts before it turns (CLASS CTX-A - 159k -> 564k tokens across three unrelated tasks, zero compactions). IO13 gains measure-the-whole-prefix. continuous-improvement 6.1 seeds the seven CTX classes, honestly scoped to one profiled codebase. The five UI craft docs are load: skill with a RULE INDEX each (one line per rule, read first) so the skills cite a rule id instead of reading 200 KB whole (CLASS CTX-E); ui-interaction-design (the floor) and technical-ui-design stay glob and gain the index too.' }
  - { type: changed, area: skills, paths: ['commands/ui-design/SKILL.md', 'commands/ui-design/reference/*.md', 'commands/design-slice/SKILL.md', 'commands/design-slice/reference/*.md', 'commands/implement/SKILL.md', 'commands/implement/reference/*.md'], deploy: 'copy the WHOLE skill directories to .claude/skills/<name>/ (SKILL.md alone now points at reference/flow.md and reference/definition-of-done.md, which must be beside it).', summary: 'PROGRESSIVE DISCLOSURE for the three largest skills (31, 30 and 26 KB). SKILL.md keeps the contract - identity, spine, grounding, input, cast, a one-line-per-stage outline, output, the DoD count and gist, discoverability, audit, handoff; the full stage text and the full exit-gate checklist moved verbatim to reference/flow.md and reference/definition-of-done.md (ui-design also reference/triggered-standards.md), read at the stage that needs them. Nothing was deleted or reworded. Why: a skill is re-injected WHOLE on every invocation and the profiled session invoked ui-design six times (CLASS CTX-E). sync-pack now copies skill directories recursively.' }
  - { type: added, area: hooks, paths: ['adapters/hooks/reread-guard.py', 'adapters/hooks/copilot.ai-forward-hooks.json', 'adapters/hooks/claude-code.settings.hooks.json', 'adapters/hooks/README.md'], deploy: 'copy reread-guard.py and README.md to docs/ai-forward-pack/hooks/ ; copy copilot.ai-forward-hooks.json to .github/hooks/ai-forward.json (Copilot CLI loads it from the repo) ; merge the hooks object from claude-code.settings.hooks.json into .claude/settings.json (create the file if absent). On Windows the Claude Code command says python; on Linux/macOS change it to python3 (INSTALL 0).', summary: 'THE RE-READ GUARD (CLASS CTX-D): one stdlib script with two host adapters that runs at the pre-tool-use seam, counts identical reads per turn, and adds a WARNING to the model context on the third identical read and on any paged tool output viewed whole; resets at the prompt boundary; warns, never blocks; fail-open on every error path (a preToolUse hook that exits non-zero DENIES the call on Copilot, so it never does). Contracts established from the hosts own docs and a captured event stream: Claude Code stdin {hook_event_name, session_id, tool_name, tool_input} / stdout hookSpecificOutput.systemMessage; Copilot CLI stdin {sessionId, toolName, toolArgs} / stdout additionalContext. Measured origin: public.html viewed 4x in three minutes, a 43 KB paged output viewed whole twice, one sub-agent reading a mockup 6x.' }
