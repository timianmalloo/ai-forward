  # ---- Prior revisions ----

  - { type: changed, area: scripts, paths: ['scripts/context-budget.py', 'context-budget.json', 'knowledge/instrumentation-over-inference.md'], deploy: 'copy scripts/context-budget.py to docs/ai-forward-pack/scripts/ and context-budget.json to docs/ai-forward-pack/ ; copy the knowledge doc to .claude/knowledge/ and re-wrap into .github/instructions/. Update any CI step or local gate that passed --ceiling to call `context-budget.py gate` with no argument.', summary: 'FR-073 - the rev-58 context budget was the RIGHT MEASUREMENT behind the WRONG INSTRUMENT. A fixed 45,000-token ceiling left 3% headroom once IO13 and GO19 were added, so the next ordinary paragraph would have failed the build for a reason unrelated to the defect it gates. A ceiling is silent through an entire accumulation and then fires on something innocent, which trains the reflex - just raise the ceiling - that PACK-R exists to break. Replaced with a RATCHET: pack/context-budget.json records the baseline (43,708) and the gate fails only when the always-on set grows past it (2% tolerance) without that baseline moving. Growth stays allowed and cheap - `gate --update-baseline` is one line - but never invisible, because the reviewer sees the number change in the diff. The ratchet also reports when the set has SHRUNK enough to be lowered, so it cannot become a high-water mark. An absolute backstop survives behind it at 60,000, DERIVED rather than chosen: smallest supported window 128,000 - tool definitions 24,070 - required working headroom 44,000, so passing it is a decision about which models can still be delegated to. PACK-R carries a control-revision note, and the generalisation is recorded: for any ACCUMULATION defect, gate the delta against a recorded baseline rather than the absolute against a guessed limit.' }
  - { type: changed, area: knowledge, paths: ['knowledge/*.md (all 38 non-manifest docs)', 'scripts/context-budget.py', 'scripts/audit-log.py', 'adapters/claude-code/agents/*.md', 'adapters/copilot/agents/*_agent.md', 'knowledge/persona-audit.md', 'knowledge/execution-graph-optimization.md', 'knowledge/instrumentation-over-inference.md', 'knowledge/FOUNDATION.md', 'adapters/managed-blocks/AGENTS.block.md'], deploy: 'copy all knowledge docs to .claude/knowledge/ VERBATIM (they now carry load: frontmatter); re-wrap ONLY the always/glob docs into .github/instructions/ using each doc's own declared applyTo, STRIPPING the source frontmatter rather than prepending over it; copy the skill/reference docs to the NEW .github/knowledge/ directory verbatim; copy scripts/context-budget.py and scripts/audit-log.py to docs/ai-forward-pack/scripts/; copy all agent files to .claude/agents/ and .github/agents/; RE-PASTE the AGENTS.md managed block. Add .github/knowledge/ to any drift-gate path list.', summary: 'FR-072 - LOAD-SCOPE TIERING. A profiled consuming-repo session showed the always-on instruction set had become the static prefix of every model call: 37 of the 39 files in knowledge/ shipped applyTo: "**", making a ~184,000-token corpus the prefix of all 484 calls (63.3% of every main-thread input token was the same text re-read), and exceeding a flash-class context window outright - failing 27 of 39 delegated runs on the model that cost 0.1% of spend. Eight changes: (P1) every knowledge doc DECLARES load: always|glob|skill|reference and sync routes on the declaration instead of hardcoding "**" - always-on drops from the whole set (~184K tokens) to 13 docs (~43.7K), nothing deleted; (P2) new scripts/context-budget.py plus gate 8 of verify-bundle.ps1 and a required CI step fail the build when the always-on total passes a declared ceiling (45,000) or when any doc declares no scope; (P3) all 23 personas declare the knowledge: lens they need, so a sub-agent inherits its lens rather than the world (widest lens now 62% of the main threads set; the-simplifier 10.1K vs 42.6K); (P4) the LOA Part IV Pattern Catalog (63,831 chars, a lookup surface inside a linearly-read document) extracted verbatim to docs/knowledge/layered-optimized-architecture/pattern-catalog.md - ui-archetype-catalog was deliberately NOT split, being irreducibly a catalog, and is scoped instead; (P5) context-budget.py preflight refuses a fan-out that cannot fit a target window BEFORE dispatch; (P6) audit-log.py --persona-yield + the yield lens + persona-audit.md 8.7a make repeat convocation of an ADVISORY persona conditional on an accepted finding, hard-veto lenses never gated; (P7) new GO19 allocates the model tier per PHASE and re-allocates at each boundary - the premium tier does not run through a high-iteration deploy loop; (P8) audit-log.py --agent-run records per-run wall-clock SPANS and computes union-span/speedup/peak-concurrency, so fan-out is measured rather than asserted (the source profile claimed parallelism its own numbers could not support). New knowledge: IO13. New defect classes PACK-R (a fixed prefix sized by what fits rather than what each call needs), PACK-S (a fan-out rediscovering per-run what was knowable once) and PACK-T (a generator prepending metadata over a source that already had it - which had shipped two stacked frontmatter blocks in session-worktree-discipline.instructions.md). Vendored-doc divergences recorded in FOUNDATION.md and hashes refreshed.' }
  - { type: changed, area: knowledge, paths: ['templates/proof-pack.template.md', 'knowledge/end-to-end-integrity.md', 'knowledge/instrumentation-over-inference.md'], deploy: 'copy templates/proof-pack.template.md to docs/ai-forward-pack/templates/ ; copy the two knowledge docs to .claude/knowledge/ and re-wrap into .github/instructions/.', summary: 'TIER-2 of docs/proposals/prose-to-structure-review.html (design docs/design/tier2-proof-pack-sections.md): give E7/E8 (change-surface list + writer/compute-reader trace) and IO2 (operator questions) a STRUCTURED HOME as OPT-IN Proof-Pack sections. proof-pack.template.md gains one opt-in H2 "Change reach & instrumentation" with two subsections - change-surface completeness (a per-surface reached/where table with the canonical store->model->service->projection/wire->client->UI->compute-reader path as an ADAPTABLE default, plus a per-field writer/compute-reader trace) and operator questions instrumented (a question->emitting-source->observed table) - both following the template existing "delete if not applicable" pattern so they cost nothing on a change that does not trigger them. DELIBERATELY NOT A GATE OR A LINT: unlike Tier-1 (marker fields are identical everywhere, so a lint cannot false-positive), E7 states "the list differs per architecture", so a mechanically-enforced surface checklist would false-positive on every project whose layers differ - the correct checkable surface is the committed T1/T2 Proof Pack a reviewer reads, not a mandatory block. No test that merely re-asserts the template contains the section (prevents no real failure - CT15/Coverage Theater); the pilot evidence is whether a real /implement run catches a miss (E2E-A/DM-C shapes). E7 and IO2 each gain a one-line pointer to the section. Promotion path: pilot on 1-2 field-changing /implement runs, promote opt-in->standard only if it catches a miss - the same measure-the-skip-then-promote loop that justified CT19 and Tier-1. No count changes (template edited, not added).' }
  - { type: added, area: scripts, paths: ['scripts/marker-lint.py', 'knowledge/no-guessing-protocol.md', 'knowledge/solution-selection-ladder.md'], deploy: 'copy scripts/marker-lint.py to docs/ai-forward-pack/scripts/ ; copy the two knowledge docs to .claude/knowledge/ and re-wrap into .github/instructions/.', summary: 'MARKER COMPLETENESS LINT (Tier-1 of docs/proposals/prose-to-structure-review.html; design docs/design/marker-completeness-lint.md). Promotes the assume: (NG4) and simplify: (L5) inline markers from PROSE-ONLY field specs to an ENFORCED field-completeness contract, the same prose->structure move CT19 made for the goal-state opening. NEW scripts/marker-lint.py (stdlib, the sibling of design-lint.py) classifies every simplify:/assume:/ponytail: marker and flags the rot the directives already name: simplify-no-trigger (L5/L6 "a marker that names no trigger silently becomes permanent"), assume-no-confirm and assume-no-consequence (NG4 "a marker without a confirmation route and a consequence is not a marker"). DESIGN DECISION grounding changed (E15): the proposal sketched a rigid multi-line label syntax, but the existing harvest regex captures only a marker first line and the canonical NG4 assume: marker spans three lines, so a label syntax would break the regex and every existing free-prose marker; the lint instead checks for the SEMANTIC COMPONENTS (a trigger / a confirm cue / a consequence cue, word-boundary matched so "if" inside "verify" never counts) that the existing markers already carry - backward-compatible. Posture is WARN-ON-LEGACY (V16a / the docs-graph --gate pattern): default reports + exits 0 (grandfathers legacy), --gate exits 1, --json for machines; a clean scan of a non-empty corpus says so (E14). NOT wired as a hard verify-bundle gate (warn-not-fail, and it must not flag the directive examples). NG4/L5/L6 gain the one-line reference to the command; L6 the harvest is now the "first-class command" it named as the follow-up. Assembles the multi-line marker block (marker line + continuation comment lines, stopping at first code line or next marker); tested red-first by test_marker_lint.py (12 tests incl. word-boundary, continuation-stop, gate exit codes, empty-vs-clean). scripts 18->19.' }
  - { type: changed, area: knowledge, paths: ['scripts/audit-log.py', 'knowledge/communication-and-task-discipline.md', 'knowledge/persona-audit.md', 'adapters/managed-blocks/CLAUDE.block.md', 'adapters/managed-blocks/AGENTS.block.md'], deploy: 'copy scripts/audit-log.py to docs/ai-forward-pack/scripts/ ; copy the two knowledge docs to .claude/knowledge/ and re-wrap into .github/instructions/ ; RE-PASTE both managed blocks (the two-step-front-matter bullet CT range 24->25)', summary: 'AGENT FOCUS & SCOPE CONTROLS (from docs/proposals/agent-focus-tightening.html, grounded in docs/knowledge/agent-focus-and-scope-control/ and spec/design docs/specs+design/agent-focus-controls.md). Three controls tightening extended-reasoning models to the task, addressing the drm-0008 corpus finding that 78% of substantive turns record NO goal-state. FC-2 promotes the CT19 goal-state opening from PROSE TO STRUCTURE - a fixed three-field block (Goal/Done-when/Not-in-scope) mapped 1:1 to the audit goal/done_when fields so presence is MECHANICALLY DETECTABLE by selfcheck and the /dream PACK-O miner. FC-1 adds CT25 the BOUNDED CLOSING SELF-ASSESSMENT (one pass: confirm each substantive turn recorded a goal-state, map work to Done-when, diff Not-in-scope, then STOP - a second reflection round is the degenerating-reasoning trap that manufactures ceremony) plus its rung-2 mechanical aid: NEW audit-log.py selfcheck --session command (deterministic, stdlib, reuses read_log + a shared PACKO_SUBSTANTIVE set) reporting goal-state presence gaps + done_when->summary review pairs, NEVER a scope verdict; tested red-first by test_audit_selfcheck.py. FC-3 sharpens the Simplifier convene trigger (persona-audit §8.7) to fire on SCOPE INFLATION (a turn that touched its declared Not-in-scope or exceeded its stated Goal, esp. autopilot). Headline from the evidence base: reasoning_effort and scope-adherence are DIFFERENT levers - reducing reasoning does not reach scope drift (Latent Goal Crystallization). Deliberately NOT a new persona, NOT more prose directives, NOT an unbounded reflection loop - each would increase the ceremony targeted. knowledge_docs count unchanged (extends two existing docs); scripts add one subcommand.' }
  - { type: changed, area: scripts, paths: ['scripts/obsidian-setup.py', 'knowledge/obsidian-lens.md'], deploy: 'copy the script to docs/ai-forward-pack/scripts/ ; copy the knowledge doc to .claude/knowledge/ and re-wrap into .github/instructions/ ; a repo that already ran --init must add the rule itself and untrack what slipped through: `git rm -r --cached <vault>/.smart-env` (the ignore alone does not untrack an already-tracked path)', summary: 'PLUGIN STATE OUTSIDE .obsidian/ IS STILL PLUGIN STATE. Every GITIGNORE_RULES pattern was scoped to {vault}/.obsidian/, because that is where Obsidian itself keeps state - which made "per-user state" and "under .obsidian/" feel like one statement. They are not. Smart Connections writes its vector store to {vault}/.smart-env/, a SIBLING of .obsidian/, so every rule missed it and a consuming repo committed 268 files / 8.17 MB of embeddings with no rule firing (TheTerrace FR-371). The embeddings carry a last_embed timestamp and are rewritten on every re-embed, so they also conflict by construction between branches - derived files regenerate, they do not merge. Fixed as a RULE plus the question that generalises it: when adding a plugin, ask not "is its state under .obsidian/" but "does this plugin write derived state anywhere in the vault", answered with `git status --untracked-files=all <vault>` after a real session rather than inferred from the layout. OB4 gains the row and the reasoning.' }
  - { type: added, area: skills, paths: ['commands/code-hygiene/SKILL.md', 'commands/also/SKILL.md', 'adapters/copilot/prompts/code-hygiene.prompt.md', 'adapters/copilot/prompts/also.prompt.md', 'evals/cases/code-hygiene-01.json', 'evals/cases/also-01.json', 'adapters/managed-blocks/CLAUDE.block.md', 'adapters/managed-blocks/AGENTS.block.md'], deploy: 'copy the two new commands to .claude/skills/<name>/SKILL.md ; copy the two Copilot prompts to .github/prompts/ ; RE-PASTE both managed blocks (Skills/Workflows count 22->24 and the skill/workflow enumeration gains code-hygiene + also). Prose skill counts (22->24) were reconciled across README/OVERVIEW/INSTALL/web-explainer/copilot-instructions.', summary: 'TWO NEW SKILLS. (1) /code-hygiene (review|fix) is the operational enforcement of the coding guidelines that previously lived only as prose (HYG-A, csharp §1.6, CT18a, Simplifier L9): review DETECTS + CLASSIFIES + MEASURES dead code, commented-out code and anti-patterns into docs/hygiene/backlog.md with an aggregate of violating lines-of-code and % of codebase per class (measure-before-diagnose, deterministic detectors per language, heuristic hits labelled Inferred); fix builds docs/hygiene/remediation-plan.md whose whole design is NO REGRESSIONS — prove-before-remove, characterize-first/red-first TDD, refactor separated from behaviour change, and each removal an atomic single-class GREEN commit LABELLED (chore(hygiene): … [CLASS] + Hygiene-Class/Hygiene-Item/Hygiene-Scope trailers) so git revert/bisect/--grep remediate a regression precisely; ordered by blast radius; L4 floors never targeted; stops for human approval before executing. Cast lead The Simplifier; Test Architect + Security hold hard vetoes. (2) /also is a turn-control utility: it appends a late addition to the prior prompt WITHOUT derailing the work in flight — capture verbatim, classify (refined context vs appended task), let the current reasoning finish undisturbed, then integrate after (a contradiction of the in-flight goal is surfaced, not silently actioned; CT19-24). Exempt from the Discoverability Mandate like the other utilities. skills 22->24.' }
  - { type: changed, area: knowledge, paths: ['knowledge/csharp-style-guide.md', 'knowledge/communication-and-task-discipline.md', 'knowledge/continuous-improvement.md', 'adapters/managed-blocks/CLAUDE.block.md', 'adapters/managed-blocks/AGENTS.block.md'], deploy: 'copy the three knowledge docs to .claude/knowledge/ and re-wrap into .github/instructions/ (csharp-style-guide keeps applyTo "**/*.cs,**/*.csx") ; RE-PASTE both managed blocks (the build-discipline bullet gains a no-dead-code clause).', summary: 'DEAD / COMMENTED-OUT CODE IS FORBIDDEN IN THE TREE — new directive after the AI-DE code-graph builder surfaced large volumes of commented-out code. Commenting out while you work is a transient scratch, but the turn does NOT close with commented-out or dead code left behind: version control is the archive, not the working tree, so delete it rather than parking it in a comment. THREE places updated: (1) csharp-style-guide.md NEW §1.6 "No commented-out or dead code" (delete it; the compiler/analyzers IDE0051/IDE0052/CS0219/IDE0059 catch dead symbols), plus a Defaults row and an Enforcement bullet treating unused-code diagnostics as build errors. (2) communication-and-task-discipline.md NEW CT18a — the turn does not close with dead/commented-out code in it; cleanup is part of finishing (the E18 close), not a CT14 follow-up; sweep the class not the line (CI2). (3) continuous-improvement.md seed register gains defect class HYG-A (Commented-out or dead code left in the tree; control: delete + a commented-out-code/unused-symbol CI detector + the Simplifier `delete:` sweep). Managed blocks: the "Smallest correct (build discipline)" bullet gains a "No dead code survives the turn" clause so the rule is always-loaded and fires at turn close (CI7). Repo live register docs/lessons/defect-classes.md also gains HYG-A (uncontrolled 20->21). knowledge_docs unchanged (extends three existing docs).' }
  - { type: changed, area: coordination, paths: ['scripts/coord-core.py'], deploy: 'copy coord-core.py to docs/ai-forward-pack/scripts/.', summary: 'CROSS-SESSION COLLABORATION SECOND SLICE. `coord collaborate check` now parses the session-contract ownership tables and emits advisory `COORD-COLLAB-CROSS-OWNED-CLAIM` findings when a session claims a path owned by another role. `coord request add|list|resolve` adds an append-only seam-request workflow (`.agents/requests.jsonl`) so Core->Design requests like AI-DE §4a are structured instead of trapped in chat/prose. `coord collaborate summary [--json]` is an operator view over active sessions, findings, and open seam requests; unlike `check`, summary reports blockers while exiting 0 as a view. P12 from drm-0007 was promoted as a general fleet learning. Red-first tests: missing owner warning, missing request command, missing summary action, substring false-grant, append-only request proof, and empty-corpus semantics failed; then 14 collaboration tests and the 49-test coord-core suite passed.' }
  - { type: changed, area: coordination, paths: ['scripts/coord-core.py', 'templates/session-contract.template.md'], deploy: 'copy coord-core.py to docs/ai-forward-pack/scripts/ ; copy the new session-contract template to docs/ai-forward-pack/templates/. Existing repos should use the template for docs/collaboration/session-contracts.md when two sessions work concurrently.', summary: 'CROSS-SESSION COLLABORATION FIRST SLICE. `coord session list [--json]` now folds the append-only coordination record into active sessions with worktree, agent and live claims. `coord collaborate check [--json]` adds an operator health check for concurrent work: when multiple active sessions exist it requires a readable session contract and warns on sessions with no claims; an empty coordination corpus is a blocker, never a success-shaped OK. NEW session-contract.template.md captures the AI-DE-proven agreement shape: session roles, seam, file ownership, shared/derived/register rules, additive seam-change protocol, merge-pain rules, open requests and session responses. This addresses the cross-agent AI-DE learning (Core/Claude + Design/Copilot): registration, claims, seam contracts and append-only/derived merge policy must be written and checkable before concurrent implementation. Red-first tests: missing APIs failed, then 9 collaboration tests passed; full coord-core suite 46 tests passed. templates 27->28.' }
  - { type: changed, area: scripts, paths: ['scripts/docs-graph.py'], deploy: 'copy to docs/ai-forward-pack/scripts/. Your next `derive` will rewrite docs/docs-index.js WITHOUT the top-level "generated" field - that is the intended change; commit it. The index is still accumulated and must never be hand-seeded (V10).', summary: 'FR-068. REMOVED the wall-clock `generated` timestamp from the docs-index.js payload, making the file BYTE-STABLE across runs. It changed on every `derive`, so the index could never sit inside a drift gate - which in turn blocked FR-060: sync-pack could not regenerate the index BEFORE the portal and web index that read it, even though every skill runs `derive` as its LAST action (V10), so any skill run that added an artifact left both dependents one node behind. Attempting that ordering fix in the prior revision put docs-index.js into the drift gate and made CI permanently red; this removes the cause. The field was read by NOTHING - no consumer in docs/index.html, docs-explorer-core.js, docs/portal, build-docs-portal.py, or any test - and this is the same call the sibling generator already made and documented for web/pack-index.js (PACK-I / the FR-048 timestamp class); docs-graph.py had simply never learned it. Git records when the file changed, more reliably than a self-reported stamp. Repo-side (not deployed): sync-pack.ps1 now derives first, and check-consistency.py drift-gates BOTH derived artifacts rather than only the portal.' }
  - { type: changed, area: skills, paths: ['commands/design-slice/SKILL.md', 'adapters/copilot/prompts/design-slice.prompt.md', 'README.md', 'OVERVIEW.md', 'research-synthesis.md', 'adapters/managed-blocks/CLAUDE.block.md', 'adapters/managed-blocks/AGENTS.block.md'], deploy: 'RENAME .claude/skills/design/ to .claude/skills/design-slice/ by copying commands/design-slice/SKILL.md; REMOVE the old .claude/skills/design/ directory and .github/prompts/design.prompt.md; copy adapters/copilot/prompts/design-slice.prompt.md to .github/prompts/; re-copy updated docs and RE-PASTE managed blocks. Do not rename docs/design/ artifacts or design-language/design-lint files.', summary: 'RENAMED THE DETAILED COMPONENT DESIGN WORKFLOW from /design to /design-slice to avoid the generic Claude/agent skill namespace. The workflow behavior and output artifact path remain the same: it still produces docs/design/<component>.md from templates/design.template.md. The rename is command-surface only: commands/design -> commands/design-slice, design.prompt.md -> design-slice.prompt.md, audit examples now use --skill design-slice / design-slice-<component>, and flow references now read /define-architecture -> /design-slice -> /implement. Guardrail: docs/design/, DESIGN.md, design-language.template.md and design-lint.py are NOT renamed.' }
  - { type: added, area: native-ui, paths: ['commands/ui-design/SKILL.md', 'commands/visualize/SKILL.md', 'knowledge/ui-design-craft.md', 'knowledge/ui-visual-assets.md', 'knowledge/ui-archetype-catalog.md', 'templates/native-ui-proof-pack.template.md', 'scripts/xaml-token-lint.py'], deploy: 'copy the two commands to .claude/skills/<name>/ ; copy/wrap the three knowledge docs to .claude/knowledge/ and .github/instructions/ ; copy the new template to docs/ai-forward-pack/templates/ ; copy the new script to docs/ai-forward-pack/scripts/ ; RE-PASTE managed blocks only if your root block enumerates template/script counts manually', summary: 'NATIVE CLIENT UI FIRST SLICE. /ui-design UI-T4 now treats WPF, WinUI, Avalonia and Blazor Hybrid as native-client surfaces requiring a medium declaration, platform/HIG source, Native Desktop lens, native proof pack and runtime/platform evidence; HTML mockups and static craft scans are direction evidence only and cannot clear native PASS. /visualize now explicitly allows native-app content assets/personas/motion while rejecting generated WPF/WinUI/Avalonia screens, windows, control panels, charts, tables, menus, toolbars or icon sets as generated interfaces. ui-design-craft.md gains DX4a (license-labelled native exemplars) and DX9a (native proof beyond mockups); ui-visual-assets.md gains VA5a (native assets are content fixtures, not XAML). ui-archetype-catalog.md gains H1-H3 native rows with parseable x- facets. NEW native-ui-proof-pack.template.md records proof rows with failing condition, oracle, evidence, red-observed, confidence and residual risk. NEW xaml-token-lint.py is a stdlib deterministic first-slice linter for raw XAML/Axaml colors, brushes and dimensions. templates 26->27, scripts 17->18.' }
  - { type: added, area: scripts, paths: ['scripts/coord_ids.py', 'scripts/audit-log.py'], deploy: 'copy both to docs/ai-forward-pack/scripts/. coord_ids.py is a NEW shared module and audit-log.py now imports it; copying only one leaves the seam broken - that is PACK-D and the reason three of the new tests are parity tests.', summary: 'ALLOCATOR SEAM (expand-migrate-contract, ADR-0008). audit-log.py:next_id was the KG-B shape - max(existing)+1 over the LOCAL file only - which is why two branches that cannot see each other minted al-0203 twice and the dedupe that followed destroyed an entry. EXPAND: next_id now delegates to coord_ids.py, a new shared module imported by both audit-log.py and coord-core.py (one implementation, not two - duplicating six lines across two scripts is ONE-A). MIGRATE: new entries take a collision-proof id (48-bit ms + 80 bits os.urandom, Crockford base32); EVERY existing al-NNNN keeps its value and there is NO backfill, so nothing is guessed; both formats coexist and every reader tolerates both. CONTRACT: deliberately not now - the sequential path is retained and COORD_LEGACY_IDS=1 restores it entirely, a rollback exercised by a test rather than assumed. Verified against the real defect: a test copies the log and appends to each side independently, the actual two-branches condition, and asserts the ids differ. scripts 16->17.' }
  - { type: changed, area: knowledge, paths: ['knowledge/audit-and-change-log.md', 'knowledge/continuous-improvement.md', 'scripts/audit-log.py', 'scripts/dream.py'], deploy: 'copy the two knowledge docs to .claude/knowledge/ and re-wrap into .github/instructions/ ; copy the two scripts to docs/ai-forward-pack/scripts/ ; RE-PASTE both managed blocks (the front-matter bullet gains the AL5b logging clause)', summary: 'P2 IMPLEMENTED - PACK-O promoted from rung-3 instruction to a rung-2 control. (1) audit-log.py append gains --goal / --done-when, recorded on the entry; done_when is the mechanical PRESENCE signal (a substantive turn without it skipped the front matter CT19). Full prompt + start/end timing were already captured (AL4a). (2) NEW AL5b - a substantive interactive (non-skill) turn SHOULD append an entry recording full prompt + goal + done_when, closing the corpus-blindness gap where PACK-O lives (only skill runs were auto-logged, AL5). (3) dream.py gains a PACK-O miner (build_proposals section 5): flags substantive turns that recorded no done_when (presence - mechanical, Verified) and surfaces done_when->summary pairs for human scope-drift review (satisfaction is surfaced, never auto-judged - dream proposes, the human decides). Red-first tests: test_dream_pack_o.py (flagged-when-missing / pair-surfaced-when-clean / none-when-no-substantive-turns) + test_audit_log.py goal/done_when round-trip. PACK-O status uncontrolled -> partially-controlled in both the seed register and this repo live register; the rung-1 belt is the autopilot step cap (--max-autopilot-continues / --max-turns) from kb-agent-autopilot-controls. Implements decision 1 (log full substantive prompts + timings) and decision 2 (keep one PACK-O). knowledge_docs unchanged (extends two existing docs).' }
  - { type: changed, area: knowledge, paths: ['knowledge/communication-and-task-discipline.md', 'knowledge/continuous-improvement.md'], deploy: 'copy both to .claude/knowledge/ and re-wrap into .github/instructions/ ; RE-PASTE both managed blocks (they gain a two-step-front-matter bullet before the how-you-write bullet)', summary: 'NEW CT19-CT24 - THE TWO-STEP FRONT MATTER (universal). The pack mandated the CLOSE (CT10/E18 Completed/Remaining/Next) and never the OPEN, so a turn reported where it got to without ever stating where it was going. Now every non-trivial turn opens, BEFORE the first substantive tool call, with STEP 1 the goal state (Goal / Done when / Not in scope - a TERMINAL condition, not an aspiration; for a closed question the goal state IS the answer, met the moment it is in hand; a gap found en route is a finding CT14, never a new goal) and STEP 2 planning the whole turn with /optimize-graph ONCE across all tasks - whose GO16 Stage-0 triage means a closed question skips planning, executes and stops, so step 2 IS the termination argument rather than ceremony. It is invoked once per TURN, not wired into each of the skills - the distinction between the skill and the turn is the whole resolution of the original "should optimize-graph be the first step in each skill?" question (answer: no, the first step of each TURN). Four guard clauses: CT20 autonomy is latitude in the HOW never the WHAT (a question is not a licence to author a change); CT21 an explicit stop ends the current track and voids any agent-authored goal (asking how to proceed on the halted track is re-entry, not compliance); CT22 completion pressure is a CAP FIRING not a termination argument (GO9 applied to the turn - a harness "you have not finished" nudge carries no scope; re-read the goal state, do not obey the nudge); CT23 the tells that make the others detectable (modelled on NG3). UNIVERSAL - does not scale away at T0; only a pure conversational reply is exempt. Registers defect class PACK-O (a turn begun with no stated goal state or exit condition, so work continues until something external interrupts it) in the continuous-improvement seed register - controlled at rung 3 (always-loaded instruction), rung-2 checkable control pending the interactive-turn logging gap. Root cause per GO1: MAST largest failure category is specification, including ill-defined stopping conditions, not capability. Provenance: a session answered a precise closed question on its first tool call, then ran to an 18-file change proposal over ten more; the harness reminder was a cap firing obeyed instead of investigated. knowledge_docs unchanged (extends two existing docs).' }
  - { type: added, area: knowledge, paths: ['knowledge/session-worktree-discipline.md'], deploy: 'copy to .claude/knowledge/ and re-wrap into .github/instructions/ ; RE-PASTE both managed blocks (a new worktree bullet)', summary: 'NEW WT1-WT12 - A NEW SESSION STARTS IN A NEW WORKTREE. Two agents in one checkout share an index, a HEAD and one set of generated artifacts, so a stash in one silently reaches into the other uncommitted work and a regenerated surface is attributed to whichever session synced last - nothing fails loudly, the evidence just stops meaning what it says. So worktree-per-session is the DEFAULT unit of isolation and working in the primary checkout is a RECORDED EXCEPTION (WT4). The half that actually rots is cleanup: an isolation mechanism nobody cleans up becomes a disk of half-finished trees, one of which is eventually the only copy of some real work. Cleanup is therefore FAIL-SAFE (WT7): removable only when not primary, not your cwd, clean INCLUDING UNTRACKED (a new file nobody committed exists nowhere else), carrying no commit absent from every other ref, branch not checked out elsewhere, and session ended/stale. Anything else is REPORTED, NEVER REMOVED, with the specific reason (WT12) - a silent skip is indistinguishable from finding nothing. Deletion is opt-in (WT8, --remove) because it is irreversible and git cannot undo it, and `git worktree prune` runs so metadata matches the filesystem (WT9). Extends coord-core.py, which already owned worktree identity and one-session-per-tree occupancy, rather than adding a parallel tool.' }
  - { type: changed, area: scripts, paths: ['scripts/coord-core.py'], deploy: 'copy to docs/ai-forward-pack/scripts/', summary: 'NEW `coord worktree new|list|cleanup` implementing WT1-WT12, plus a missing `import re`. `new` creates a SIBLING tree (never nested - a tree inside the repo is walked by docs-graph, check-consistency and every test that scans), creates its branch, and registers the session; --session overrides AGENT_SESSION because `worktree new` is the FIRST command of a session. `list` shows SAFE/HELD with the reason. `cleanup` REPORTS by default and requires --remove to delete. Proven end to end on a real repo: create -> live-session HELD -> untracked-file HELD -> unmerged-commit HELD EVEN WITH --remove -> clean/merged SAFE -> reaped -> metadata pruned to zero. 13 tests against real git (D4 forbids mocking engine semantics, and unique_commits carries a spike-proven note about --all returning 0 for the exact case the guard exists to catch).' }
  - { type: changed, area: scripts, paths: ['scripts/audit-log.py'], deploy: 'copy to docs/ai-forward-pack/scripts/', summary: 'FR-052/FR-053. The system of record no longer loses data silently: read_log counted a malformed line and dropped it with a bare `pass` - no warning, no counter, no signal - in the file that IS this project durable memory and the corpus /dream mines, so a consolidation could reason over an incomplete corpus while reporting success. Now every skip is counted, warned about on stderr naming file:line, and assertable by the NEW `audit-log.py verify` (exit 1 while any line is unreadable; CI-able). A failed run-start marker write warns instead of `pass` (IO8: degrade, and SAY SO). All seven bare file handles converted to context managers - swept as a class, not the four named line numbers.' }
  - { type: changed, area: scripts, paths: ['scripts/docs-graph.py'], deploy: 'copy to docs/ai-forward-pack/scripts/', summary: 'FR-056. `validate` failed on ANY finding, so obeying the V16 propagation mandate turned CI red until every flagged owner responded - making the rational move SKIP THE PROPAGATION, which is unobservable afterwards. A control that punishes compliance manufactures invisible non-compliance. Now it separates DEFECTS (invalid frontmatter, dangling link, unregistered rel, duplicate id, orphan, index drift - all fixable by the author before pushing) which ALWAYS fail, from SUGGESTIONS (review-suggested V16, review-by decay V13 - cleared by the NEIGHBOUR owner on a human timescale) which WARN on stderr and stay in the JSON. `--gate fail` restores strictness. `freshness` has carried the same choice from the start; validate now agrees with it.' }
  - { type: changed, area: scripts, paths: ['scripts/dream.py', 'scripts/apply-learnings.py'], deploy: 'copy to docs/ai-forward-pack/scripts/', summary: 'FR-049 fallout, found BY the new tests. `l.get("control", {}).get("text")` raised an unhandled AttributeError when `control` was a bare string - crashing the tool that writes into OTHER PEOPLE repositories, possibly after it had already written plans for earlier targets. The fleet store is a plain committed JSONL anyone can hand-edit, so the string shape is reachable. New `control_text()` tolerates both shapes; the CI6 no-control guard is unchanged, only the crash is gone. The sweep found the identical line in BOTH scripts: one class, two instances (CI2). Bare write handles also converted.' }
  - { type: changed, area: scripts, paths: ['scripts/pack-doctor.py'], deploy: 'copy to docs/ai-forward-pack/scripts/', summary: 'FR-055 / class PACK-C. New `check_node_runner()`: `npm run` executes scripts through a CHILD SHELL whose PATH can differ from yours, so node resolving FOR YOU proves nothing about whether the documented command works. Observed on a real Windows host: `node --version` -> v24.18.0, `cmd /c node --version` -> not recognized, `npm run test:docs-explorer:core` -> the same failure, tests themselves 31/31 green. The probe spawns the same shell npm uses and, when only that fails, WARNs naming the invocation that does work - mirroring the python3 precedent rather than complaining.' }
  - { type: changed, area: scripts, paths: ['scripts/audit-log.py'], deploy: 'copy to docs/ai-forward-pack/scripts/ ; also add the two .gitignore lines below', summary: 'DURATION CAPTURE IS NOW DEFAULT-ON (IO1). Revision 41 added `append --started`, but an opt-in flag is not "measurable by default" - it is a measurement waiting to be forgotten, which is the very failure IO1 names. Now `audit-log.py start --session <id>` (called at grounding, AL4a) persists the run start keyed by session, and the closing `append` picks it up AUTOMATICALLY - no flag, no variable threaded through. An explicit --started still overrides. The marker store is docs/audit/.run-starts.json: ephemeral per-run state, git-ignored (add `docs/audit/.run-starts.json` and `docs/audit/.run-starts.json.tmp` to .gitignore, comments on their OWN lines - a trailing same-line comment makes a gitignore pattern match NOTHING, defect class OPS-B, and the ignore MUST be verified with `git check-ignore -v` rather than trusted). Markers auto-prune after 7 days so an abandoned run cannot attach an absurd duration to an unrelated entry, and one marker measures one run (consumed on use). Every degradation path yields NO duration rather than a wrong one (IO8): absent session, unknown session, unreadable/corrupt store, unparseable stamp, clock skew. Verified in a scratch repo: duration recorded with NO flag; second append on the same session correctly has none; unknown session no-ops without crashing.' }
  - { type: changed, area: knowledge, paths: ['knowledge/audit-and-change-log.md', 'knowledge/instrumentation-over-inference.md'], deploy: 'copy to .claude/knowledge/ and re-wrap into .github/instructions/ ; RE-PASTE both managed blocks (the instrumentation bullet now names AL4a)', summary: 'NEW AL4a - MARK THE RUN START AS THE FIRST ACTION. The Audit Mandate gains a grounding-step obligation to match its closing one: `audit-log.py start --session <id>` at grounding, so AL5 append records duration automatically. Documents WHY it is mandatory rather than nice-to-have (the log carried a single datetime for its first 750 entries, so not one measured elapsed time existed and a later analysis had to model run cost - you cannot backfill a measurement nobody took) and states the safe-degradation contract. instrumentation-over-inference.md IO5 restated around default-on rather than opt-in.' }
  - { type: added, area: knowledge, paths: ['knowledge/instrumentation-over-inference.md'], deploy: 'copy to .claude/knowledge/ and re-wrap into .github/instructions/instrumentation-over-inference.instructions.md ; RE-PASTE both managed blocks wholesale (they gain an instrumentation-over-inference bullet)', summary: 'NEW KNOWLEDGE DOC + GATE - Instrumentation over Inference (IO1-IO12). The standing bias: when you want to know how something behaves, MEASURE it, do not reason about it. An uninstrumented system does not become unknowable, it becomes one you REASON about - which is worse, because reasoning produces an answer with no error bar and no way to be surprised. Where observability-and-instrumentation.md governs the SHAPE of telemetry (OTel model, spans, error codes), this governs WHETHER THE MEASUREMENT EXISTS AT ALL, and makes it a delivery gate. Directives: IO1 a feature is not done until its behaviour is measurable BY DEFAULT (normal path, no flag, no re-run, no debugger); IO2 name the operator questions BEFORE building and give each a named emitting source; IO3 never infer a deployed system behaviour from its source - E15 pointed at runtime, with a tell-list (it should be fast / probably rare / typically about / mostly / obviously the bottleneck); IO5 instrument the AGENT OWN work too; IO6 instrument the COST axes (latency, spend/tokens, volume, failure rate) not only correctness; IO7 a modeled number is labelled Inferred, states its model, and NAMES THE GAP that forced it; IO8 degrade to not-recorded, NEVER to a plausible wrong number; IO9 close the gap when you hit it rather than modeling around it; IO10 THE DELIVERY GATE (4 conditions, satisfied by an emitting source and never by an intention to add one); IO11 instrumentation is itself verified red-first; IO12 deliberate not maximal (cardinality/cost). The worked failure is this pack own: the audit log recorded a single datetime and no duration, so 750 committed entries contained not one measured elapsed time and the optimize-graph back-test had to MODEL time and tokens. You cannot backfill a measurement nobody took. knowledge_docs 36->37.' }
  - { type: changed, area: scripts, paths: ['scripts/audit-log.py'], deploy: 'copy to docs/ai-forward-pack/scripts/', summary: 'INSTRUMENTATION FIX (IO5) - the audit log now records HOW LONG a run took, not just when it ended. New `audit-log.py start` prints an ISO-8601 UTC stamp a skill captures at grounding; `append --started <ISO>` records started_at + duration_seconds. Boundary behaviour is deliberate and tested: a missing or unparseable start yields NO duration (never a wrong one), and a start later than the end (clock skew) records an explicit duration_note instead of a negative number - IO8, degrade to not-recorded rather than to a plausible wrong value. This closes the exact gap that forced the back-test to model rather than measure.' }
  - { type: changed, area: knowledge, paths: ['knowledge/execution-graph-optimization.md'], deploy: 'copy to .claude/knowledge/ and re-wrap into .github/instructions/ ; RE-PASTE both managed blocks (the plan-the-shape bullet gains the objective ordering)', summary: 'ADDED GO4a - THE OBJECTIVE FUNCTION. Optimization is LEXICOGRAPHIC and speed is LAST: (1) completeness and rigor, (2) token cost, (3) speed - each axis optimized only subject to those above it. Trade speed for tokens; trade tokens for completeness and rigor; never trade completeness or rigor for anything. The acceptance rule for a SLOWER plan is a CONJUNCTION, not a choice: acceptable only when completeness improves AND rigor improves AND tokens fall; if any one fails to improve the slower plan is rejected, because a slowdown not fully paid for on every higher-ranked axis is waste. Corollary that catches the common error: slower-while-all-three-unchanged is PURE LOSS, and independence alone never justifies widening a graph. Backed by a measurement taken in this repo (docs/plans/optimize-graph-live-01.md): three genuinely independent verification gates parallelised ran 19 pct SLOWER (0.84x) because one gate was 83 pct of the work (ceiling only 1.20x, not 3x) and process fan-out overhead was ~2x the entire available gain. Prime directive 1 restated; the skill, the Copilot prompt and both managed blocks updated.' }
  - { type: changed, area: skills, paths: ['commands/implement/SKILL.md'], deploy: 'copy to .claude/skills/implement/', summary: 'Definition of done gains the INSTRUMENTATION GATE (IO10): operator questions each have a named emitting source ON THE NORMAL PATH; the emission was observed at least once on a real run with the value READ BACK (E14); cost axes covered not just correctness; every measurement path degrades to not-recorded rather than to a wrong number; anything still unmeasurable is a NAMED gap with what it prevents. A feature is not done until its behaviour is measurable without a flag, a re-run, or a debugger.' }
  - { type: added, area: docs, paths: [], deploy: 'source-repo only (evidence, not deployed)', summary: 'docs/plans/optimize-graph-live-01.md - the first live /optimize-graph run and its planned-vs-actual ledger (GO18). Plan matched actual exactly (span 11->6, zero rework passes, six floor gates present before the commit, loop variant 15->1->0 in one iteration). Headline measurement replaced a modeled constant with a real one and produced GO4a. docs/knowledge/graph-and-loop-engineering/data-and-constants.md gains the measured fan-out-overhead block, which also qualifies the back-test uniform-node-cost model as an UPPER BOUND rather than an expectation.' }
  - { type: added, area: skills, paths: ['commands/optimize-graph/SKILL.md', 'adapters/copilot/prompts/optimize-graph.prompt.md'], deploy: 'copy SKILL.md to .claude/skills/optimize-graph/ and the prompt to .github/prompts/optimize-graph.prompt.md ; RE-PASTE both managed blocks wholesale (skill/workflow counts 21->22 and the new roster entry)', summary: 'NEW SKILL - /optimize-graph, a PRE-EXECUTION planning pass that models a prompt as an execution DAG before any work starts. Ten stages - triage (skip when the work is 1-2 nodes with no loop/fan-out/gate; 36% of this fleet 750 audit entries are single-step, so skipping is the normal path), build the naive graph, ADD THE MANDATORY FLOOR NODES FIRST so they can never be a casualty of the optimization, classify every edge as data / decision / INCIDENTAL ORDERING and delete the incidental ones (the cheapest and usually largest win), measure work/span/ceiling and attack the CRITICAL PATH BEFORE THE WIDTH (Tp >= T-infinity always, so parallelism cannot beat the span), decide concurrency by the INDEPENDENCE test (may they) and the COUPLING test (should they - parallel exploration is a ~15x token multiplier, right for open-ended/breadth-first work and wrong for tightly-coupled work) with a five-part fan-out contract (width cap never unbounded, transient-retry policy, per-branch exit, join rule including what it does with a PARTIAL, failure containment), collapse/promote for granularity plus a determinism push, BOUND EVERY LOOP WITH A TERMINATION VARIANT (a cap is a circuit breaker whose firing is a DEFECT signal, never a termination argument), disconfirm at a gate the author does not clear (Test Architect hard veto - does the optimized plan prove EVERYTHING the naive plan proved), emit the plan with before/after metrics and Verified-vs-Inferred labels on every cost figure, then record PLANNED VS ACTUAL so /dream can mine it. The governing constraint inverts the usual optimization framing - it may ONLY increase completeness, rigor and determinism, never trade them; a plan that is faster because it checks less is REJECTED, not scored. skills 21->22.' }
  - { type: added, area: knowledge, paths: ['knowledge/execution-graph-optimization.md'], deploy: 'copy to .claude/knowledge/ and re-wrap into .github/instructions/execution-graph-optimization.instructions.md ; RE-PASTE both managed blocks (they gain a plan-the-shape bullet)', summary: 'NEW KNOWLEDGE DOC - Execution-Graph Optimization (GO1-GO18), the normative standard /optimize-graph applies. Prime directives - optimization is a COMPLETENESS AMPLIFIER not a trade (floors are inputs, not variables); optimize the SPAN before the WIDTH; a loop without a variant is not bounded, it is HOPED to terminate; independence is proven not assumed and "may" is not "should"; profile before you reshape; determinism is a first-class target. Covers building the graph (GO1-GO3), span-then-width with Brent bound reporting and PULLING GATES EARLY - a gate that fires early costs one node, the same gate firing late costs everything built on top of it (GO4-GO7), loop engineering by ranking function over a well-founded order (GO8-GO10), granularity/determinism/oracle-declaring verification nodes (GO11-GO14), and bounds/replan/cost-vs-delivery (GO15-GO18). knowledge_docs 34->35.' }
  - { type: added, area: knowledge, paths: ['knowledge/communication-and-task-discipline.md'], deploy: 'copy to .claude/knowledge/ and re-wrap into .github/instructions/communication-and-task-discipline.instructions.md ; RE-PASTE both managed blocks (they gain a how-you-write bullet)', summary: 'NEW KNOWLEDGE DOC - Communication & Task Discipline (CT1-CT18). Simplified technical English, result-first, formalism where it is denser than prose; a detectable TELL LIST (announce-then-do, "Let me...", "Great!", restating the request, any paragraph whose deletion changes no fact) modelled on NG3; the interim-update test. THE LOAD-BEARING REFINEMENT over the source directives is the RESPONSE-vs-ARTIFACT CHANNEL SPLIT - the response channel is compressed hard, but a committed artifact is written for a reader who was not in the session, so L8 the anti-prose rule is explicitly SCOPED to T0 inline prose and MUST NOT be used to thin a required artifact (in a repo whose product IS its documentation that misreading is self-harm). Second refinement - CT9 and CT18 make the floors explicitly non-trimmable - concision never drops a confidence label, citation, assumption, residual risk or correction, and proportionality never skips a triggered hard veto, the Testing-Strategy union, the E7 surface list, red-first, or the audit entries. Task focus - smallest change and smallest sufficient proof, name the failure any unrequested work prevents, reviewer findings are advice not automatic scope, CAPTURE ideas as next steps rather than chasing them (with a table of capture sites - status table / backlog / decision note / defect register / simplify marker), stop at proof. knowledge_docs 35->36.' }
  - { type: added, area: scripts, paths: ['scripts/coord-core.py'], deploy: 'NOT DEPLOYED to consuming repos yet - source-repo only. This is the Phase-1 walking skeleton of the agent-coordination layer (docs/design/coord-core-phase1.md), useful but not yet fit to federate: it has no enforcement, no artifact-class registry, and no identifier allocator. It ships to consumers when Phase 2 lands enforcement.', summary: 'NEW SCRIPT - coord-core.py, the agent-coordination Phase-1 walking skeleton. Append-only per-session record + a pure fold + four verbs (claim/check/release/tail), stdlib only, no daemon and no database (ADR-0007). Lets two sessions in two worktrees see each other leases; the record is per REPOSITORY, resolved from the git worktree layout on the filesystem rather than by shelling out (a subprocess cost 35ms of the 100ms edit-path budget). Four controls were observed failing on the un-fixed shape before being trusted: LOG-A (an append onto a file not ending in a newline fuses two records and loses BOTH), R4 (a check that scanned nothing must not report free), CTRL-PORT (os.open without O_BINARY translates newlines on Windows - which also MASKED the LOG-A control), and a claim over the coordination record itself. 24 tests. scripts 15->16.' }
  - { type: added, area: knowledge, paths: ['knowledge/ci-and-test-efficiency.md'], deploy: 'copy to .claude/knowledge/ and re-wrap into .github/instructions/ci-and-test-efficiency.instructions.md ; RE-PASTE both managed blocks wholesale (they gain a CI & test efficiency bullet)', summary: 'NEW KNOWLEDGE DOC - CI & Test Execution Efficiency (CE1-CE26): best coverage at minimum time and cost, the execution-economics companion to testing-strategy.md (which stays what-to-test / what-counts-as-proof). Mined from a consuming repo (The Terrace) that cut a required gate ~60-75% with NO gate weakened. Directives: PROFILE BEFORE OPTIMIZING - the bottleneck is rarely the suspect (measured: 8 WebApplicationFactory boot classes were 73% of CPU-time while the migration chain everyone blamed was 0.5-3s/test); RINGS OF INTEGRATION (fast every-push Linux <6min / slow at-readiness reusing artifacts, not per-WIP-push and not on push-to-main / post-merge); RUNNER ECONOMICS (Linux 1x vs Windows 2x vs macOS 10x - moving LocalDB to a Linux SQL container was a ~69% billable cut; a platform lock is a cost to remove, not a constant); DONT PAY TWICE (build once + share artifacts, cache only where measured to pay, collapse WIP runs); TEST-INFRA LEVERS (share expensive fixtures, clone-not-rebuild per-class setup, remove contention rather than out-core it, kill retry-storms against missing resources, teardown+janitor for durable per-test resources); GATE INTEGRITY WHILE CHEAP (no muted steps, one-command-or-explicit-fail-fast-shell, derive-the-suite-count, fail-closed required check, coverage-for-speed is a recorded deviation); SPIKE BEFORE FLIP (controls supply their own environment; spike a runner change on a throwaway job; land behind an inert seam); and the PREVENTION - a cost/duration BUDGET control that trends the aggregate and warns before the budget, not the timeout. Cross-referenced from testing-strategy.md and both managed blocks. continuous-improvement.md seed register gains six CI-efficiency classes (OPS-CI, TEST-BOOT, TEST-CONTEND, PARALLEL-BLIND, RES-LEAK-TEST, CI-ENV). knowledge_docs 33->34; lenses/skills/templates/scripts unchanged.' }
  - { type: changed, area: knowledge, paths: ['knowledge/continuous-improvement.md', 'knowledge/testing-strategy.md'], deploy: 'copy to .claude/knowledge/ and re-wrap into .github/instructions/', summary: 'Seed register (continuous-improvement.md §6) gains six measured CI/test-efficiency defect classes from The Terrace: OPS-CI (unbounded per-item cost on a premium runner, invisible until it hits a wall), TEST-BOOT (the bottleneck is the suspect nobody measured), TEST-CONTEND (parallelism on top of contention spends money to go slower), PARALLEL-BLIND (a race the gate runners are too small to reach), RES-LEAK-TEST (a durable per-test resource nothing destroys - one repo reached 28,799 orphaned test DBs), CI-ENV (a control proven only where it was authored). testing-strategy.md gains a companion note pointing execution economics at the new doc and naming D0/TEST-CLOCK as the shared determinism floor.' }
  - { type: changed, area: skills, paths: ['commands/dream/SKILL.md', 'commands/apply-learnings/SKILL.md'], deploy: 'copy to .claude/skills/<name>/', summary: 'FIX - dream and apply-learnings SKILL.md lacked the YAML name/description frontmatter every other skill carries, so the skills were never discovered/registered and /dream (and /apply-learnings) could not be invoked. Added frontmatter to the pack source and regenerated. The dream.py engine itself was already correct.' }

  # ---- Prior revisions ----

  - { type: added, area: templates, paths: ['templates/dream-manifest.template.html', 'scripts/apply-learnings.py', 'commands/apply-learnings/SKILL.md', 'adapters/copilot/prompts/apply-learnings.prompt.md'], deploy: 'copy template to docs/ai-forward-pack/templates/ ; copy script to docs/ai-forward-pack/scripts/ ; copy SKILL to .claude/skills/apply-learnings/ ; copy prompt to .github/prompts/', summary: 'THE DREAM MANIFEST (ADR-0006) - the missing targeting/record layer in federation. apply-learnings push was all-or-nothing (every fleet class into every named repo) and kept no record of what landed where. The manifest is a persisted learnings x repos assignment matrix (learnings/manifests/<id>.json): `manifest-init --repos a,b,c [--dream id]` scaffolds it from the fleet store plus a self-contained compose HTML (dream-manifest.template.html, data inlined, works over file://) where you toggle each (learning, repo) cell; `push --manifest <file>` reconciles PER ASSIGNMENT (a learning only into its targets - reusing reconcile/scrub/slug), writes a reviewable plan per repo, and RECORDS STATUS BACK into the manifest (pending -> planned/merge/conflict/skipped), re-rendering the HTML in read-only rollout mode. Still never a merge (ADR-0005). Manifests NAME REPOSITORIES so they are local-only by default: git-ignored (learnings/manifests/, learnings/plans/) and excluded from the published Pages bundle, consistent with keeping raw dreams + audit local while only the abstracted fleet-classes are public. Templates 25->26; apply-learnings.py extended (scripts count unchanged at 15).' }
  - { type: changed, area: docs, paths: ['.github/workflows/pages.yml', 'tools/build-pages-bundle.py', 'docs/portal/index.html', 'tools/docs-portal-editorial.json'], deploy: 'repo-local tooling; NOT deployed to target repos', summary: 'GITHUB PAGES HOSTING (Option A + publish boundary). The AI-Forward site is now publishable to GitHub Pages with the Documentation Portal as the shareable front door: tools/build-pages-bundle.py assembles a _site bundle (root index.html redirects to docs/portal/index.html) enforcing the PUBLISH BOUNDARY - PUBLIC = portal/graph/docs+pack knowledge/architecture/web/README+CLAUDE+AGENTS/abstracted learnings/fleet-classes.*; LOCAL-ONLY (excluded, and the build FAILS non-zero if any leaks) = docs/dreams, docs/audit, learnings/{manifests,plans,working ledgers}. pages.yml runs the bundle builder and uploads _site. The portal is now hosting-aware: local-only surfaces (raw dream review, the audit viewer) render as an annotated "local only" note when served over http(s) instead of as broken links, and as working links over file://. One-time: repo Settings > Pages > Source = GitHub Actions.' }

  # ---- Prior revisions ----

  - { type: added, area: skills, paths: ['commands/dream/SKILL.md', 'commands/apply-learnings/SKILL.md', 'adapters/copilot/prompts/dream.prompt.md', 'adapters/copilot/prompts/apply-learnings.prompt.md', 'scripts/dream.py', 'scripts/apply-learnings.py', 'templates/dream-review.template.html'], deploy: 'copy commands to .claude/skills/<name>/ ; copy prompts to .github/prompts/ ; copy scripts to docs/ai-forward-pack/scripts/ ; copy template to docs/ai-forward-pack/templates/', summary: 'THE DREAMING CAPABILITY - the "asleep half" of continuous improvement the pack was missing. /dream runs an offline, reviewable consolidation pass (light -> REM -> deep) over the committed corpus (audit/change logs, defect-class register, captured mitigations, triggered simplify:/assume: markers) and emits an HTML review view of proposed learnings you approve/edit/reject/defer, then apply-decisions promotes only approved items (idempotent; a promotable learning MUST carry a falsifiable control - CI6). The promotion ORACLE is a captured MitigationRecord - a red-observed->green test or an explicit human validation (an unverified fix is never mined). /apply-learnings is the push half of federation: it reconciles approved general fleet learnings into target repos as REVIEWABLE PLANS (add/merge/conflict), never merges, never executes; /updatepack is the pull half. The model step is an INJECTED boundary (ADR-0005) - the harness is stdlib-only and runs deterministically with no runner SDK. Governed by spec-dreaming, architecture-dreaming, ADR-0002..0005, and the evidence base docs/knowledge/continuous-improvement-and-dreaming/. Skills 19->21, scripts 13->15, templates 24->25.' }
  - { type: changed, area: scripts, paths: ['scripts/ui-craft-gate.py'], deploy: 'copy to docs/ai-forward-pack/scripts/', summary: 'FALSE-PASS FIXED - the gate rendered a non-scan as a clean scan. The detector uses exit 1 for "found anti-patterns", so empty-output-plus-exit-1 was ambiguous between a real clean run and a failed invocation, and the wrapper chose the reassuring reading. Observed while critiquing another repo: npx --yes impeccable exits 1 with "not recognized" and no stdout, and the gate reported a clean scan of a file it had never opened. The same command now reports 21 findings. No-output is now an ERROR carrying the detector stderr and exit 2. Registered as E2E-I. A SECOND shape of the same defect survived the first fix in the same function: URL scanning without puppeteer prints "[]" to stdout, the error to stderr, and exits 0 - valid empty JSON, so the empty-output guard never saw it. Both shapes now closed and locked with six tests, including one asserting that harmless stderr chatter does NOT fail a genuine clean run.' }
  - { type: changed, area: scripts, paths: ['tools/build-web-index.py'], deploy: 'repo-local tooling; not deployed', summary: 'FR-048 RESOLVED - the generated web index stamped wall-clock time, so it differed on every re-sync and could never join the source-install drift gate. Now uses SOURCE_DATE_EPOCH when set, else the newest mtime across pack/, so the stamp tracks CONTENT rather than the passage of time. Verified byte-identical across two syncs two seconds apart, and web/ added to the drift-gate scope.' }
  - { type: changed, area: scripts, paths: ['tools/check-consistency.py'], deploy: 'repo-local tooling; not deployed', summary: 'THE CONTROL FOR THIS PROJECTS DOMINANT DEFECT. check_promised_paths() fails when any pack artifact names a repo path that neither exists, nor is claimed by a SKILL.md as created-at-runtime, nor is allowlisted with a stated reason. The revision-33 review found that four of its five findings were the same shape - a fix applied to the instance and never swept to the class (RIG-C, third occurrence) - and that nothing enforced CI2s sweep step. This is that enforcement: it caught FR-044 and FR-045 the moment it was written, and would have caught FR-043.' }
  - { type: changed, area: adapters, paths: ['adapters/INSTALL.md'], deploy: 'copy to docs/ai-forward-pack/', summary: 'FR-044 RESOLVED - the deployment map promised thin command entry points at .claude/commands/<name>.md that nothing creates and Claude Code does not need (it auto-discovers .claude/skills/*/SKILL.md by description). The row now says none, and the worked sample that invited adopters to hand-author unversioned duplicates of the skills was deleted. Same class as FR-043, in the same file, one revision later.' }
  - { type: changed, area: knowledge, paths: ['knowledge/agent-rules-of-the-road.md', 'knowledge/agent-body-of-knowledge.md', 'knowledge/csharp-style-guide.md', 'knowledge/FOUNDATION.md'], deploy: 'copy to .claude/knowledge/ and re-wrap into .github/instructions/', summary: 'FR-045 RESOLVED - the vendored Rules of the Road carried a SECOND deployment map naming six paths that do not exist (.github/knowledge/ has never existed; four instruction filenames were wrong), in documents the managed block loads every session on both surfaces. An agent grounding itself was told authoritatively to load files that are not there. Corrected, and recorded as a known intentional divergence in FOUNDATION.md with foundation-check.py --update.' }
  - { type: changed, area: scripts, paths: ['scripts/prompt-log.py', 'scripts/audit-log.py', 'scripts/docs-graph.py', 'scripts/scrub.py', 'scripts/design-lint.py', 'scripts/pack-doctor.py', 'scripts/foundation-check.py'], deploy: 'copy to docs/ai-forward-pack/scripts/', summary: 'FR-047 RESOLVED - prompt-log.py --help crashed outright on Windows because its help text carries arrow glyphs absent from cp1252. The stdout/stderr guard is applied to ALL SEVEN scripts that print non-ASCII, not just the one that crashed. Correction to the finding as first written: NO script was guarded; the claim that pack-doctor.py was came from a heuristic rather than from opening the file. Six survived only because their glyphs happen to exist in cp1252 - luck, not an invariant.' }
  - { type: added, area: scripts, paths: ['tests/docs_explorer/test_deployed_scripts.py'], deploy: 'repo-local; not deployed', summary: 'FR-046 - scrub.py (the PII/secret control named in responsible-ai-policy.md) and design-lint.py (the U3a token control) shipped to every adopting repo with no test and no gate. Now covered by true-positive AND true-negative assertions, plus a cp1252 encoding assertion across every deployed script, proved red-first. Suite 119 -> 126.' }

