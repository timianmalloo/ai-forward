changes:
  - { type: added, area: adapters, paths: ['adapters/grok/grok-surface.md', 'adapters/hooks/grok.ai-forward-hooks.json', 'adapters/hooks/reread-guard.py', 'adapters/hooks/session-start.py', 'adapters/hooks/README.md', 'scripts/pack-apply.py', 'scripts/pack-doctor.py', 'adapters/INSTALL.md', 'adapters/managed-blocks/AGENTS.block.md', 'adapters/claude-code/agents/orchestrator.md', 'commands/addpacktorepo/SKILL.md', 'commands/updatepack/SKILL.md'], deploy: 'pack-apply (and sync-pack in the source repo) now deploys the Grok Build surface: skills -> .grok/skills/<name>/ (whole directory); agents -> .grok/agents/<name>.md (`_agent` suffix stripped, `tools:` stripped); hooks -> .grok/hooks/ai-forward.json; path map -> .grok/rules/grok-surface.md. Knowledge is NOT copied into .grok/rules/ (CTX-B) - Grok reads AGENTS.md natively and the shared `.claude/knowledge/` copies. RE-PASTE the AGENTS block (path legend gains the Grok sentence). Copy reread-guard.py and session-start.py (they gain --host grok). Project hooks require folder trust (`/hooks-trust` or `--trust`). The pack `/implement` skill at `.grok/skills/implement/` overrides Grok bundled implement in this repo - that is intended.', summary: 'GROK BUILD SURFACE. Grok already loads AGENTS.md as project rules and, with Claude compatibility on (the default), discovers `.claude/skills/`. That is not a Grok install: a user who sets `[compat.claude] skills = false` gets no skills, personas in `.claude/agents/` are not the documented Grok agent location (`.grok/agents/`), Copilot wraps are not auto-loaded, and hooks live in Claude/Copilot configs. Native destinations: `.grok/{skills,agents,hooks,rules}`. Knowledge stays at `.claude/knowledge/` (one copy). Personas spawn as `spawn_subagent` with `subagent_type` = the persona `name`. Collision: pack `/implement` overrides bundled `/implement` in a pack-installed repo. Red first: dest paths, `_agent` rename, tools: strip, grok hook payloads (camelCase sessionId / target_file), pack-doctor `.grok` surface, deployed-agent parity on the third directory.' }
  - { type: changed, area: coordination, paths: ['scripts/coord-core.py', 'knowledge/session-worktree-discipline.md', 'tests/docs_explorer/test_coord_addendum_cd.py'], deploy: 'copy coord-core.py to docs/ai-forward-pack/scripts/ ; copy the knowledge doc to .claude/knowledge/ and re-wrap it into .github/instructions/. BEHAVIOUR CHANGE, in your favour: `worktree cleanup` now HOLDS a clean tree whose branch has commits not on the default branch (a pushed-but-open branch), prints the count, and removes it only with the new `--include-unmerged`; `claim` now REFUSES a `register`-class path (COORD-CLAIM-REGISTER-CLASS, exit 3) and a `--ttl` above 900 s without `--long-edit <reason>` (COORD-CLAIM-TTL-CAP, exit 3). A brief that says `--ttl 3600` must change; a claim on the audit log or the coordination log must be dropped (append and commit instead).', summary: 'DC-142 AND DC-163, MEASURED IN A CONSUMING REPO (Addenda C/D, 2026-09-11 -> 13). (1) `coord worktree cleanup` labelled a frozen tree `clean, merged, unheld - WOULD remove` while `git rev-list --count main..<branch>` read 21. The old rule was unique_commits(): "does every commit exist SOMEWHERE else?" - and a PUSHED branch answers yes, because every commit is on its remote-tracking ref. "Merged" now means `git rev-list --count <default>..<branch> == 0` against the repository DEFAULT branch (origin/HEAD, then main, then master; none resolved = HELD, never guessed), the count is PRINTED on every verdict (IO2), a pushed-but-open tree is HELD with "N commit(s) not on main - open work; pass --include-unmerged to remove", and WT7 gains the row. Observed red first: a tree 3 commits ahead of main, pushed, reported WOULD remove; 5 new tests. (2) A brief that said "claim every file you will touch, --ttl 3600" held the defect register for an hour while editing none of it and two joins queued ~50 min behind the lease (20 register refusals in 45 min across three sessions and the peer fleet). A `register`-class artifact merges by UNION - a lease on it protects nothing and blocks every join that must append - so `coord claim` refuses one outright with the remedy (append with a placeholder id, commit); and a TTL above 900 s needs `--long-edit <reason>`, written into the claim event so a queued peer reads why it waits. The lease is for the MINUTES of the edit. Red first: 4 tests. scripts unchanged by this entry.' }
  - { type: changed, area: scripts, paths: ['scripts/audit-log.py', 'scripts/prompt-log.py', 'knowledge/audit-and-change-log.md', 'adapters/managed-blocks/AGENTS.block.md', 'tests/docs_explorer/test_audit_log.py'], deploy: 'copy both scripts to docs/ai-forward-pack/scripts/ ; copy the knowledge doc to .claude/knowledge/ and re-wrap into .github/knowledge/ ; RE-PASTE the AGENTS block (the AL4a clause). Nothing to migrate: a bare `start --session` still works; `start --skill <name>` and `append --goal-file/--done-when-file` and `prompt-log.py add --file <path>` are additions.', summary: 'PACK FINDINGS #1 AND #2 (Addenda C/D). (1) `prompt-log.py add` died on a non-ASCII prompt under a Windows console and a piped `--prompt-file -` arrived as mojibake ("â†’" for an arrow) with NO error: the pipe was encoded with the console code page (`text=True`, no encoding) and the child decoded it the same way. Now the scripts set UTF-8 on the seam they own - prompt-log encodes the pipe as UTF-8 and passes PYTHONIOENCODING to the child, audit-log and prompt-log reconfigure stdin as well as stdout - and every text field has a file form (`--goal-file`, `--done-when-file`, `prompt-log.py add --file`) because a file is the one path with no console in it. Observed red first: the mojibake reproduced under a cp1252 console. (2) `audit-log.py append` CONSUMED the start marker of a DIFFERENT run: `prompt-log.py add` between a skill start and its close (kind:prompt, same session) ate the skill marker, and the closing entry measured 16 s of a 3-minute run - re-observed by the profiler on itself. The marker is now keyed by session AND skill (`start --session <id> --skill <name>`; an append naming another skill does not consume it; a bare session marker stays the fallback), and a `kind:prompt` entry NEVER consumes one - a prompt is a record, not a run. `session-profile.py` own audit append now passes `--started` (it measures its own run) instead of consuming. `selfcheck` already flagged a `done_when` entry with no `tier` (tier GAPS, since the CTX-C revision; pinned by test_ctx_controls) - reported as present, not re-implemented. Red first: 6 tests.' }
  - { type: changed, area: scripts, paths: ['scripts/session-profile.py', 'tests/docs_explorer/test_session_profile_subagents.py'], deploy: 'copy session-profile.py to docs/ai-forward-pack/scripts/. Re-run `/session-profiler` over any Claude Code conductor session profiled before this revision: every earlier profile of one is blind to its nodes.', summary: 'F-18, F-19, F-20, F-21, F-24, F-25 AND THE OPERATOR QUESTION OF 2026-09-14 (docs/profiles/addendum-cd.md). (1) F-18: the Claude reader walks `<session>/subagents/agent-*.jsonl` + `.meta.json` - this harness writes sub-agents THERE, not as isSidechain records in the main transcript, so sp-0002 reported 0 sub-agent requests while the store held 166 agents, 10,606 requests and 86% of the programme cost. Each agent is a node row (model from usage, requests deduped by message id, tool calls deduped by tool_use id, tokens, ctx max, span, resumes, tool waits, est. cost); a depth-1 node attaches to the turn that launched it by its toolUseId and a depth-2 review to its parent; SP-01/SP-07 run per node. Measured on the real store after the change: 168 agents, 10,821 requests, 1.4 s. (2) F-19: a user record whose origin is `task-notification`, or whose text starts `<task-notification>` / `<local-command-` / `<command-name>` / the compaction summary, or which is isMeta, is a CONTINUATION of the turn in flight, never a human turn - 50 of the conductor 89 "turns" were wake-ups and SP-09 fired on them; the same session now reads 33 turns. (3) COST IN THE UNITS THAT ARE MEASURED: requests and tokens (cache-read / cache-write / uncached / output) are the primary unit, `_meta.quota` is read where the harness carries it (else "not recorded"), and dollars appear ONLY as an "if API-billed" estimate at first-party list rates (LIST_RATES, read from the claude-api reference cached 2026-06-24, printed with every figure; a model with no rate row is unpriced, not priced as its neighbour) - the operator is on a subscription and pays quota, not this. A per-session Nodes table renders every node. (4) Four counters: SP-23 a sub-agent tool wait > 600 s on a non-shell tool (EnterWorktree waited 8,143 s then refused; F-25), SP-24 a gate INVOCATION piped into a formatter with no pipefail and the subset that commits/merges/pushes on the same line (F-20; a first cut that matched any line naming a gate over-counted 7x and was tightened to the invocation before the pipe, pinned by nine shapes), SP-25 a failed heredoc run (F-21), SP-26 a node resumed after > 30 min idle whose second run set no marker (F-24). Each fires on a fixture built in the observed record shapes and stays silent on its clean twin; on the real conductor session SP-23 found the 8,143 s wait exactly. Red first: 12 tests.' }
  - { type: added, area: scripts, paths: ['scripts/run-verify-gates.py', 'scripts/conductor-join.py', 'scripts/verify-no-conflict-markers.py', 'scripts/verify-no-new-console-launches.py', 'commands/execute-with-coordination/SKILL.md', 'commands/updatepack/SKILL.md', 'adapters/copilot/prompts/execute-with-coordination.prompt.md', 'adapters/copilot/prompts/updatepack.prompt.md', 'tests/docs_explorer/test_addendum_cd_gates.py'], deploy: 'copy the four scripts to docs/ai-forward-pack/scripts/ ; copy the two skills to .claude/skills/<name>/ and the two prompts to .github/prompts/. Then, in a repo that coordinates: write `docs/coordination/join.json` with the repo own `checks`, `recount`, `regenerate`, `gates` and `build` commands (the script docstring shows the shape; absent, the defaults are `coord-core.py regen` and `run-verify-gates.py`), and put `verify-no-conflict-markers.py` FIRST in any local regenerate/resolve step list. A repo that already carries these four under tools/ (the consuming repo that measured them) keeps its copies or points at the pack ones; both self-tests are the same proof.', summary: 'THE JOIN AS A SCRIPT, THE GATE RUNNER, THE CONFLICT-MARKER GATE FIRST, THE CONSOLE-LAUNCH GATE - lifted from the consuming repo that measured them, made generic. DC-113 recurred four times in one programme: a `for ... done` loop exit status is its LAST command (there is no single status to chain on), and a hand-typed join line piped the conflict-marker gate through `| tail -1`, read the remedy text as a pass, and sealed a merge carrying `<<<<<<<` (DC-136). `run-verify-gates.py` runs every verify-*.py under tools/ and docs/ai-forward-pack/scripts/ (or --dir), one line per gate, ONE exit status, a per-gate budget that kills the process tree (a hung gate is red, never a skip), the failing gate last line relayed, --skip printed never silent, --args NAME=ARG for a gate that needs them. `conductor-join.py` is the only join line: merge (or --continue), the join OWN audit marker (keyed to the skill), verify-no-conflict-markers FIRST, the repo checks then ONE whole-suite recount timed as recount_seconds (joins and recounts were 44.8% of a conductor active main line and no entry recorded it), the join entry at tier T1 / fan-out 0 with a measured duration, regenerate, commit, run-verify-gates, push, build - each a subprocess gated by its exit code; the failing step number is the exit status; a conflict stops with the file list and the rule that a DERIVED file is regenerated, never resolved. `verify-no-conflict-markers.py` scans every tracked text file for `<<<<<<<` / `>>>>>>>` / `|||||||` at line start (`=======` alone is a Markdown setext underline and is never flagged), refuses an empty corpus (PACK-P), skips itself by identity. `verify-no-new-console-launches.py` (DC-170: on a Windows Terminal host a child started with CREATE_NEW_CONSOLE is a TAB whose agent outlives the test - 257 accumulated over two days) scans src/ and tests/ (or --root-dir) in C#, C/C++, Rust, Go, Python, PowerShell and JS/TS for the token on a CODE line, no allowlist. All four carry --self-test, and each self-test was proven able to go RED by mutation (the runner counting no failures; the markers tuple emptied; the comment regex matching everything; the join allowing the marker gate to exit 1) - a test pins the mutation replay. scripts 23 -> 27.' }
  - { type: changed, area: knowledge, paths: ['knowledge/communication-and-task-discipline.md', 'knowledge/spike-protocol.md', 'adapters/managed-blocks/AGENTS.block.md', 'commands/execute-with-coordination/SKILL.md', 'commands/prepare-for-coordination/SKILL.md', 'commands/ui-design/reference/flow.md', 'adapters/copilot/prompts/execute-with-coordination.prompt.md', 'adapters/copilot/prompts/prepare-for-coordination.prompt.md', 'adapters/copilot/prompts/ui-design.prompt.md'], deploy: 'copy the two knowledge docs to .claude/knowledge/ and re-wrap into .github/instructions/ (communication-and-task-discipline) and .github/knowledge/ (spike-protocol) ; copy the three skill directories WHOLE to .claude/skills/<name>/ and the three prompts to .github/prompts/ ; RE-PASTE the AGENTS block (the how-you-write bullet gains the CT27 shapes, the instrumentation bullet the marker keying and the hook) ; then run `context-budget.py gate --update-baseline`, `prefix --update-baseline` and `skills --update-baseline` in the SAME commit - the always-on set and three skills grew by design and the ratchet is meant to show it in the diff.', summary: 'THE RULES A PROFILER CAN COUNT, WHERE THEY ARE READ. NEW CT27 - the shell line is a control surface: (1) a gate exit status is never behind a pipe (168 main-line lines in one programme, 102 also committing/merging/pushing, four hid a red; counter SP-24), (2) a multi-line program is a file, then a run - never a heredoc (70 failed runs, ~70 burned requests; SP-25), (3) a sub-agent never calls a deferred host tool the session refuses - EnterWorktree/ExitWorktree, absolute paths only (8,143 s waiting for a refusal; SP-23). CT19 goal state gains `Context ceiling:` (F-14 ext.: 18 of 52 nodes over 500k tokens, nodes cache reads 68% of the programme; 400k unless the plan says otherwise; a hand-off rule - split or compact - because an agent cannot read its own context size, and SP-01 per node is the measurement). The execute-with-coordination brief now opens with the `start` line (DC-190), quotes the ADR line for any control trigger (DC-189), never claims a register-class path (placeholders never the register - append with a placeholder id), claims for the minutes of the edit (DC-163), forbids EnterWorktree (F-25), carries the ceiling, and a RESUME message carries `start` too (F-24: six resumed nodes measured nothing after the first run); the join is `conductor-join.py` and nothing else, the conflict-marker gate first, one recount per join. prepare-for-coordination: a plan row that names a control trigger QUOTES the ADR line, never a paraphrase (DC-189 - the paraphrase is where the width changes, GO14a). ui-design Stage 3: the harness measures the page box before any number (DC-200); Stage 5: oracle strings are quoted from DESIGN.md *Copy added by this section* row, never retyped (DC-196). The Spike Protocol: an oracle over a recorded run is run against the harness OWN recorded dry run before it ships, and every "what did not happen" oracle first asserts the run ended (DC-178, DC-185). Where a rule cannot be red, the doc names the profiler counter that measures it. Counts unchanged (see `counts:` above).' }
  - { type: added, area: hooks, paths: ['adapters/hooks/session-start.py', 'adapters/hooks/claude-code.settings.hooks.json', 'adapters/hooks/README.md', 'scripts/audit-log.py', 'scripts/pack-apply.py', 'templates/mockup-harness.template.html', 'adapters/INSTALL.md', 'tests/docs_explorer/test_session_start_hook.py', 'tests/docs_explorer/mockup_harness_audit.test.js'], deploy: 'copy session-start.py (and README.md) to docs/ai-forward-pack/hooks/ ; merge the hooks object from claude-code.settings.hooks.json into .claude/settings.json (it gains SessionStart and SubagentStart; pack-apply merges it) ; copy audit-log.py and pack-apply.py to docs/ai-forward-pack/scripts/ ; copy the mockup-harness template to docs/ai-forward-pack/templates/ and, for every EXISTING docs/mockups/*.html built from it, port the page-box check at the top of audit() by hand (a template is copied at creation, so old mockups do not update themselves). On Linux/macOS change the hook command to python3 (INSTALL 0).', summary: 'DC-190 AND DC-200, AS CONTROLS. (1) A node that grounds before `audit-log.py start` reports a duration from the wrong instant; prose that says "mark first" is a memoir (CI6). NEW `session-start.py` runs on Claude Code SessionStart and SubagentStart (contract read from the hooks reference on 2026-09-14: stdin carries session_id, cwd and, for a sub-agent, agent_id/agent_type; SessionStart cannot block; stdout is added to the model context, so the hook prints nothing) and records the marker at the session seam: keyed to $AGENT_SESSION when the harness environment carries it, otherwise a HARNESS slot (`start --harness <session_id>[/<agent_id>]`) that `append` uses only when the entry has no marker of its own, labelled `duration_source: session-start-hook` and consumed once - so an unmarked run measures from its true start and a second unmarked run reads NO duration rather than the session whole age (IO8). Fail-open on every path. Copilot CLI is not wired: its session-start event was not verified (NG1). Red first: 7 tests. (2) A mockup was display:none from D1 to D3 while every audit it reported still computed - a harness gating selector matched <body>, and a headless sweep that reads only the verdict strip passed. The harness template audit() now measures the frame page box FIRST and, at 0x0, reports "page not rendered ... no number is reported" as a FAIL with no rows; a dependency-free node test runs the template script over a DOM shim whose page box it controls (red first: the old template reported "6 contrast fail" over a 0x0 box). Any repo sweep over mockups (the consuming repo verify-mockup-audits.py) asserts the same box before reading a verdict - named in ui-design Stage 3.' }

  # ---- Prior revisions ----

  - { type: changed, area: coordination, paths: ['scripts/coord-core.py', 'knowledge/session-worktree-discipline.md', 'tests/docs_explorer/test_coord_worktree_base_and_cleanup.py'], deploy: 'copy coord-core.py to docs/ai-forward-pack/scripts/ ; copy the knowledge doc to .claude/knowledge/ and re-wrap it into .github/instructions/. BEHAVIOUR CHANGE, deliberate and in your favour: `worktree new` now bases the new tree on the INVOKING tree''s HEAD rather than the primary''s, which is what its help always promised. `cleanup --remove` gains `--path <tree>` and now exits 4 when anything survived the attempt - if you script it, an exit of 4 means READ THE OUTPUT, not retry.', summary: 'TWO DEFECTS IN `coord worktree`, both the PACK-P family: a tool reading context from the wrong place inside a system whose own discipline (WT1) moves work between trees. (1) CLASS WT-A - `worktree new --base HEAD` ran `git -C <primary> worktree add ... HEAD`, so from a linked worktree it silently based the new tree on the PRIMARY''s commit; the DEFAULT had the same defect while the help promised "current HEAD". `repo_root` is right to answer "which repository" - the mistake was using that answer for a question that is "which tree". Measured harm is worse than a wrong name: a node that had just committed the rev-68 fix created a tree with --base HEAD, got the pre-fix script, saw the pre-fix result and nearly reported its own correct fix as broken. A tool that silently bases work on the wrong commit will be believed. Fixed by `base_commit(cwd, repo, base)`, resolving against the invoking tree; the chosen commit is now PRINTED in the banner (IO2) so a wrong base can never be silent again. (2) CLASSES WT-B and WT-C - `cleanup --remove` printed `len(removable) - failed`, a count derived from INTENT, so a tree that survived could be reported as removed; and it adjudicates EVERY worktree in the repository with no way to say "this one". Now `classify_removals` READS THE INVENTORY BACK (E14) and reports removed / not removed / ORPHANED, each named, with no count at all when the read-back fails. Registration - not the error text - is the discriminator, because git DE-REGISTERS BEFORE IT DELETES: a delete that fails leaves the tree unregistered AND on disk, which no worktree command will ever mention again. Reproduced: exit 255, "failed to delete", entry already gone. `--path <tree>` scopes the removal and the wide default now announces itself - WT-C is a GO14a instance in the tool that implements the discipline GO14a governs. All three observed failing first; 14 new tests. Counts unchanged (see `counts:` above).' }
  - { type: added, area: scripts, paths: ['scripts/repo_identity.py', 'scripts/audit-log.py', 'scripts/docs-graph.py', 'scripts/pack-apply.py', 'scripts/coord-core.py', 'scripts/session-profile.py', 'tests/docs_explorer/test_repo_identity.py'], deploy: 'copy ALL SIX scripts to docs/ai-forward-pack/scripts/. repo_identity.py is a NEW shared module: coord-core.py imports it HARD (a missing coordination layer must fail loudly, as coord_ids already does there) and audit-log.py, docs-graph.py and pack-apply.py import it SOFTLY (they ship to installs that predate it and must not crash an audit render). Copying only some of them leaves the seam broken - that is PACK-D, and it is why the coord worktree fixture now DERIVES its deploy list instead of hand-listing it. Nothing to configure: the canonical name is read from git. After copying, re-render once - `python docs/ai-forward-pack/scripts/audit-log.py render` - to correct any worktree name already committed into docs/audit/.', summary: 'PACK-P CLOSED AT THE ROOT. The pack''s own two rules were in direct conflict: WT1 requires every writing session to run in its own worktree, `coord worktree new` names that directory <repo>-<branch-slug>, and the renderers named the project basename(cwd) - so FOLLOWING the worktree discipline GUARANTEED corrupting a committed artifact (audit-data.js "project", docs/audit/index.html <title>, Docs Explorer surface titles, and via pack-apply a TARGET repo''s docs/index.html and AGENTS.md). A tool that infers identity from the filesystem, inside a system whose own discipline moves work around the filesystem. Blast radius established by sweep, not assumed: three generators were wrong (audit-log, docs-graph, pack-apply) and TWO more - coord-core and session-profile - each carried a separate CORRECT copy of the same ladder, which is DM7/ONE-A waiting to diverge. All five now delegate to ONE implementation: repo_identity.canonical_project, resolving explicit --project > remote.origin.url > the PRIMARY checkout via `git rev-parse --git-common-dir` > the directory name. Each rung verified empirically, not assumed: from a linked worktree --git-common-dir returns an ABSOLUTE path to the primary .git, but from the primary checkout it returns the RELATIVE string ".git", whose dirname is empty - so it is resolved against the repo path before the basename is taken; outside a repo git exits 128 and the ladder falls through. THE CONTROL, not just the fix: tests/docs_explorer/test_repo_identity.py builds a REAL LINKED WORKTREE (a renamed directory does not reproduce this - renaming moves every rung at once, so a broken resolver and a correct one agree) and asserts the generated identity is the same from both trees, plus a sweep test that fails on any NEW script naming the project from its own directory. Observed failing first (CI6): the render wrote "ai-forward-fix-pack-p-canonical-project", and the sweep named audit-log.py:578 and docs-graph.py:998. scripts 22->23.' }
  - { type: changed, area: knowledge, paths: ['knowledge/execution-graph-optimization.md', 'commands/optimize-graph/SKILL.md', 'commands/prepare-for-coordination/SKILL.md', 'adapters/copilot/prompts/optimize-graph.prompt.md', 'adapters/copilot/prompts/prepare-for-coordination.prompt.md'], deploy: 'copy knowledge/execution-graph-optimization.md to .claude/knowledge/ and re-wrap it into .github/instructions/execution-graph-optimization.instructions.md ; copy each SKILL.md to .claude/skills/<name>/ and each prompt to .github/prompts/ ; then run `python docs/ai-forward-pack/scripts/context-budget.py gate --update-baseline` and `... skills --update-baseline` and `... prefix --update-baseline` in the SAME commit - measured, this adds ~520 always-on tokens (one directive: 46,192 -> 46,712, inside the 2% tolerance) and ~257 skill tokens (optimize-graph 3,104 -> 3,247, prepare-for-coordination 2,671 -> 2,785), which trips the per-skill ratchet by design - the growth is meant to be visible in a diff, not blocked.', summary: 'GO14a - TRANSCRIPTION IS A WIDTH-CHANGING STEP, AND NOTHING CHECKED THE WIDTH. A ruling becomes a plan clause and a clause becomes a guard; each hop can change the scope silently, and the two directions fail differently. A clause written WIDER than its ruling goes red at the join and announces itself; a guard written NARROWER than the clause above it stays GREEN while the promise it documents is violated - caught by nothing. Measured in a pack repo, both directions inside one hour: (1) two compatible rulings - the second explicitly carving its scope out of the first - produced one node guard that scanned a shared .csproj repo-wide for a token the sibling node was authorised to add; both worktrees green, the join red, and the match was inside the sibling''s explanatory COMMENT rather than its code. (2) a guard whose doc comment quoted its clause verbatim ("anything writes a run log anywhere") while its body scanned one directory with TopDirectoryOnly for one token. Class DC-118. Both halves land as ONE directive beside GO14 (the oracle directive) because they are one mechanism - the STATED scope versus the ENFORCED scope - plus two self-verification rows in the same doc, one definition-of-done row in each plan-producing skill (optimize-graph, prepare-for-coordination), and their Copilot mirrors. Nothing else moves: the existing ruling-level collision check is correct and stays. Two properties make it a control rather than an aspiration - the mismatch is MECHANICALLY CHECKABLE (one sentence read against one enumeration call), and the guard carries a NAMED ALLOWLIST CONSTANT so a later node that legitimately needs the token adds one entry citing its ruling, because a guard that must be deleted to make progress is one people delete. Earliest possible detection is a plan-time reading: separate worktrees never hold each other''s change, so a guard whose subject is a shared surface is not meaningfully evaluated before the join.' }
  - { type: changed, area: scripts, paths: ['scripts/pack-apply.py', 'commands/updatepack/SKILL.md', 'commands/addpacktorepo/SKILL.md', 'adapters/copilot/prompts/updatepack.prompt.md', 'adapters/INSTALL.md', 'tests/docs_explorer/test_pack_apply.py'], deploy: 'READ THIS BEFORE RUNNING ANYTHING - it is the one step that cannot be automated for you, because your copy of the program predates the fix. THE INVOCATION HAS CHANGED. Do NOT run your own docs/ai-forward-pack/scripts/pack-apply.py. Run the SOURCE clone''s copy against your repo instead: `python3 <ai-forward-clone>/pack/scripts/pack-apply.py plan --target .` then `... apply --target .` (--source is no longer needed: it defaults to the clone shipping the script). That is the whole change - your stale copy never computes a plan, so it cannot silently revert a line your repo has declined. Everything else is ordinary: the run copies pack-apply.py, coord-core.py and pack-doctor.py into docs/ai-forward-pack/scripts/ along with the rest of the map, and from the next refresh onward the skills document the new invocation themselves.', summary: 'THE FIRST HOP IS NOW CLOSED BY CONSTRUCTION, NOT BY DETECTION. Revision 65 could see a stale applier; it could not stop one being used, because the check ships inside the copy that is missing - so every repo still holding a pre-65 program had an unwarned first hop that silently reverts whatever that repo has declined. The surrender "you cannot make an old program warn about itself" is true and was not the end of the analysis: the old program is not the only thing in the loop. TWO LEVERS REACH A STALE TARGET. (1) The SOURCE''s INSTALL.md is read fresh on every refresh however stale the target is - VERIFIED against a real revision-63 install, whose own updatepack skill already says "the source of truth for what changes and why is INSTALL.md''s `changes` frontmatter IN THE PACK SOURCE ... read both before running anything". That is why this entry''s deploy note leads with the manual step. (2) WHICH COPY RUNS IS ITSELF A DOCUMENTED CHOICE. The flow now runs the SOURCE clone''s pack-apply.py with --target <repo>, so the target''s copy never computes a plan and staleness is IMPOSSIBLE rather than detected - the make-it-impossible rung, with STALE-APPLIER kept as the warn-rung backstop for anyone using the old invocation. This needed no new capability: --target already existed and every subprocess was already pinned to cwd=self.target. What it needed was --source defaulting to the clone that ships the running script, so source and program cannot be mismatched, plus a clear refusal when an installed copy cannot derive one (never a guessed source, NG1). ALSO FIXED, A DEFECT IN REVISION 65 ITSELF: its staleness check compared the target''s INSTALLED copy with the source''s, which is a different question from which program is computing this plan - so it accused the source''s own script of being the target''s stale one. That false positive also hid the cure, since the inverted invocation is exactly what it was flagging. It now asks about RUNNING_SCRIPT, and both readings come out right. The two rev-65 tests that encoded the old comparison were re-expressed as SUBPROCESS tests, because staleness is a property of the program that runs and cannot be tested in-process. CLASS BOOT-A REGISTERED: a fix to a mechanism that propagates changes cannot propagate itself; the acceptance test is running the CONSUMER''s existing copy against the new source, never the new copy against a fixture. ACCEPTANCE, MEASURED on a simulated consumer holding a genuine pre-fix applier taken from git history: refreshed the documented way, its declined `# pack-apply: decline spikes/` line was NOT re-appended and the record survived. Red-first: 5 new tests, 3 red before the fix - and two of those were caught passing VACUOUSLY first (argparse errored, so the assertion inspected empty output), which is the same not-proving-anything failure this whole revision is about. Counts unchanged (see `counts:` above).' }
  - { type: changed, area: scripts, paths: ['scripts/pack-apply.py', 'commands/updatepack/SKILL.md', 'adapters/INSTALL.md', 'tests/docs_explorer/test_pack_apply.py'], deploy: 'BEFORE ANYTHING ELSE, copy pack/scripts/pack-apply.py to docs/ai-forward-pack/scripts/ BY HAND, then run plan/apply. The deployment map is that program and a refresh runs the TARGET''s copy, so the fix cannot install itself. pack-apply now prints a STALE-APPLIER row and refuses to apply when the running copy differs from the source''s; --allow-stale is the recorded exception and applies the OLD map. Then re-copy pack-apply.py (it is also one of the files the map deploys) and re-run `updatepack`''s preview as normal.', summary: 'THE DEPLOYMENT MAP IS A PROGRAM, SO IT IS ITS OWN BOOTSTRAP PROBLEM. Found by verifying rev 64 from the CONSUMER side rather than trusting it. `/updatepack` runs the TARGET''s installed docs/ai-forward-pack/scripts/pack-apply.py, so revision 64 - whose whole point was a change to pack-apply.py - could not protect the very refresh that installs it: the old copy computes the plan, and the new copy is merely one of the files it copies. MEASURED 2026-09-09 against a real consuming repo sitting at revision 63, planning against revision-64 source: `.gitignore | UPDATE | added spikes/, .agents/*, !.agents/artifacts.yml` - both of the lines that repo had explicitly declined, and exactly what revision 64 exists to withhold. The identical plan run with the rev-64 script instead reported `KEEP  withheld spikes/: the repo records # pack-apply: decline spikes/` and `KEEP  withheld .agents/*: the repo tracks 21 file(s) under .agents/ beyond the registry`. So the mechanism was right and unreachable. NEW: pack-apply compares the running copy with the source''s, prints a STALE-APPLIER row on `plan` (the table you just read was computed by the OLD map) and REFUSES to `apply`, naming the one file to copy; --allow-stale is the escape and says in its own help that it applies the old map. An absent or unreadable copy is NOT reported as stale - a fresh install has none, and absent is not evidence (R4). The `updatepack` skill now copies the program as its first mechanical step, which is why the refusal should never fire in the normal path. ALSO: a withheld blanket now takes its own exception with it - proposing `!.agents/artifacts.yml` while withholding `.agents/*` left an inert negation and told the reader the opposite of the KEEP row beside it. Red-first: 6 new tests, 4 red before the fix. VERIFIED FOR REVISION 64, all measured on the pushed state: origin/main tip a49b16c, 0 ahead 0 behind; all three GitHub Actions workflows green on that SHA (the commit BEFORE this work had pack-consistency red on a stale docs-index.js graphSha256, which these sync runs incidentally fixed); and a FRESH CLONE of the pushed repo passes all 11 verify-bundle gates - the anti-drift check, since the earlier green was a working tree with its own state in it. Counts unchanged (see `counts:` above).' }
  - { type: changed, area: coordination, paths: ['scripts/coord-core.py', 'scripts/pack-doctor.py', 'scripts/pack-apply.py', 'knowledge/continuous-improvement.md', 'knowledge/ui-visual-assets.md', 'knowledge/audit-and-change-log.md', 'commands/execute-with-coordination/SKILL.md', 'commands/prepare-for-coordination/SKILL.md', 'adapters/copilot/prompts/execute-with-coordination.prompt.md', 'adapters/copilot/prompts/prepare-for-coordination.prompt.md', 'adapters/managed-blocks/AGENTS.block.md', 'adapters/INSTALL.md', 'tests/docs_explorer/test_coord_worktree_config.py', 'tests/docs_explorer/test_pack_apply.py', 'tests/docs_explorer/test_audit_log.py'], deploy: 'copy coord-core.py, pack-doctor.py and pack-apply.py to docs/ai-forward-pack/scripts/ ; copy continuous-improvement.md, ui-visual-assets.md and audit-and-change-log.md to .claude/knowledge/ and re-wrap into .github/instructions/ (continuous-improvement, ui-visual-assets) and .github/knowledge/ (audit-and-change-log) ; copy the two coordination skills to .claude/skills/ and the two prompts to .github/prompts/ ; RE-PASTE the AGENTS block (one AL4a clause) ; THEN, IN EVERY REPO THAT EVER RAN `coord install` INSIDE A WORKTREE, run `coord-core.py doctor` in the PRIMARY checkout and read the driver-path lines: a COORD-DRIVER-PATH-FOREIGN or -MISSING row means the repository''s merge drivers point into a tree that is gone or going, and `coord-core.py install` in the primary is the repair. Check .git/hooks/pre-commit for a worktree path too - install rewrote both.', summary: 'A WORKTREE SHARES .git/config - THE PACK TAUGHT THE OPPOSITE IN NINE PLACES. Reported and reproduced from a consuming repo. The pack instructed every agent to run `coord install` INSIDE each new worktree, justified as "(per-clone .git/config)". Per-clone is true; therefore-per-worktree does not follow: a linked worktree has no config of its own unless extensions.worktreeConfig is set (off by default), and .git/hooks is shared through the common dir as well. So that install never ADDED a registration - it OVERWROTE the repository''s one registration, and the pre-commit floor with it, using a path inside a temporary tree. MEASURED 2026-09-09 end to end on the real script: install in the primary registered .../primary/...coord-core.py; install in a worktree left `git config --show-origin --get merge.coord-register.driver` reading `file:.git/config` naming .../wt/...coord-core.py, and the shared .git/hooks/pre-commit naming the worktree too; extensions.worktreeConfig unset throughout. WT8 cleanup then deletes that tree and every declared path merges by invoking a script that is not there - with NO signature beforehand, because the rewritten path resolves and names a byte-identical script, and `coord doctor` reported the drivers "declared and registered" either way. THREE FIXES. (1) `coord install` now REFUSES from a linked worktree (COORD-INSTALL-IN-WORKTREE) and names the primary as the remedy; --force is the recorded exception. (2) NEW `coord doctor` check driver_path_status: every registered merge.coord-*.driver must name a path that RESOLVES and does NOT lie inside a linked worktree - the narrow, measured hazard, since a path merely outside the repo is a legitimate out-of-tree install and flagging it would be a false positive (gate 3 caught that over-reach on the check''s first run, which is what a new control''s first run is for) - COORD-DRIVER-PATH-FOREIGN / -MISSING / -UNREADABLE, and an unresolvable path reports NOT-CHECKED rather than passing (R4). That is the check that would have caught this. (3) `coord worktree new` now says the install is NOT needed, and the wrong claim is corrected in all nine surfaces (INSTALL 1.4a, both coordination skills, both Copilot prompts, coord-core, pack-doctor). Red-first: 13 tests, 8 red before the fix, including three that pin git''s actual behaviour so the premise cannot be re-guessed, and a gate that fails if any pack surface teaches the old model again. ALSO, PACK-APPLY NO LONGER REVERSES A REPO''S RECORDED DECISION. A .gitignore is last-match-wins, and this block was a plain append with a literal-string presence check: in a consuming repo it re-appended a blanket `spikes/` twenty-nine lines below a comment recording the opposite decision and won, leaving 117 tracked spike files reachable only with `git add -f` - and a forgotten -f loses evidence with NO signature, because `git add -A` drops a NEW ignored file silently and the commit succeeds. INSTALL 2 had always carried the condition ("add spikes/ ... unless a probe is worth keeping as evidence") and the script applied it unconditionally. Now: a CONDITIONAL line is withheld when the repo''s own tracked files answer its condition; a line the repo already re-includes is REPORTED, never appended; and `# pack-apply: decline <pattern> [why]` makes a declination survive the next refresh - measured, without it deleting the line was undone by the following apply. Every withholding prints a KEEP row: silence was the whole defect. ALSO, THE .agents GITIGNORE IS AN INVARIANT, NOT A LITERAL PATTERN. Rev 63 prescribed `.agents/*` then `!.agents/artifacts.yml` as though the pattern were the rule. The rule is "the registry travels with the repo", and a repo that COMMITS its per-run records under .agents/ (a coordination log, an episode-capture log) satisfies it by the wider route - for that repo the blanket leaves tracked files tracked and hides every NEW record. Measured in THIS repo under its own rule: two .agents/log/*.jsonl tracked and healthy, four newer ones and requests.jsonl invisible, git status silent about all five. INSTALL 1.4a now states the invariant and the verification, and `.agents/*` joined the conditional list. THE VERIFICATION IS `git check-ignore --quiet <path>` (exit 0 = ignored), NEVER `-v`: with -v the exit code means "some pattern matched" and a ! negation counts, so it exits 0 for a re-included path and inverts the answer. Rev 63 recorded that and three surfaces still said `-v` afterwards, one of them ALWAYS-APPLIED (continuous-improvement OPS-B) - so the superseded advice was the copy loaded on every task. Corrected in continuous-improvement.md, ui-visual-assets.md and INSTALL; a gate now fails on `check-ignore -v` in a pack instruction. ALSO, AL4a SAYS WHAT IT MEASURES. The start marker is CONSUMED by the closing append - deliberately, so a stale stamp can never attach a plausible wrong duration to an unrelated entry (IO8). Judged NOT a code defect: measured over this repo''s 162-entry log, 5 of 22 multi-entry sessions carry more than one duration, so the marker does not cap a session at one. The gap was that the two summary sentences never said the marker is one-shot, so a reader who marks once and appends five times reads correct behaviour as a broken gauge. Both now say "one marker measures one run" - one start per RUN, not per session. And the mechanism, asserted in prose in four documents and verified by no test, now has three. Consuming behaviour UNCHANGED. OPEN, NOT FIXED (reported, needs a design decision): audit-log record_start overwrites the session key unconditionally, so two runs sharing one session id and interleaving record a wrong duration - measured, a 2h20m run reporting 0.0s. Narrow (parallel sub-agents logging under one session), absent from the current corpus, and the repair is a keying change, not a wording one. Counts unchanged (see `counts:` above).' }
  - { type: added, area: scripts, paths: ['scripts/audit-log.py', 'tests/docs_explorer/test_audit_selfcheck.py'], deploy: 'copy audit-log.py to docs/ai-forward-pack/scripts/', summary: 'GOAL-STATE GATE (proposal 3.b). audit-log.py selfcheck gains --gate (exit non-zero when a substantive turn in scope recorded no goal-state/tier or exceeded its declared fan-out cap) and --since <ref> (a forward ratchet: consider only entries whose id is absent from that ref''s committed audit log). This promotes the advisory selfcheck - which always returned 0, "a record not an enforcement" - into an enforceable merge gate. Wire it as a required CI/preflight check: `audit-log.py selfcheck --gate --since origin/main`; a PR whose NEW substantive audit entries lack a goal-state or tier, or bust their fan-out cap, fails to merge. Honest limit: a gate enforces the QUALITY of the entries that exist (paired with the audit mandate that skills append as their last action); it cannot force a turn to be recorded - hooks gate actions, gates gate merges, neither makes a model reason. Red-first: 3 new selfcheck tests (gate-on-gap, over-fan-out-cap, since-ratchet) fail on the pre-change code where --gate does not exist. A consuming repo already merging its derived files natively (not via coord-core) may wire this inline in its own preflight orchestrator; the reusable pack form is here so updatepack carries it to every repo.' }
  - { type: added, area: coordination, paths: ['scripts/coord-core.py', 'scripts/pack-doctor.py', 'scripts/pack-apply.py', 'adapters/INSTALL.md'], deploy: 'copy coord-core.py, pack-doctor.py and pack-apply.py to docs/ai-forward-pack/scripts/ ; then RUN the new INSTALL 1.4a step in the target repo: `coord-core.py classify init`, `coord-core.py install`, `coord-core.py doctor`. Check the target .gitignore carries `.agents/*` then `!.agents/artifacts.yml` in that order - pack-apply writes both, but a repo that already had the bare `.agents/` line keeps it and must be corrected by hand.', summary: 'THE COORDINATION LAYER SHIPS SWITCHED ON. Class CTX-H: coord-core.py was 2,308 lines and a 49-test suite proving it works AS A LIBRARY, deployed to every consuming repo and turned on in none - `.agents/artifacts.yml` was parsed and written nowhere, pack-apply named coord only to add a gitignore line, pack-doctor had no coord check and verify-bundle had ten gates and no coord gate. An uninstalled layer reports "0 decisions, nothing claimed", which is indistinguishable from a working layer that saw no traffic, so the absence produced no signal at all. NEW `coord classify init` writes the registry from what the repo actually has - the pack own generated artifacts are the same obligation everywhere, so the registry is DERIVABLE, not authorable - and RUNS every regenerate command before writing it, refusing an entry whose command fails or touches anything outside the set it owns. That control earned itself twice on first contact: it caught that audit-log.py render owns TWO artifacts (audit-data.js and index.html), so a generator owns a SET and a candidate declares `patterns`, not one path; and the pack defaults carry --root/--project because the default project name is the repo DIRECTORY name (PACK-P). The cfd-bench near-miss it exists for: `audit-log.py regen` written from inference, when the subcommand is `render` - a WRONG command resolves every merge silently and leaves the artifact permanently stale while reporting as handled. NEW pack-doctor `coordination` check: FAIL on a repo carrying coord-core.py with no registry or an unparseable one, WARN when .gitattributes declares a driver this clone does not register (.git/config is per-clone, so every fresh clone and every worktree lands there). NEW verify-bundle gate 8b + the matching CI step, asserting the PACK REPO own layer is on - the only end-to-end proof the install path works, and a gate that only ran in a fixture would have passed throughout the two revisions the layer shipped off. GITIGNORE CORRECTED (OPS-B inverted): a bare `.agents/` excludes the DIRECTORY, git never descends into it, so a later negation never fires and the registry - which MUST travel with the repo - was written where git could not see it; the pattern is now `.agents/*` then `!.agents/artifacts.yml`, verified with `git check-ignore --quiet` and `git status`, NOT with `-v` (measured: `-v` prints the negation and exits 0, inverting the answer). ALSO: `hotspot` removed from CLASSES - its only occurrence in 2,308 lines, accepted by the parser, returned by classify(), and then merged exactly like `authored` while the tool reported it handled; the class-to-driver map is hoisted to MERGE_MECHANISMS so the installer builds from one source of truth. Red-first: 22 new tests failed before the code existed (10 classify-init, 10 install-path, 2 owned-set), plus ClassMechanismTests observed red with hotspot still declared. scripts unchanged at 22.' }
  - { type: added, area: skills, paths: ['commands/prepare-for-coordination/SKILL.md', 'commands/execute-with-coordination/SKILL.md', 'adapters/copilot/prompts/prepare-for-coordination.prompt.md', 'adapters/copilot/prompts/execute-with-coordination.prompt.md', 'evals/cases/prepare-for-coordination-01.json', 'evals/cases/execute-with-coordination-01.json', 'adapters/managed-blocks/AGENTS.block.md'], deploy: 'copy both skill directories to .claude/skills/ and both prompts to .github/prompts/ ; RE-PASTE the AGENTS.md managed block (the workflow list and count changed).', summary: 'TWO COORDINATION SKILLS. /prepare-for-coordination turns the layer on FIRST (the highest-ratio move: classification removes most contention and needs no coordination at all, because contention is a property of the ARTIFACT - the six busiest files in the reference repo are all generated, so a lease aimed at authorship addresses a fifth of the problem), then reads the specs, ADRs and architecture, classifies every artifact the work touches, builds a one-way dependency DAG under GO5 independence and the coupling test, names the SERIAL SPINE (until the interfaces are fixed, every track result changes every other track shape), costs the ~15x orchestrator-worker multiplier honestly, and emits docs/coordination/<id>.md (canonical, machine-readable, fixed schema) plus <id>.html (the readable view). It is required to recommend ONE SESSION when that is the honest answer, and to list struck tracks with reasons. /execute-with-coordination takes the coordinator role over that plan: it never authors track work itself, opens one worktree per track (running `coord install` INSIDE each tree, the step people skip), dispatches a CONTRACT rather than a topic (goal, done-when, owned authored paths, tier, fan-out cap, per-branch budget AND a convergence condition - a budget with no convergence condition is a timer), composes through seam requests instead of shared files, runs a loop with a real termination variant, and converges in dependency order with `coord regen` and the INTEGRATED gate set. Both skills qualify each harness delegation mechanism as enforced / observed-only / unsupported from what was actually verified and never advertise a mode they have not exercised; where a harness cannot hold a boundary a track needs, the track becomes a human-session brief or goes serial. Without a plan, /execute-with-coordination calls /prepare-for-coordination first. skills 25->27.' }
  - { type: added, area: scripts, paths: ['scripts/pack-apply.py', 'commands/updatepack/SKILL.md', 'adapters/copilot/prompts/updatepack.prompt.md', 'commands/addpacktorepo/SKILL.md', 'adapters/INSTALL.md'], deploy: 'copy scripts/pack-apply.py to docs/ai-forward-pack/scripts/ ; copy the two skills and the prompt. From here on, run `pack-apply.py plan` then `apply` instead of copying by hand - it applies THIS deployment map, including everything in this entry list.', summary: 'THE DEPLOYMENT MAP AS A PROGRAM. /updatepack and /addpacktorepo hand-applied INSTALL 1, so every step a person could forget was forgotten somewhere: the managed-block re-paste, the STALE WRAPPED COPY of a doc whose load scope moved (five UI docs at rev 60), the CLAUDE.md IMPORT CONVERSION (rev 60), and the repo-local PARITY CONTROL that still asserted the old byte-identical invariant. pack-apply.py does all of it, idempotently: knowledge routed by load: scope with the stale copy in the other Copilot location removed (pack-owned names only - repo-local instruction files are never touched); skills as whole directories; agents renamed and tools:-stripped for Copilot; templates, scripts, hooks, context-budget.json, .github/hooks/ai-forward.json, .claude/settings.json MERGED (hooks + showThinkingSummaries, other keys untouched), .gitignore lines, docs/index.html only if absent, docs/docs-index.js never (V10); AGENTS.md block re-pasted wholesale; CLAUDE.md converted to @AGENTS.md + the addendum with the previous file backed up under docs/ai-forward-pack/retired/ and every paragraph not in AGENTS.md retained; a PowerShell parity test that asserts CLAUDE.md carries the standing-method block rewritten into a shim asserting the import invariant through pack-doctor with its other assertions carried over and the original backed up. REPO-LOCAL DEVIATIONS ARE HONOURED: a destination that differs from the pack text at the installed revision (read from the source clone history) is three-way merged with git merge-file; a conflict leaves the file alone, parks the new text under docs/ai-forward-pack/conflicts/ and is reported for the skill to reconcile. plan writes nothing; apply advances the revision and records the three context-budget baselines. Tests: tests/docs_explorer/test_pack_apply.py (stale copy removed, repo-local instruction kept, conversion with backup + retained paragraphs, shim with carried-over needles, protected surfaces untouched, settings/gitignore merged, deviation kept, second apply is a no-op, fresh install needs --install, the applier agrees with sync-pack on the source repo). scripts 21->22.' }

